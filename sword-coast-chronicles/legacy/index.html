function quickPotion() {
  const p = state.player;
  const heals = ["potion_greater","potion","potion_minor"];
  for (const k of heals) {
    if (p.inv[k] && p.inv[k] > 0) {
      p.inv[k]--;
      const it = ITEMS[k];
      p.hp = Math.min(p.maxHp, p.hp + it.effect.heal);
      spawnFloater(p.gx*TILE+TILE/2, p.gy*TILE+TILE/2-14, `+${it.effect.heal}`, "#80e0a0");
      log(`Drink ${it.name}: +${it.effect.heal} HP.`, "heal");
      // potions don't cost an action
      refreshUI();
      return;
    }
  }
  log("No healing potions.", "system");
}

function attemptFlee() {
  if (state.combat.isBoss) {
    log("You cannot flee from a boss!", "combat");
    return;
  }
  if (Math.random() < 0.6) {
    log("You escape successfully.", "system");
    state.scene = "world";
    state.combat = null;
    refreshUI();
  } else {
    log("Flee fails! Enemies attack.", "combat");
    state.combat.ap = 0; state.combat.moveLeft = 0;
    endPlayerTurn();
  }
}

// ---------- LOCATION TRANSITIONS ----------
function enterLocation(key) {
  const L = LOCATIONS[key];
  state.worldEvent = key;
  if (L.type === "town") {
    state.scene = "town";
    log(`You arrive at ${L.name}.`, "story");
  } else {
    // chance for boss
    if (L.boss && Math.random() < 0.25) state._forceBoss = true;
    log(`You venture into ${L.name}...`, "story");
    startCombat(key, Math.random() < 0.15);
  }
  refreshUI();
}

function randomEncounter() {
  const wilds = Object.keys(LOCATIONS).filter(k => LOCATIONS[k].type !== "town" && LOCATIONS[k].danger <= state.player.level + 2);
  const k = wilds[Math.floor(Math.random()*wilds.length)] || "triboar_trail";
  state.worldEvent = k;
  log(`A random encounter at ${LOCATIONS[k].name}!`, "story");
  startCombat(k);
}

function restAtInn() {
  const cost = 10 + state.player.level * 5;
  if (state.player.gold < cost) {
    log(`You need ${cost} gp to rest.`, "system");
    return;
  }
  state.player.gold -= cost;
  state.player.hp = state.player.maxHp;
  state.player.mp = state.player.maxMp;
  log(`You rest at the inn (-${cost} gp). HP/MP fully restored.`, "heal");
  save();
  refreshUI();
}

function respawn() {
  document.getElementById("deathfade").classList.remove("on");
  state.player.hp = Math.floor(state.player.maxHp * 0.5);
  state.player.mp = Math.floor(state.player.maxMp * 0.5);
  state.player.gold = Math.max(0, Math.floor(state.player.gold * 0.7));
  // last town: phandalin
  state.worldEvent = "phandalin";
  state.scene = "town";
  log("You awaken at the temple in Phandalin. Some of your gold is gone.", "story");
  refreshUI();
}

// ---------- MODALS ----------
function openModal(html, onClose) {
  closeModal();
  const m = document.createElement("div");
  m.className = "modal";
  m.id = "currentModal";
  m.innerHTML = `<div class="box">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => {
    if (e.target === m) closeModal();
  });
  state._modalClose = onClose;
}
function closeModal() {
  const m = document.getElementById("currentModal");
  if (m) {
    m.classList.add("closing");
    m.id = "";
    setTimeout(() => m.remove(), 180);
  }
  if (state._modalClose) { state._modalClose(); state._modalClose = null; }
}

function openClassSelect() {
  let html = `<button class="close" onclick="closeModal()">×</button><h2>Choose Your Class</h2>`;
  html += `<div style="text-align:center;margin-bottom:12px"><input type="text" id="charName" placeholder="Character name" style="max-width:280px" value="Adventurer"/></div>`;
  html += `<div class="class-grid">`;
  for (const k in CLASSES) {
    const c = CLASSES[k];
    html += `<div class="class-card" data-cls="${k}">
      <div class="name" style="color:${c.color}"><img src="icons/${k.toLowerCase()}.svg" style="width:28px;height:28px;filter:drop-shadow(0 0 6px ${c.color}) brightness(1.2);"/> ${k}</div>
      <div class="desc">${c.desc}</div>
      <div class="stats">HP ${c.hp} • ${c.mpName} ${c.mpStart} • STR ${c.str} DEX ${c.dex} CON ${c.con} INT ${c.int} WIS ${c.wis} CHA ${c.cha}</div>
      <div class="stats" style="color:#a8967a">Starts with ${c.weapon}, ${c.armor}, ${c.startGold}gp</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="row center"><button class="btn" id="confirmClass" disabled>Begin Adventure</button></div>`;
  openModal(html);
  let chosen = null;
  document.querySelectorAll(".class-card").forEach(card => {
    card.addEventListener("click", () => {
      document.querySelectorAll(".class-card").forEach(c=>c.classList.remove("selected"));
      card.classList.add("selected");
      chosen = card.dataset.cls;
      document.getElementById("confirmClass").disabled = false;
    });
  });
  document.getElementById("confirmClass").addEventListener("click", () => {
    if (!chosen) return;
    const name = document.getElementById("charName").value || "Adventurer";
    createPlayer(name, chosen);
    closeModal();
    state.scene = "world";
    state.worldEvent = "phandalin";
    enterLocation("phandalin");
  });
}

function createPlayer(name, cls) {
  const c = CLASSES[cls];
  const startWeaponMap = {
    Fighter:"sword_long", Wizard:"staff_apprent", Rogue:"sword_short",
    Cleric:"sword_short", Ranger:"bow_short", Paladin:"sword_long",
    Barbarian:"sword_great", Warlock:"staff_apprent",
  };
  const startArmorMap = {
    Fighter:"armor_chain", Wizard:null, Rogue:"armor_leather",
    Cleric:"armor_chain", Ranger:"armor_leather", Paladin:"armor_plate",
    Barbarian:"armor_leather", Warlock:null,
  };
  state.player = {
    name, cls, color: c.color,
    level: 1, xp: 0,
    maxHp: c.hp, hp: c.hp,
    maxMp: c.mpStart, mp: c.mpStart,
    str: c.str, dex: c.dex, con: c.con, int: c.int, wis: c.wis, cha: c.cha,
    gold: c.startGold,
    weapon: startWeaponMap[cls],
    armor: startArmorMap[cls],
    trinket: null,
    inv: { potion_minor: 2, potion: 1 },
    gx: 8, gy: 6,
  };
  log(`${name} the ${cls} sets out from Phandalin.`, "story");
  refreshUI();
  save();
}

function itemIcon(itemKey) {
  const it = ITEMS[itemKey];
  if (!it) return "potion";
  if (it.type === "potion") return "potion";
  if (it.type === "scroll") return "scroll";
  if (it.slot === "armor") return "armor";
  if (it.slot === "trinket") return "trinket";
  if (it.slot === "weapon") {
    if (itemKey.startsWith("bow_")) return "bow";
    if (itemKey.startsWith("staff_")) return "wizard";
    return "sword";
  }
  return "potion";
}

function openInventory() {
  const p = state.player;
  let html = `<button class="close" onclick="closeModal()">×</button><h2>Inventory & Equipment</h2>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">`;
  html += `<div><h3 style="color:var(--gold)">Equipped</h3>`;
  const slots = [["weapon","Weapon","sword"],["armor","Armor","armor"],["trinket","Trinket","trinket"]];
  for (const [slot, label, defIcon] of slots) {
    const it = p[slot] ? ITEMS[p[slot]] : null;
    const icon = p[slot] ? itemIcon(p[slot]) : defIcon;
    html += `<div class="item-card"><div class="info"><img class="icon-img" src="icons/${icon}.svg" style="opacity:${p[slot]?1:0.3}"/><div class="text"><div class="name">${label}</div><div class="desc">${it?it.name + " — " + it.desc:"<i>none equipped</i>"}</div></div></div></div>`;
  }
  html += `</div><div><h3 style="color:var(--gold)">Carried</h3>`;
  const items = Object.entries(p.inv).filter(([k,v])=>v>0);
  if (items.length === 0) html += `<div style="color:var(--ink-dim);font-size:12px;padding:8px">Nothing in your pack.</div>`;
  for (const [k,v] of items) {
    const it = ITEMS[k];
    html += `<div class="item-card"><div class="info"><img class="icon-img" src="icons/${itemIcon(k)}.svg"/><div class="text"><div class="name">${it.name} ×${v}</div><div class="desc">${it.desc}</div></div></div>`;
    if (it.type === "potion" || it.type === "scroll") {
      html += `<button class="btn" data-use="${k}">Use</button>`;
    } else if (it.slot) {
      html += `<button class="btn" data-equip="${k}">Equip</button>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;
  // recompute stats line
  html += `<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-dim)">
    Total ATK bonus: <b style="color:var(--ink)">+${getEquipBonus("atk")}</b> &nbsp;
    Total DEF bonus: <b style="color:var(--ink)">+${getEquipBonus("def")}</b> &nbsp;
    Max HP bonus: <b style="color:var(--ink)">+${getEquipBonus("maxHp")}</b>
  </div>`;
  openModal(html);
  document.querySelectorAll("[data-use]").forEach(b=>{
    b.onclick = () => useItem(b.dataset.use);
  });
  document.querySelectorAll("[data-equip]").forEach(b=>{
    b.onclick = () => equipItem(b.dataset.equip);
  });
}

function getEquipBonus(stat) {
  const p = state.player;
  let v = 0;
  for (const slot of ["weapon","armor","trinket"]) {
    if (p[slot] && ITEMS[p[slot]] && ITEMS[p[slot]][stat]) v += ITEMS[p[slot]][stat];
  }
  return v;
}

function useItem(k) {
  const p = state.player;
  if (!p.inv[k] || p.inv[k] <= 0) return;
  const it = ITEMS[k];
  if (it.effect.heal) {
    p.hp = Math.min(p.maxHp, p.hp + it.effect.heal);
    log(`Used ${it.name}: +${it.effect.heal} HP.`, "heal");
  }
  if (it.effect.mp) {
    p.mp = Math.min(p.maxMp, p.mp + it.effect.mp);
    log(`Used ${it.name}: +${it.effect.mp} resource.`, "heal");
  }
  if (it.effect.aoe && state.scene === "combat") {
    for (const e of state.combat.enemies) {
      if (!e.alive) continue;
      const dmg = it.effect.aoe + Math.floor(Math.random()*5);
      e.hp -= dmg;
      spawnFloater(e.gx*TILE+TILE/2, e.gy*TILE+TILE/2-14, `-${dmg}🔥`, "#ff7030");
      log(`Scroll hits ${e.name} for ${dmg}.`, "combat");
      if (e.hp <= 0) killEnemy(e);
    }
  }
  if (it.effect.buffDmg && state.scene === "combat") {
    state.combat.buffs.dmg = Math.max(state.combat.buffs.dmg, it.effect.buffDmg);
    state.combat.buffs.turns = Math.max(state.combat.buffs.turns, it.effect.buffTurns);
    log(`${it.name}: +${it.effect.buffDmg} dmg for ${it.effect.buffTurns} turns.`, "combat");
  }
  if (it.effect.buffDef && state.scene === "combat") {
    state.combat.buffs.def = Math.max(state.combat.buffs.def, it.effect.buffDef);
    state.combat.buffs.turns = Math.max(state.combat.buffs.turns, it.effect.buffTurns);
    log(`${it.name}: +${it.effect.buffDef} def for ${it.effect.buffTurns} turns.`, "combat");
  }
  p.inv[k]--;
  closeModal();
  refreshUI();
}

function equipItem(k) {
  const p = state.player;
  const it = ITEMS[k];
  const slot = it.slot;
  // swap
  const old = p[slot];
  p[slot] = k;
  if (p.inv[k]) p.inv[k]--;
  if (old) {
    p.inv[old] = (p.inv[old]||0) + 1;
  }
  // adjust max HP if maxHp bonus
  if (it.maxHp) p.maxHp += it.maxHp;
  if (it.maxMp) p.maxMp += it.maxMp;
  if (old && ITEMS[old].maxHp) p.maxHp -= ITEMS[old].maxHp;
  if (old && ITEMS[old].maxMp) p.maxMp -= ITEMS[old].maxMp;
  log(`Equipped ${it.name}.`, "system");
  closeModal();
  openInventory();
  refreshUI();
}

function openCharacter() {
  const p = state.player;
  const cls = CLASSES[p.cls];
  let html = `<button class="close" onclick="closeModal()">×</button><h2>${p.name} the ${p.cls}</h2>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">`;
  html += `<div><h3 style="color:var(--gold)">Vital Stats</h3>`;
  html += `<div class="stat-row"><span class="lbl">Level</span><span class="v">${p.level}</span></div>`;
  html += `<div class="stat-row"><span class="lbl">XP</span><span class="v">${p.xp} / ${xpToNext(p.level)}</span></div>`;
  html += `<div style="margin:6px 0"><div style="font-size:11px;color:var(--ink-dim)">XP</div><div class="hbar xp"><div style="width:${(p.xp/xpToNext(p.level)*100).toFixed(1)}%"></div></div></div>`;
  html += `<div class="stat-row"><span class="lbl">HP</span><span class="v">${p.hp}/${p.maxHp}</span></div>`;
  html += `<div style="margin:6px 0"><div class="hbar hp"><div style="width:${(p.hp/p.maxHp*100).toFixed(1)}%"></div></div></div>`;
  html += `<div class="stat-row"><span class="lbl">${cls.mpName}</span><span class="v">${p.mp}/${p.maxMp}</span></div>`;
  html += `<div style="margin:6px 0"><div class="hbar mp"><div style="width:${(p.mp/Math.max(1,p.maxMp)*100).toFixed(1)}%"></div></div></div>`;
  html += `<div class="stat-row"><span class="lbl">Gold</span><span class="v">${p.gold} gp</span></div>`;
  html += `</div><div><h3 style="color:var(--gold)">Ability Scores</h3>`;
  for (const s of ["str","dex","con","int","wis","cha"]) {
    const v = p[s];
    const mod = Math.floor((v-10)/2);
    html += `<div class="stat-row"><span class="lbl">${s.toUpperCase()}</span><span class="v">${v} <span style="color:var(--ink-dim)">(${mod>=0?"+"+mod:mod})</span></span></div>`;
  }
  html += `</div></div>`;
  html += `<h3 style="color:var(--gold);margin-top:14px">Combat Tally</h3>`;
  const kills = Object.entries(state.killCounts).map(([k,v])=>`${MONSTERS[k]?MONSTERS[k].name:k}: ${v}`).join(" • ") || "None yet.";
  html += `<div style="font-size:12px;color:var(--ink-dim)">${kills}</div>`;
  openModal(html);
}

function openQuests() {
  let html = `<button class="close" onclick="closeModal()">×</button><h2>Quests</h2>`;
  // Available at current town
  if (state.scene === "town") {
    const giverKey = state.worldEvent;
    const avail = QUESTS_DEFS.filter(q => q.giver === giverKey
      && !state.questsActive.find(a=>a.id===q.id)
      && !state.questsDone.includes(q.id)
      && state.player.level >= q.minLevel);
    html += `<h3 style="color:var(--gold)">Posted at ${LOCATIONS[giverKey].name}</h3>`;
    if (avail.length === 0) html += `<div style="color:var(--ink-dim);font-size:12px">No new postings here right now.</div>`;
    for (const q of avail) {
      html += `<div class="quest"><div class="qt">${q.title}</div><div class="qd">${q.desc}</div>
        <div class="qr">Reward: ${q.reward.gold}gp, ${q.reward.xp}xp${q.reward.item?", "+ITEMS[q.reward.item].name:""}</div>
        <div style="margin-top:6px"><button class="btn" data-accept="${q.id}">Accept</button></div></div>`;
    }
  }
  // Active
  html += `<h3 style="color:var(--gold);margin-top:14px">Active</h3>`;
  if (state.questsActive.length === 0) html += `<div style="color:var(--ink-dim);font-size:12px">None active.</div>`;
  for (const q of state.questsActive) {
    const def = QUESTS_DEFS.find(x=>x.id===q.id);
    if (!def) continue;
    let prog = "";
    if (def.target.kill) prog = `${q.progress||0} / ${def.target.count}`;
    if (def.target.boss) prog = state.bossesSlain[def.target.boss] ? "Slain ✓" : "Not slain";
    const complete = isQuestComplete(q);
    html += `<div class="quest ${complete?"done":""}"><div class="qt">${def.title}</div><div class="qd">${def.desc}</div>
      <div class="qr">Progress: ${prog}</div>
      <div style="margin-top:6px">${complete?`<button class="btn" data-turnin="${q.id}">Turn In</button>`:`<button class="btn" data-abandon="${q.id}">Abandon</button>`}</div></div>`;
  }
  // Completed
  html += `<h3 style="color:var(--gold);margin-top:14px">Completed</h3>`;
  if (state.questsDone.length === 0) html += `<div style="color:var(--ink-dim);font-size:12px">None yet.</div>`;
  for (const id of state.questsDone) {
    const def = QUESTS_DEFS.find(x=>x.id===id); if (!def) continue;
    html += `<div class="quest done"><div class="qt">${def.title}</div><div class="qd">${def.desc}</div></div>`;
  }
  openModal(html);
  document.querySelectorAll("[data-accept]").forEach(b=>b.onclick = () => acceptQuest(b.dataset.accept));
  document.querySelectorAll("[data-turnin]").forEach(b=>b.onclick = () => turnInQuest(b.dataset.turnin));
  document.querySelectorAll("[data-abandon]").forEach(b=>b.onclick = () => { state.questsActive = state.questsActive.filter(q=>q.id!==b.dataset.abandon); closeModal(); openQuests(); });
}

function isQuestComplete(q) {
  const def = QUESTS_DEFS.find(x=>x.id===q.id); if (!def) return false;
  if (def.target.kill) return (q.progress||0) >= def.target.count;
  if (def.target.boss) return !!state.bossesSlain[def.target.boss];
  return false;
}

function acceptQuest(id) {
  state.questsActive.push({ id, progress: 0 });
  log(`Quest accepted: ${QUESTS_DEFS.find(x=>x.id===id).title}`, "system");
  closeModal();
  openQuests();
}

function turnInQuest(id) {
  const def = QUESTS_DEFS.find(x=>x.id===id);
  if (!def) return;
  state.questsActive = state.questsActive.filter(q=>q.id!==id);
  state.questsDone.push(id);
  state.player.gold += def.reward.gold;
  state.player.xp += def.reward.xp;
  if (def.reward.item) {
    state.player.inv[def.reward.item] = (state.player.inv[def.reward.item]||0) + 1;
    log(`Received: ${ITEMS[def.reward.item].name}.`, "gold");
  }
  log(`Quest complete: ${def.title}. +${def.reward.gold}gp, +${def.reward.xp}xp.`, "gold");
  checkLevelUp();
  closeModal();
  openQuests();
  refreshUI();
  save();
}

function openShop(shopKey) {
  const items = SHOP_INVENTORY[shopKey];
  if (!items) return;
  let html = `<button class="close" onclick="closeModal()">×</button><h2>${({general:"General Store",weapons:"Weaponsmith",armor:"Armorer",arcana:"Arcane Emporium",trinkets:"Curios & Trinkets"})[shopKey]}</h2>`;
  html += `<div style="text-align:center;color:var(--ink-dim);font-size:12px">Your gold: <span style="color:var(--gold);font-weight:bold">${state.player.gold} gp</span></div>`;
  html += `<div class="shop-tabs"><button class="active" data-tab="buy">Buy</button><button data-tab="sell">Sell</button></div>`;
  html += `<div id="shopBody"></div>`;
  openModal(html);
  function renderTab(tab) {
    const body = document.getElementById("shopBody");
    let h = `<div class="item-grid">`;
    if (tab === "buy") {
      for (const k of items) {
        const it = ITEMS[k];
        const can = state.player.gold >= it.price;
        h += `<div class="item-card">
          <div class="info"><img class="icon-img" src="icons/${itemIcon(k)}.svg"/><div class="text"><div class="name">${it.name}</div><div class="desc">${it.desc}</div></div></div>
          <div style="text-align:right"><div class="price">${it.price} gp</div>
          <button class="btn" data-buy="${k}" ${can?"":"disabled"} style="margin-top:4px">Buy</button></div></div>`;
      }
    } else {
      const inv = Object.entries(state.player.inv).filter(([k,v])=>v>0);
      if (inv.length === 0) h += `<div style="color:var(--ink-dim);font-size:12px">Nothing to sell.</div>`;
      for (const [k,v] of inv) {
        const it = ITEMS[k];
        const sellPrice = Math.floor(it.price * 0.4);
        h += `<div class="item-card">
          <div class="info"><img class="icon-img" src="icons/${itemIcon(k)}.svg"/><div class="text"><div class="name">${it.name} ×${v}</div><div class="desc">${it.desc}</div></div></div>
          <div style="text-align:right"><div class="price">${sellPrice} gp</div>
          <button class="btn" data-sell="${k}" style="margin-top:4px">Sell 1</button></div></div>`;
      }
    }
    h += `</div>`;
    body.innerHTML = h;
    body.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
      const k = b.dataset.buy;
      const it = ITEMS[k];
      if (state.player.gold < it.price) return;
      state.player.gold -= it.price;
      state.player.inv[k] = (state.player.inv[k]||0) + 1;
      log(`Bought ${it.name} for ${it.price}gp.`, "gold");
      refreshUI(); renderTab("buy");
    });
    body.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{
      const k = b.dataset.sell;
      const it = ITEMS[k];
      if (!state.player.inv[k]) return;
      const sellPrice = Math.floor(it.price * 0.4);
      state.player.inv[k]--;
      state.player.gold += sellPrice;
      log(`Sold ${it.name} for ${sellPrice}gp.`, "gold");
      refreshUI(); renderTab("sell");
    });
  }
  renderTab("buy");
  document.querySelectorAll(".shop-tabs button").forEach(b=>{
    b.onclick = () => {
      document.querySelectorAll(".shop-tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      renderTab(b.dataset.tab);
    };
  });
}

function openOptions() {
  const o = state.options;
  let html = `<button class="close" onclick="closeModal()">×</button><h2>Options</h2>`;
  html += `<div class="options-grid">
    <label><input type="checkbox" id="optGrid" ${o.grid?"checked":""}> Show combat grid</label>
    <label><input type="checkbox" id="optAuto" ${o.autoEndTurn?"checked":""}> Auto end turn when out of actions</label>
    <label><input type="checkbox" id="optFast" ${o.fastAnims?"checked":""}> Fast animations</label>
    <label><input type="checkbox" id="optSound" ${o.sound?"checked":""}> Sound (placeholder)</label>
    <label>Difficulty: <input type="range" id="optDiff" min="0.6" max="1.6" step="0.1" value="${o.difficulty}"></label>
    <label>(<span id="optDiffLbl">${o.difficulty.toFixed(1)}×</span> enemy stats)</label>
  </div>`;
  html += `<div class="row center" style="margin-top:14px">
    <button class="btn" onclick="save(true);log('Saved.','system');closeModal()">Save Game</button>
    <button class="btn" onclick="if(confirm('Load save? Current progress lost.'))load()">Load Game</button>
    <button class="btn" onclick="if(confirm('Wipe save?'))localStorage.removeItem(state.saveSlot)">Wipe Save</button>
  </div>`;
  html += `<div class="hint">Saves are kept in browser storage on this machine.</div>`;
  openModal(html);
  document.getElementById("optGrid").onchange = e => o.grid = e.target.checked;
  document.getElementById("optAuto").onchange = e => o.autoEndTurn = e.target.checked;
  document.getElementById("optFast").onchange = e => o.fastAnims = e.target.checked;
  document.getElementById("optSound").onchange = e => o.sound = e.target.checked;
  document.getElementById("optDiff").oninput = e => {
    o.difficulty = parseFloat(e.target.value);
    document.getElementById("optDiffLbl").textContent = o.difficulty.toFixed(1)+"×";
  };
}

function openWorldMap() {
  state.scene = "world";
  refreshUI();
}

// ---------- SAVE/LOAD ----------
function save(showLog) {
  try {
    const data = {
      player: state.player,
      questsActive: state.questsActive,
      questsDone: state.questsDone,
      killCounts: state.killCounts,
      bossesSlain: state.bossesSlain,
      options: state.options,
      worldEvent: state.worldEvent,
      scene: state.scene === "combat" || state.scene === "gameover" ? "world" : state.scene,
    };
    localStorage.setItem(state.saveSlot, JSON.stringify(data));
    if (showLog) log("Game saved.", "system");
  } catch(e) {
    log("Save failed: " + e.message, "system");
  }
}
function load() {
  try {
    const raw = localStorage.getItem(state.saveSlot);
    if (!raw) { log("No save found.", "system"); return; }
    const data = JSON.parse(raw);
    state.player = data.player;
    state.questsActive = data.questsActive || [];
    state.questsDone = data.questsDone || [];
    state.killCounts = data.killCounts || {};
    state.bossesSlain = data.bossesSlain || {};
    state.options = Object.assign(state.options, data.options || {});
    state.worldEvent = data.worldEvent || "phandalin";
    state.scene = data.scene || "world";
    closeModal();
    log("Game loaded.", "system");
    refreshUI();
  } catch(e) {
    log("Load failed: " + e.message, "system");
  }
}

// ---------- INPUT ----------
cnv.addEventListener("click", e => {
  const r = cnv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cnv.width / r.width);
  const y = (e.clientY - r.top) * (cnv.height / r.height);
  if (state.scene === "title") {
    openClassSelect();
    return;
  }
  if (state.scene === "world") {
    // check location markers
    for (const k in LOCATIONS) {
      const L = LOCATIONS[k];
      if (Math.hypot(x - L.x, y - L.y) < 20) {
        enterLocation(k);
        return;
      }
    }
  }
  if (state.scene === "town") {
    if (state._townShops) {
      for (const s of state._townShops) {
        if (x >= s.x - s.w/2 && x <= s.x + s.w/2 && y >= s.y - s.h/2 && y <= s.y + s.h/2) {
          if (s.id === "inn") restAtInn();
          else if (s.id === "quests") openQuests();
          else openShop(s.id);
          return;
        }
      }
    }
  }
  if (state.scene === "combat") {
    const gx = Math.floor(x / TILE);
    const gy = Math.floor(y / TILE);
    if (gx>=0 && gx<GRID_W && gy>=0 && gy<GRID_H) combatTileClick(gx, gy);
  }
  if (state.scene === "gameover") {
    respawn();
  }
});

cnv.addEventListener("mousemove", e => {
  const r = cnv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cnv.width / r.width);
  const y = (e.clientY - r.top) * (cnv.height / r.height);
  if (state.scene === "world") {
    state._hoverLoc = null;
    for (const k in LOCATIONS) {
      const L = LOCATIONS[k];
      if (Math.hypot(x - L.x, y - L.y) < 20) state._hoverLoc = k;
    }
  } else if (state.scene === "town") {
    state._hoverShop = null;
    if (state._townShops) {
      for (const s of state._townShops) {
        if (x >= s.x - s.w/2 && x <= s.x + s.w/2 && y >= s.y - s.h/2 && y <= s.y + s.h/2) state._hoverShop = s.id;
      }
    }
  } else if (state.scene === "combat") {
    state._hoverTile = [Math.floor(x/TILE), Math.floor(y/TILE)];
  }
});

document.addEventListener("keydown", e => {
  if (document.getElementById("currentModal")) {
    if (e.key === "Escape") closeModal();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "i") openInventory();
  else if (k === "c") openCharacter();
  else if (k === "q") openQuests();
  else if (k === "m") { state.scene = "world"; refreshUI(); }
  else if (k === "escape") {
    if (state.scene === "town" || state.scene === "combat") {
      // no-op for combat; from town go to world
      if (state.scene === "town") { state.scene = "world"; refreshUI(); }
    }
  }
  else if (k === " ") { if (state.scene === "combat" && state.combat.turn === "player") endPlayerTurn(); }
  // Movement in combat
  else if (state.scene === "combat" && state.combat.turn === "player" && !state.combat.anim) {
    const p = state.player; const c = state.combat;
    let dx=0, dy=0;
    if (k === "w" || e.key === "ArrowUp") dy=-1;
    else if (k === "s" || e.key === "ArrowDown") dy=1;
    else if (k === "a" || e.key === "ArrowLeft") dx=-1;
    else if (k === "d" || e.key === "ArrowRight") dx=1;
    if (dx||dy) {
      const nx = p.gx+dx, ny = p.gy+dy;
      if (nx>=0&&nx<GRID_W&&ny>=0&&ny<GRID_H) {
        const en = enemyAt(nx,ny);
        if (en) doBasicAttack(en);
        else if (c.moveLeft > 0) {
          c.moveLeft--;
          animateMove(p, nx, ny, () => { refreshUI(); checkTurnEnd(); });
          refreshUI();
        }
      }
      e.preventDefault();
    }
  }
  // Save/Load shortcuts
  else if (k === "s" && e.ctrlKey) { e.preventDefault(); save(true); }
  else if (k === "l" && e.ctrlKey) { e.preventDefault(); load(); }
});

document.getElementById("btnInv").onclick = openInventory;
document.getElementById("btnChar").onclick = openCharacter;
document.getElementById("btnQuests").onclick = openQuests;
document.getElementById("btnMap").onclick = openWorldMap;
document.getElementById("btnOptions").onclick = openOptions;

// ---------- INIT ----------
log("Welcome to the Sword Coast.", "story");
log("Tip: from a town, take quests at the Quest Board, then travel out to wilds and dungeons to slay foes.", "system");
refreshUI();

</script>
