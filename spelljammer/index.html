<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelljammer — Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script>
/* Settle the theme BEFORE first paint. The main script does this too, but it
   runs at the end of the body — long enough for a dark-mode visitor to get a
   full-screen flash of parchment on the boot screen. */
try{if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}
</script>
<style>
  :root{
    color-scheme:light;
    --paper:#EFE4CB;
    --ink:#33281A;
    /* every gazetteer label, kicker, seed line, stat caption and lock chip is
       --ink-soft at 9-11px. #7C6B4E on this paper is 4.09:1 — under AA for
       text that small. #6B5A3E is 5.2:1 and still reads as a soft sepia.
       Dark's own --ink-soft already passes and is left alone. */
    --ink-soft:#6B5A3E;
    --hairline:#D6C7A4;
    --clay:#B4502B;
    --clay-dark:#9C4222;
    --clay-text:#F6EEDD;
    --pill-bg:rgba(239,228,203,.93);
    --paper-t:rgba(239,228,203,0);
    --glow-op:.8;
    --sun-op:.96;
    --grain:
      radial-gradient(34% 30% at 4% 4%, rgba(146,110,56,.07), transparent 70%),
      radial-gradient(30% 26% at 97% 6%, rgba(146,110,56,.06), transparent 70%),
      radial-gradient(34% 30% at 95% 96%, rgba(146,110,56,.07), transparent 70%),
      radial-gradient(28% 26% at 3% 94%, rgba(146,110,56,.06), transparent 70%),
      radial-gradient(140% 140% at 50% 45%, transparent 62%, rgba(104,74,32,.1));
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --paper:#0D1014;
    --ink:#E9E6DC;
    --ink-soft:#8B928B;
    --hairline:#2A3038;
    --clay:#D65F3D;
    --clay-dark:#C14D2E;
    --clay-text:#14100D;
    --pill-bg:rgba(13,16,20,.90);
    --paper-t:rgba(13,16,20,0);
    --glow-op:1;
    --sun-op:1;
    --grain:radial-gradient(140% 140% at 50% 45%, transparent 62%, rgba(0,0,0,.3));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}

  /* ---------- boot screen ---------- */
  .boot{
    position:fixed;inset:0;z-index:60;
    background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,3.4vh,34px);
    transition:opacity .55s ease;
  }
  .boot.gone{opacity:0;pointer-events:none}
  .boot-mark{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(20px,3vw,30px);letter-spacing:.34em;
    text-indent:.34em;                 /* the tracking is trailing-side only */
    color:var(--ink);
  }
  /* an orrery in miniature — the same hairline rings and clay pip the System
     view uses, so the wait belongs to the same publication */
  .boot-dial{position:relative;width:86px;height:86px}
  .boot-dial .ring{
    position:absolute;border-radius:50%;display:block;
    border:1px solid var(--hairline);
  }
  .boot-dial .outer{inset:0;border-style:dashed;animation:bootSpin 14s linear infinite}
  .boot-dial .inner{inset:22px;animation:bootSpin 9s linear infinite reverse}
  .boot-dial .pip{
    position:absolute;left:50%;top:-4px;
    width:8px;height:8px;margin-left:-4px;border-radius:50%;
    background:var(--clay);display:block;
    transform-origin:4px 47px;
    animation:bootSpin 2.4s linear infinite;
  }
  @keyframes bootSpin{to{transform:rotate(360deg)}}
  .boot-note{
    font-family:'Jost',sans-serif;font-weight:300;
    font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  @media (prefers-reduced-motion: reduce){
    .boot-dial .outer,.boot-dial .inner,.boot-dial .pip{animation:none}
  }
  /* Keyboard focus had no treatment at all: the UA ring is drawn against the
     browser's own default colours and disappears entirely on the clay pills.
     One rule covers every control because every control here is a real button,
     input or [tabindex] element. */
  :focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:2px}
  .btn:focus-visible,.lock:focus-visible,.navbtn:focus-visible,
  .theme-toggle:focus-visible{outline-offset:2px;border-radius:999px}
  ::selection{background:var(--clay);color:var(--clay-text)}
  ::-moz-selection{background:var(--clay);color:var(--clay-text)}
  html{scroll-behavior:smooth;overflow:hidden}
  body{
    background-color:var(--paper);
    background-image:var(--grain);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
    height:100svh;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:background-color .35s ease,color .35s ease;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:clamp(14px,2.4vw,26px) clamp(18px,3.4vw,44px) clamp(8px,1.4vw,18px);
    position:relative;z-index:8;   /* stays above a zoomed planet */
  }
  .brand{display:flex;align-items:baseline;gap:26px;min-width:0}
  .logo{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-size:clamp(19px,2.4vw,28px);letter-spacing:.26em;
    white-space:nowrap;
  }
  nav{display:flex;align-items:center;gap:clamp(10px,1.6vw,20px)}
  .navbtn{
    display:flex;align-items:center;gap:8px;
    background:none;border:1px solid var(--hairline);border-radius:999px;
    padding:9px 15px;cursor:pointer;color:var(--ink);
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  }
  .navbtn:hover{color:var(--clay);border-color:var(--clay)}
  .navbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.3}
  .navbtn em{font-style:normal;color:var(--clay);letter-spacing:0}
  .navbtn.on{border-color:var(--clay);color:var(--clay)}
  .iconbtn{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:2px;display:flex;flex-shrink:0;
  }
  .iconbtn:hover{color:var(--clay)}
  .iconbtn[disabled]{opacity:.28;pointer-events:none}
  .iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}
  .iconbtn.on svg{fill:var(--clay);stroke:var(--clay)}
  .iconbtn.on{color:var(--clay)}
  .theme-toggle{
    background:none;border:1px solid var(--hairline);border-radius:999px;
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
  }
  .theme-toggle:hover{color:var(--clay);border-color:var(--clay)}
  .theme-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
  .icon-moon{display:none}
  [data-theme="dark"] .icon-sun{display:none}
  [data-theme="dark"] .icon-moon{display:block}

  /* ---------- hero grid ---------- */
  .hero{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center;
    gap:clamp(16px,2.6vw,40px);
    padding:0 clamp(18px,3.4vw,44px) clamp(14px,2.4vh,28px);
    flex:1;min-height:0;
    max-width:1560px;margin:0 auto;width:100%;
  }
  .stage{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    min-height:0;height:100%;
    /* Deliberately NOT clipped: a big or zoomed world is meant to run past the
       stage and slide under the gazetteer. The panel's own scrim (z-index 7)
       is what keeps the text legible, so the world dissolves into paper at the
       column edge instead of being cut off. */
    user-select:none;-webkit-user-select:none;
  }
  /* clean clearing of plain paper behind the planet so grain doesn't interfere */
  .stage::before{
    content:"";position:absolute;inset:-4%;
    background:radial-gradient(closest-side at 50% 50%, var(--paper) 42%, var(--paper-t) 92%);
    pointer-events:none;
  }
  .orb-wrap{
    position:relative;
    width:min(44vw,64vh,620px);
    aspect-ratio:1/1;
    transition:opacity .4s ease;
  }
  /* A ringed world is sized from the RING's outer extent, not the planet's.
     The ring art reaches 93% of the orb-wrap width to either side (66.4% of a
     box inset by -90% = 186% wide), so a ringed planet has to shrink until that
     whole span — ansae included — fits inside .stage, which now clips. 50% of
     the stage puts the ansae at 0.92 of its half-width: complete, with margin. */
  .orb-wrap.ringed{width:min(50%,46vh,360px)}
  .orb-wrap.smooth{transition:opacity .4s ease,transform .55s cubic-bezier(.3,.7,.3,1)}
  /* Pale, warm worlds — arid, oxide, husk, glacial, salt flat — sit at almost
     the same value as the parchment, so their lit limb dissolved into the page
     and the body lost its silhouette entirely. A soft contact shadow under the
     sphere gives the edge something to be read against. Only on a round body:
     a circular shadow behind a cube or a hoop would be a lie. */
  :root:not([data-theme="dark"]) .orb-wrap.round::before{
    content:"";position:absolute;inset:1.5%;border-radius:50%;
    box-shadow:0 14px 34px -12px rgba(74,54,26,.5),0 2px 10px -4px rgba(74,54,26,.30);
    z-index:0;pointer-events:none;
  }
  /* a hoop is genuinely open at the centre — the glow behind it would fill the
     hole and render the world as a solid donut, contradicting the FORM row */
  .orb-wrap.hoop .orb-glow{display:none}
  /* A hoop's projected bounding box is 2R wide by 2R*sin(phi) tall, so at the
     same wrap width it always covers less of the stage than a sphere. It gets a
     wider box to spend that on: the vh term is the one that actually binds on a
     laptop-height screen, which is where the hoop looked smallest. */
  .orb-wrap.hoop{width:min(46vw,72vh,660px)}
  .orb-glow{
    position:absolute;inset:-7%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(110,195,200,.38) 0%, rgba(0,0,0,0) 62%);
    filter:blur(16px);
    opacity:var(--glow-op);
    pointer-events:none;
    z-index:0;
  }
  canvas#orb{
    position:relative;z-index:2;
    width:100%;height:100%;
    cursor:grab;
    touch-action:none;
  }
  canvas#orb.grabbing{cursor:grabbing}

  /* Rings. A CSS mask clips to its own element box, so .ring is oversized to
     280% of the planet: the ring art is 186% wide and its rotateZ spin swells
     the bounding box by up to a further √2. Anything tighter shears the ansae
     off. .ring i is sized as a fraction of this box so the art keeps its size:
     66.4% × 280% = 186% of the planet, as before. */
  .ring{position:absolute;inset:-90%;pointer-events:none;display:none}
  .rings-on .ring{display:block}
  /* The far and near halves are separate layers so the planet can sit between
     them. Complementary soft masks crossfade them through the midline, so the
     far half's dimming reads as depth instead of a hard seam. */
  /* Each half also gets a horizontal fade, intersected with the crossfade, so
     the ansae dissolve instead of ever meeting a hard cut at the stage edge.
     The painted ring spans 17.3%-82.7% of this (2.8x oversized) box, so the
     8%->17% ramp sits exactly on the outermost tips: invisible in the normal
     case, a soft feather in any case where the art would otherwise be sheared. */
  .ring.back{
    z-index:1;opacity:.9;filter:brightness(.84);
    -webkit-mask-image:
      linear-gradient(to bottom,#000 0 46%,rgba(0,0,0,.5) 50%,transparent 54%),
      linear-gradient(to right,transparent 8%,#000 17%,#000 83%,transparent 92%);
    mask-image:
      linear-gradient(to bottom,#000 0 46%,rgba(0,0,0,.5) 50%,transparent 54%),
      linear-gradient(to right,transparent 8%,#000 17%,#000 83%,transparent 92%);
    -webkit-mask-composite:source-in;
    mask-composite:intersect;
  }
  .ring.front{
    z-index:3;
    -webkit-mask-image:
      linear-gradient(to bottom,transparent 46%,rgba(0,0,0,.5) 50%,#000 54% 100%),
      linear-gradient(to right,transparent 8%,#000 17%,#000 83%,transparent 92%);
    mask-image:
      linear-gradient(to bottom,transparent 46%,rgba(0,0,0,.5) 50%,#000 54% 100%),
      linear-gradient(to right,transparent 8%,#000 17%,#000 83%,transparent 92%);
    -webkit-mask-composite:source-in;
    mask-composite:intersect;
  }
  .ring i{
    position:absolute;left:50%;top:50%;
    width:66.4%;aspect-ratio:1/1;
    background-size:100% 100%;
    transform:translate(-50%,-50%) rotateX(74deg);
  }
  /* Pale ring dust over cream came out a washed grey while the panel promised
     "Rings of pale rose glass". brightness() is a straight multiply, so it
     preserves the ring's own rgb ratios — pushing them DOWN toward the
     almanac's brown-black lets the tint finally show, and the saturate() on top
     recovers the chroma the darkening costs. Dark theme leaves the art alone.
     Kept as a variable, like CUBE_AMB_FLOOR_LIGHT/DARK, so the theme switch is
     the only thing that decides it. */
  :root{--ring-filter:brightness(.40) saturate(2.1) contrast(1.14)}
  [data-theme="dark"]{--ring-filter:none}
  .ring i.tex{filter:var(--ring-filter)}
  /* .ring i.shade carries the planet's baked umbra texture; it tilts
     with the ring plane but does not spin with the ring grain */

  /* moons */
  #moons{position:absolute;inset:0;pointer-events:none}
  canvas.moon{
    position:absolute;left:50%;top:50%;
    will-change:transform;
  }

  /* suns: a luminous core plus two counter-rotating corona layers
     whose opacity breathes — the star shimmers and flares */
  #suns{position:absolute;inset:0;pointer-events:none}
  .sunwrap{position:absolute;opacity:var(--sun-op);animation:sunbob 18s ease-in-out infinite alternate}
  /* on parchment the star needs its warmth pushed, not washed to grey */
  :root:not([data-theme="dark"]) .sunwrap{filter:saturate(1.45) contrast(1.06)}
  .sunwrap canvas{position:absolute;left:0;top:0}
  .sun-core{animation:sunPulse 9s ease-in-out infinite}
  .sun-cor.a{animation:corSpinA 85s linear infinite,corFlare 13s ease-in-out infinite}
  .sun-cor.b{animation:corSpinB 140s linear infinite,corFlare 19s ease-in-out infinite reverse;opacity:.85}
  @keyframes sunbob{from{transform:translateY(0)}to{transform:translateY(10px)}}
  @keyframes sunPulse{0%,100%{filter:brightness(1)}30%{filter:brightness(1.08)}55%{filter:brightness(.97)}78%{filter:brightness(1.13)}}
  @keyframes corSpinA{to{transform:rotate(360deg)}}
  @keyframes corSpinB{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes corFlare{0%,100%{opacity:.55}18%{opacity:.92}37%{opacity:.62}58%{opacity:1}79%{opacity:.68}}

  .stars i{
    position:absolute;border-radius:50%;
    background:var(--ink);
    opacity:calc(var(--o));
    width:3px;height:3px;
  }
  [data-theme="dark"] .stars i{opacity:calc(var(--o)*3.2);background:#DDE4EA}

  /* control pill */
  /* A zoomed world reaches under both of these, and at .85 alpha with a 5px
     blur the labels were sitting unreadably on dark terrain. Denser fill, a
     real blur, and a hairline lift so the pill stays an object on the page. */
  .controls{
    position:absolute;left:0;bottom:24px;z-index:6;
    display:flex;align-items:center;
    border:1px solid var(--hairline);
    border-radius:999px;
    background:var(--pill-bg);
    backdrop-filter:blur(10px) saturate(1.15);
    -webkit-backdrop-filter:blur(10px) saturate(1.15);
    box-shadow:0 2px 14px -6px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .controls button{
    display:flex;align-items:center;gap:9px;
    padding:12px clamp(13px,1.6vw,20px);
    background:none;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);
  }
  .controls button + button{border-left:1px solid var(--hairline)}
  .controls button:hover{color:var(--clay)}
  .controls svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4}
  .controls .off{opacity:.4}
  .hint{
    position:absolute;left:0;bottom:2px;z-index:6;
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);
    white-space:nowrap;
    padding:3px 9px;border-radius:999px;
    background:var(--pill-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }

  /* ---------- right panel ----------
     The column used to be a flex box that scrolled as a whole. On any window
     under ~620px tall that put the primary CTA below the fold — and because
     .actions scrolled away with everything else, the pills were sheared in half
     by the window edge with no scrollbar and no affordance at all.
     It is a GRID instead, and the one track that is allowed to give is the
     gazetteer's (track 4, minmax(0,auto)). Every other track sits at its
     natural height, so the hook, the lock chips and both buttons are pinned and
     always whole; only the table loses rows, and it scrolls to get them back.
     align-content:center keeps the old behaviour on a tall screen: the leftover
     space collects above and below the whole column rather than inside it. */
  .panel{
    max-width:680px;min-width:0;
    height:100%;min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto auto minmax(0,auto) auto auto auto;
    align-content:center;
    gap:clamp(10px,1.8vh,20px);
    padding:4px 12px 4px 24px;
    overflow:hidden;
    position:relative;z-index:7;
    /* The world slides under this. Solid by the time it reaches the text
       (padding-left is 24px), so the planet dissolves in the gutter rather
       than washing out the gazetteer. */
    background:linear-gradient(90deg,var(--paper-t) 0,var(--paper) 26px,var(--paper) 88%,var(--paper-t) 100%);
  }
  .kicker-row{display:flex;align-items:center;gap:16px}
  .kicker{
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--ink-soft);line-height:1.9;white-space:nowrap;
  }
  .kicker-line{flex:1;height:1px;background:var(--hairline)}
  .backlink{
    background:none;border:none;cursor:pointer;padding:0;
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--clay);
    white-space:nowrap;
  }
  .backlink:hover{text-decoration:underline}

  /* panel tabs */
  .tabs{display:flex;align-items:flex-end;gap:22px}
  .tab{
    background:none;border:none;cursor:pointer;padding:0 0 7px;
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink)}
  /* The rail and the active tab's underline were both 1px var(--ink), so the
     two read as one continuous rule with a gap punched in it rather than as a
     tab sitting on a rail. The rail drops to the hairline; the active tab takes
     a 2px clay bar, which is the accent this page already uses for "current". */
  .tab.on{color:var(--ink);border-bottom-color:var(--clay);border-bottom-width:2px}
  .tabs-line{flex:1;height:1px;background:var(--hairline);margin-bottom:0}

  /* lock chips */
  .locks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .locks>span{
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-soft);margin-right:2px;
  }
  .lock{
    background:none;border:1px solid var(--hairline);border-radius:999px;
    padding:5px 12px;cursor:pointer;color:var(--ink-soft);
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  }
  .lock:hover{color:var(--ink);border-color:var(--ink-soft)}
  .lock.on{color:var(--clay);border-color:var(--clay)}

  /* nowrap: a long name used to push the stat strip onto a second line, which
     moved the whole header 52px. The name column shrinks instead, and
     fitTitle() scales the type down so the row is always exactly one line. */
  .title-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:clamp(14px,2vw,30px);flex-wrap:nowrap;
  }
  .title-row>div:first-child{flex:1 1 auto;min-width:0}
  h1#planetName{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(32px,3.9vw,58px);
    letter-spacing:.015em;
    line-height:1;
    font-variant:small-caps;
    margin-bottom:8px;
    white-space:nowrap;
  }
  .seed{
    font-size:11px;letter-spacing:.34em;color:var(--ink-soft);
    text-transform:uppercase;
    background:none;border:none;cursor:pointer;padding:0;
    font-family:'Jost',sans-serif;font-weight:300;
    display:inline-flex;align-items:center;gap:8px;
  }
  .seed:hover{color:var(--clay)}
  .seed svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.5}
  .seed-input{
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink);background:none;caret-color:var(--clay);
    border:none;border-bottom:1px solid var(--clay);
    outline:none;padding:0 0 2px;width:180px;
  }
  /* the field replaces the seed button in place, so it already carries the
     clay underline as its focus affordance — but only while it is focused */
  .seed-input:focus-visible{outline:none}

  .statline{display:flex;flex-shrink:0}
  /* Each cell is sized by the longer of its value and its caption, and with no
     text-align the shorter one sat flush left in it — a lone "4" with ~100px of
     void beside it under "CONTINENTS". Centring pairs them on one axis. */
  .stat{padding:2px clamp(12px,1.4vw,22px) 2px 0;min-width:0;text-align:center}
  .stat + .stat{border-left:1px solid var(--hairline);padding-left:clamp(12px,1.4vw,22px)}
  .stat:last-child{padding-right:0}
  /* Cormorant defaults to old-style figures: 1 draws at x-height, 3/5/7/9 have
     descenders. "1 CONTINENT" beside a full-height 8 read as "I CONTINENT".
     Lining figures put every digit on the cap line; tabular keeps the stat
     strip from reflowing as the numbers change. */
  .stat b,.entry b,.ros b,.sv b{
    font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:'lnum' 1,'tnum' 1;
  }
  .stat b{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(20px,1.9vw,30px);letter-spacing:.02em;display:block;
    white-space:nowrap;
  }
  .stat span{
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);display:block;margin-top:4px;
  }

  /* ---------- gazetteer (in-panel) ----------
     Both tabs are rendered and stacked in one grid cell, so the block always
     occupies the taller of the two. Switching tabs therefore cannot change the
     panel's height, and the header above it stops jumping 52px on every click. */
  /* the ONE thing in the panel that is allowed to scroll */
  .gaz-stack{
    display:grid;grid-template-columns:minmax(0,1fr);
    min-height:0;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--hairline) transparent;
  }
  /* ...and when it does, its bottom edge dissolves instead of being cut, so the
     table visibly continues past the hook rather than simply stopping */
  .gaz-stack.scrolls{
    -webkit-mask-image:linear-gradient(to bottom,#000 0 calc(100% - 30px),transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0 calc(100% - 30px),transparent 100%);
  }
  .gaz-stack.scrolls.at-end{-webkit-mask-image:none;mask-image:none}
  .gaz-stack>.gaz-grid{grid-area:1/1}
  /* align-content:start is load-bearing. The stack cell stands at the taller
     tab's height, so the shorter tab's grid is stretched to match — and a grid
     with auto rows distributes that surplus into EVERY row. Port of Call rows
     came out at ~88px against Survey's 41px for the same content, every
     hairline floating 45px below its text. Packing the rows at the top gives
     each its natural height and collects the slack at the bottom, where it is
     invisible. The stack's own height is unchanged, so the header still cannot
     jump when the tab is switched. */
  .gaz-grid{
    display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(20px,3vw,44px);
    align-content:start;
    border-top:1px solid var(--ink);
  }
  .gaz-grid[data-off]{visibility:hidden;pointer-events:none}
  /* Label above value, not beside it.
     Ranged right against a flush-left label, a value had ~186px of a ~290px
     column to work in at 13-16px type, so nearly every entry broke to two or
     three lines and hung a one-word orphan — or a hyphen — alone at the right
     margin. Stacked, the value owns the whole column: the same text sets in
     fewer lines, ends flush left, and never orphans. hyphens:none forbids the
     hanging hyphen outright; text-wrap:pretty asks the browser to even the
     last line where it can. */
  .entry{
    display:block;
    padding:clamp(5px,.95vh,9px) 0;
    border-bottom:1px solid var(--hairline);
  }
  .entry span{
    display:block;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:2px;
  }
  .entry b{
    display:block;
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(13.5px,1.15vw,16px);line-height:1.3;
    text-align:left;
    text-wrap:pretty;hyphens:none;-webkit-hyphens:none;
    overflow-wrap:break-word;
  }
  .hook span{
    font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--clay);
    display:block;margin-bottom:6px;
  }
  .hook p{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:clamp(15px,1.4vw,19px);line-height:1.4;max-width:60ch;
    text-wrap:pretty;hyphens:none;-webkit-hyphens:none;
  }

  .actions{display:flex;gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    flex:1;padding:clamp(12px,1.8vh,16px) 18px;
    border-radius:999px;cursor:pointer;
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    white-space:nowrap;
    transition:transform .15s ease, background .2s ease, color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}
  .btn-outline{background:none;border:1px solid var(--ink);color:var(--ink)}
  .btn-outline:hover{background:rgba(127,127,127,.08)}
  .btn-fill{background:var(--clay);border:1px solid var(--clay);color:var(--clay-text)}
  .btn-fill:hover{background:var(--clay-dark)}
  .btn[disabled]{opacity:.55;pointer-events:none}

  /* ---------- crystal sphere view ---------- */
  .system{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    align-items:center;
    gap:clamp(16px,2.6vw,40px);
    padding:0 clamp(18px,3.4vw,44px) clamp(14px,2.4vh,28px);
    flex:1;min-height:0;
    max-width:1560px;margin:0 auto;width:100%;
  }
  .system[hidden]{display:none}
  .orrery-wrap{
    position:relative;height:100%;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  #orrery{width:min(100%,74vh);height:min(100%,74vh);overflow:visible}
  .orb-line{fill:none;stroke:var(--hairline);stroke-width:.16}
  .orb-line.dash{stroke-dasharray:.9 1.1}
  .orr-tick{stroke:var(--hairline);stroke-width:.14}
  .orr-star{filter:blur(.4px)}
  /* Dark theme's orrery was already right; everything below is the light one,
     where a formless pale-cream radial blur on cream paper read as a print
     smudge and five flat saturated dots were the loudest marks on a page whose
     discipline elsewhere is sepia plus one clay accent. The star becomes a
     STROKED object with an engraved ray burst; the dots are muted toward the
     paper and given an ink ring so they are marks rather than highlights. */
  circle.orr-body{stroke:none}
  .orr-rays line{stroke:var(--ink);stroke-width:.17;opacity:.5}
  [data-theme="dark"] .orr-rays{display:none}
  :root:not([data-theme="dark"]) circle.orr-body{stroke:var(--ink);stroke-width:.24}
  :root{--orr-dot-stroke:var(--ink);--orr-dot-w:.17}
  [data-theme="dark"]{--orr-dot-stroke:var(--paper);--orr-dot-w:.22}
  .orr-world{cursor:pointer}
  .orr-world circle.body{stroke:var(--orr-dot-stroke);stroke-width:var(--orr-dot-w)}
  /* a paper-coloured stroke UNDER the fill, so an orbit ring that passes behind
     a name is knocked out of its letterforms instead of running through them */
  .orr-world text{
    font-family:'Jost',sans-serif;font-size:1.85px;font-weight:400;
    letter-spacing:.14px;text-transform:uppercase;fill:var(--ink-soft);
    paint-order:stroke fill;
    stroke:var(--paper);stroke-width:.72px;stroke-linejoin:round;
  }
  /* the tick that says which world a displaced label belongs to */
  .orr-lead{stroke:var(--hairline);stroke-width:.15;fill:none}
  .orr-world:hover .orr-lead{stroke:var(--clay)}
  .orr-world:hover circle.body{stroke:var(--clay);stroke-width:.4}
  .orr-world:hover text{fill:var(--clay)}
  .orr-world circle.halo{fill:none;stroke:var(--clay);stroke-width:.25;opacity:0}
  .orr-world:hover circle.halo{opacity:.8}
  /* The sphere panel has five children, not seven, and gutters exist between
     every pair of tracks whether or not they hold anything — so inheriting the
     world panel's seven rows left two phantom gaps under the CTA. Its own
     template puts the roster on the flexible track and stops there. */
  .sys-panel{grid-template-rows:auto auto auto minmax(0,auto) auto}
  /* the roster is the part that gives when the window is short — the sphere's
     own CTA row stays pinned, like the world view's */
  .sys-roster{overflow-y:auto;min-height:0;scrollbar-width:thin}
  .sys-panel h1{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(30px,3.4vw,50px);line-height:1;font-variant:small-caps;
  }
  .sys-roster{display:flex;flex-direction:column;border-top:1px solid var(--ink);min-width:0}
  .ros{
    display:flex;align-items:center;gap:14px;
    padding:clamp(6px,1.1vh,10px) 0;
    border-bottom:1px solid var(--hairline);
    background:none;border-left:none;border-right:none;border-top:none;
    cursor:pointer;text-align:left;width:100%;color:var(--ink);
    font-family:'Jost',sans-serif;
  }
  .ros:hover{color:var(--clay)}
  .ros i{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:block}
  .ros b{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:17px;
    white-space:nowrap;
  }
  .ros u{
    text-decoration:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);margin-left:auto;text-align:right;
  }

  /* ---------- saved drawer ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .scrim[hidden]{display:none}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;width:min(400px,88vw);z-index:21;
    background:var(--paper);border-left:1px solid var(--hairline);
    padding:26px clamp(18px,2.4vw,28px);
    display:flex;flex-direction:column;gap:14px;
    box-shadow:-30px 0 60px -30px rgba(0,0,0,.5);
  }
  /* In dark the drawer computed to the same near-black as the body, so it read
     as the gazetteer being hard-clipped mid-word rather than as a panel. Give it
     a real elevated surface, a stronger left edge, and a deeper scrim. */
  [data-theme="dark"] .scrim{background:rgba(0,0,0,.62)}
  [data-theme="dark"] .drawer{
    background:#14181E;
    border-left:1px solid #39434F;
    box-shadow:-1px 0 0 rgba(255,255,255,.05),-40px 0 70px -24px rgba(0,0,0,.85);
  }
  [data-theme="dark"] .drawer .sv{border-bottom-color:#2E3641}
  [data-theme="dark"] .drawer-head{border-bottom-color:#59646F}
  /* Light had the mirror-image problem: the drawer computed to the same
     parchment as the page, so it read as no panel at all, and a neutral black
     scrim turned the warm paper behind it olive. Warm surface, warm scrim. */
  :root:not([data-theme="dark"]) .scrim{background:rgba(58,42,20,.42)}
  :root:not([data-theme="dark"]) .drawer{
    background:#F7EFDD;
    border-left:1px solid #C6B48E;
    box-shadow:-1px 0 0 rgba(255,255,255,.7),-40px 0 70px -26px rgba(74,54,26,.42);
  }
  /* a pale climate dot (frozen, husk) is invisible against either surface */
  .sv i,.ros i{box-shadow:inset 0 0 0 1px rgba(94,74,42,.45)}
  [data-theme="dark"] .sv i,[data-theme="dark"] .ros i{
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .drawer[hidden]{display:none}
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--ink);padding-bottom:12px;
  }
  .drawer-head h2{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:24px;font-variant:small-caps;letter-spacing:.02em;
  }
  .drawer-list{display:flex;flex-direction:column;overflow-y:auto;min-height:0}
  .sv{
    display:flex;align-items:center;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--hairline);
  }
  .sv i{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .sv .who{flex:1;min-width:0}
  .sv b{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:18px;
    display:block;cursor:pointer;
  }
  .sv b:hover{color:var(--clay)}
  .sv span{
    display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);margin-top:3px;
  }
  .drawer-empty{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;
    color:var(--ink-soft);padding:18px 0;
  }

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:30;
    background:var(--ink);color:var(--paper);
    padding:11px 20px;border-radius:999px;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    pointer-events:none;
  }
  .toast[hidden]{display:none}

  /* ---------- print / handout ---------- */
  @media print{
    :root{--paper:#fff;--ink:#000;--ink-soft:#555;--hairline:#bbb;--clay:#8a3a1c}
    html,body{overflow:visible;height:auto;background:#fff}
    header nav,.controls,.hint,.actions,.locks,.tabs,#suns,.stars,.drawer,.scrim,.toast{display:none!important}
    .hero{display:block;padding:0}
    .stage{page-break-inside:avoid;height:auto;padding-bottom:18px;overflow:visible}
    .orb-wrap,.orb-wrap.ringed{width:340px;margin:0 auto}
    .panel{
      max-width:none;height:auto;background:none;padding:0;overflow:visible;
      display:block;grid-template-rows:none;
    }
    .panel>*+*{margin-top:14px}
    .gaz-stack{overflow:visible;min-height:0;-webkit-mask-image:none;mask-image:none}
    .gaz-grid{break-inside:avoid}
    .gaz-grid[data-off]{display:none}
  }

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .system{grid-template-columns:1fr;gap:10px}
    #orrery{width:min(92vw,54vh);height:min(92vw,54vh)}
    body{height:auto;min-height:100svh;display:block;overflow-x:hidden;overflow-y:auto}
    .hero{
      grid-template-columns:1fr;
      gap:8px;
      padding-bottom:26px;
    }
    /* Stacked layout: the panel is below the stage, not beside it, so the ring
       has nothing to bleed onto. The pill and the hint used to hang off .stage
       on negative offsets, which put the hint's x-height exactly under the
       panel's top edge on every phone — it was sliced in half horizontally.
       Here they are real blocks in a column flow instead, so nothing can
       overlap them and no magic padding has to be kept in sync. */
    .stage{padding-bottom:6px;height:auto;overflow:visible;flex-direction:column}
    .orb-wrap{width:min(86vw,52vh,470px);margin:0 auto}
    /* 1.86x this width is the ring's full span; keep it inside the viewport */
    .orb-wrap.ringed{width:min(52vw,34vh,300px)}
    /* .orb-wrap.hoop outranks the bare .orb-wrap above on specificity, so the
       desktop hoop box would otherwise follow it into this band and render a
       hoop at 46vw on a phone. Restate it here, wider, since the stacked
       layout gives the stage the whole viewport width. */
    .orb-wrap.hoop{width:min(92vw,56vh,500px)}
    .controls{position:static;transform:none;left:auto;bottom:auto;margin:14px auto 0}
    .hint{
      position:static;transform:none;left:auto;bottom:auto;
      text-align:center;margin:10px 0 0;white-space:normal;
      background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;
    }
    /* stacked layout: nothing is height-constrained, so the grid goes back to
       auto rows packed at the top and the gazetteer stops being a scroller */
    .panel{
      max-width:none;height:auto;padding:14px 0 24px;overflow:visible;
      grid-template-rows:none;align-content:start;
    }
    .gaz-stack{overflow:visible;min-height:0;-webkit-mask-image:none;mask-image:none}
    .sys-roster{overflow:visible}
    .title-row{align-items:flex-start;flex-direction:column;flex-wrap:wrap}
    .title-row>div:first-child{width:100%}
    h1#planetName{white-space:normal;overflow-wrap:anywhere}
    /* three equal cells with a rule on both outer edges, so the strip reads as
       a bounded table rather than three sizes of ragged column */
    .statline{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
    .stat{padding:2px 8px}
    .stat+.stat{padding-left:8px}
    .stat:last-child{padding-right:8px;border-right:1px solid var(--hairline)}
  }
  @media (max-width:640px){
    .gaz-grid{grid-template-columns:1fr;column-gap:0}
    .entry b{font-size:15px}
    .actions{flex-direction:column}
  }
  /* narrow screens keep the icons and drop the words */
  @media (max-width:560px){
    .navbtn span{display:none}
    .navbtn{padding:9px 11px;gap:6px}
    .controls button{padding:12px 13px}
    .controls button span{display:none}
    .controls svg{width:17px;height:17px}
  }
  /* ---- the 961-1150px band: a non-maximised window on a 1440/1600 display.
     Wide enough to still be the two-column desktop layout, too narrow for any
     of its parts at full size. Three separate things overflowed here:
       - .controls is inside .stage, which clips, so the word pill was sheared
         mid-word ("...CLOUDS · CLI"). It gets the same icon-only treatment the
         phone band already uses.
       - .actions needed 443px in a 396px column, so the primary CTA lost its
         right cap. The pills step down and are allowed to shrink below their
         content width (flex items default to min-width:auto).
       - .entry b at max-width:70% produced one-word rags in the gazetteer. ---- */
  /* The word pill measures 518px and the stage is 521px wide at 1150 — three
     pixels of clearance, so the icon-only band runs to 1200 rather than exactly
     to where the shear starts. At 1201 the pill has ~25px of room. */
  @media (min-width:961px) and (max-width:1200px){
    .controls button{padding:12px 12px}
    .controls button span{display:none}
    .controls svg{width:16px;height:16px}
  }
  @media (min-width:961px) and (max-width:1150px){
    .btn{font-size:10px;letter-spacing:.16em;gap:9px;padding-left:12px;padding-right:12px}
    .btn svg{width:14px;height:14px}
    .actions{gap:9px}
    /* the gazetteer column is only ~190px here; tightening the label tracking
       keeps the caption on one line above its value */
    .entry span{letter-spacing:.12em}
  }
  /* a flex item will not shrink past its content unless it is told it may */
  .btn{min-width:0}
  @media (max-width:420px){
    .stat span{letter-spacing:.16em}
    .seed{letter-spacing:.26em}
  }
  /* Laptop-height desktops. A 1366x768 or 1440x900 screen minus browser chrome
     lands in the 561-820px band, which had no rule at all: the panel column was
     taller than the viewport, body{overflow:hidden} meant no scroll, and the
     primary CTA was pushed clean off the bottom. Everything tightens here so it
     fits outright; .panel's overflow-y is the backstop below that. */
  @media (max-height:820px) and (min-width:961px){
    header{padding:clamp(8px,1.4vw,14px) clamp(18px,3.4vw,44px) clamp(4px,.8vw,9px)}
    .hero{gap:clamp(12px,2vw,28px);padding-bottom:clamp(6px,1.2vh,14px)}
    .panel{gap:clamp(5px,1vh,11px)}
    h1#planetName{font-size:clamp(27px,2.9vw,42px);margin-bottom:3px}
    .stat b{font-size:clamp(17px,1.5vw,24px)}
    .stat span{margin-top:2px}
    .kicker{line-height:1.6}
    .tab{padding-bottom:5px}
    .entry{padding:clamp(2px,.62vh,6px) 0}
    .entry b{font-size:clamp(12px,1vw,14.5px)}
    .hook span{margin-bottom:3px}
    .hook p{font-size:clamp(13px,1.15vw,16px);line-height:1.32}
    .lock{padding:4px 10px}
    .btn{padding:clamp(8px,1.15vh,13px) 16px}
  }
  /* Under 640px of window the gazetteer is the only thing with slack left to
     give, so its rows are trimmed hard before it starts scrolling — four or
     five more entries stay on screen for the same pixels. */
  @media (max-height:640px) and (min-width:961px){
    .panel{gap:clamp(4px,.8vh,9px)}
    .entry{padding:2px 0}
    .entry b{font-size:clamp(11.5px,.95vw,13.5px);line-height:1.24}
    .entry span{font-size:8.5px;margin-bottom:1px}
    .hook p{font-size:clamp(12.5px,1.05vw,14.5px);line-height:1.28}
    .hook span{font-size:9px;margin-bottom:2px}
    h1#planetName{font-size:clamp(24px,2.5vw,34px);margin-bottom:2px}
    .stat b{font-size:clamp(15px,1.3vw,20px)}
    .lock{padding:3px 9px}
    .btn{padding:9px 14px;font-size:10px}
  }
  @media (max-height:560px) and (min-width:960px){
    .orb-wrap{width:min(38vw,54vh)}
    .orb-wrap.ringed{width:min(50%,34vh,300px)}
  }
  @media (prefers-reduced-motion: reduce){
    .orb-wrap,.orb-wrap.smooth{transition:opacity .4s ease}
    .sunwrap,.sunwrap canvas{animation:none}
  }
</style>
</head>
<body>

<!-- Covers the placeholder markup and the empty canvas until the first world
     has actually been built and the display face has loaded. -->
<div class="boot" id="boot">
  <div class="boot-mark">SPELLJAMMER</div>
  <div class="boot-dial">
    <i class="ring outer"></i>
    <i class="ring inner"></i>
    <i class="pip"></i>
  </div>
  <div class="boot-note">Charting the first world</div>
</div>

<header>
  <div class="brand">
    <div class="logo">SPELLJAMMER</div>
  </div>
  <nav>
    <button class="navbtn" id="btnSystem">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><ellipse cx="12" cy="12" rx="9.4" ry="4.2"/><ellipse cx="12" cy="12" rx="9.4" ry="4.2" transform="rotate(60 12 12)"/></svg>
      <span>System</span>
    </button>
    <button class="navbtn" id="btnSaved">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2Z"/></svg>
      <span>Saved</span><em id="savedCount"></em>
    </button>
    <button class="theme-toggle" id="btnTheme" aria-label="Toggle light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
    </button>
  </nav>
</header>

<main class="hero">
  <section class="stage" id="stage">
    <div id="suns"></div>
    <div class="stars" id="stars"></div>
    <div class="orb-wrap" id="orbWrap">
      <div class="orb-glow" id="orbGlow"></div>

/* =========================================================
   RNG + NOISE
========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash3(x,y,z,s){
  let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177)+s)|0;
  h=Math.imul(h^(h>>>13),1103515245);
  h^=h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,y,z,s){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const c000=hash3(xi,yi,zi,s),      c100=hash3(xi+1,yi,zi,s);
  const c010=hash3(xi,yi+1,zi,s),    c110=hash3(xi+1,yi+1,zi,s);
  const c001=hash3(xi,yi,zi+1,s),    c101=hash3(xi+1,yi,zi+1,s);
  const c011=hash3(xi,yi+1,zi+1,s),  c111=hash3(xi+1,yi+1,zi+1,s);
  const x00=c000+(c100-c000)*u, x10=c010+(c110-c010)*u;
  const x01=c001+(c101-c001)*u, x11=c011+(c111-c011)*u;
  const y0=x00+(x10-x00)*v, y1=x01+(x11-x01)*v;
  return y0+(y1-y0)*w;
}
function fbm(x,y,z,s,oct){
  let a=0.5,f=1,sum=0,amp=0;
  for(let i=0;i<oct;i++){
    sum+=a*vnoise(x*f,y*f,z*f,s+i*911);
    amp+=a; a*=0.5; f*=2.03;
  }
  return sum/amp;
}
function worley(x,y,z,s){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  let best=9;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const cx=xi+dx,cy=yi+dy,cz=zi+dz;
    const fx=cx+hash3(cx,cy,cz,s), fy=cy+hash3(cx,cy,cz,s+31), fz=cz+hash3(cx,cy,cz,s+77);
    const ddx=fx-x,ddy=fy-y,ddz=fz-z;
    const d=ddx*ddx+ddy*ddy+ddz*ddz;
    if(d<best)best=d;
  }
  return Math.sqrt(best);
}
/* Saturation, value and a warm/cool tint — the half of palette variation a hue
   rotation cannot supply. Rotating the hue of a grey returns the same grey, so
   on the desaturated ramps (glacial, husk, salt flat, basalt) hueShift alone is
   a no-op and every world of that climate came out identical. This is what
   actually separates them. */
function tone(rgb,sat,val,tint){
  if(sat==null)return rgb;
  const l=0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];
  const c=x=>x<0?0:x>255?255:x;
  return[c((l+(rgb[0]-l)*sat)*val*tint[0]),
         c((l+(rgb[1]-l)*sat)*val*tint[1]),
         c((l+(rgb[2]-l)*sat)*val*tint[2])];
}
/* hue rotation for palette variation */
function hueShift(rgb,deg){
  const rad=deg*Math.PI/180,cs=Math.cos(rad),sn=Math.sin(rad);
  const m=[
    0.213+cs*0.787-sn*0.213, 0.715-cs*0.715-sn*0.715, 0.072-cs*0.072+sn*0.928,
    0.213-cs*0.213+sn*0.143, 0.715+cs*0.285+sn*0.140, 0.072-cs*0.072-sn*0.283,
    0.213-cs*0.213-sn*0.787, 0.715-cs*0.715+sn*0.715, 0.072+cs*0.928+sn*0.072
  ];
  const[r,g,b]=rgb;
  return[
    Math.max(0,Math.min(255,r*m[0]+g*m[1]+b*m[2])),
    Math.max(0,Math.min(255,r*m[3]+g*m[4]+b*m[5])),
    Math.max(0,Math.min(255,r*m[6]+g*m[7]+b*m[8]))
  ];
}
