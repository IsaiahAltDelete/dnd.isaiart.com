/* =========================================================
   PHONOTACTIC NAME FORGE
   Names are assembled syllable by syllable (onset + nucleus
   + coda) with join logic — no vowel pileups, no doubled
   letters or heavy clusters at seams, no diphthong runs —
   then blended with the old word-part method.
========================================================= */
const P_ONSETS=[["",9],["b",6],["d",6],["f",4],["g",4],["h",4],["k",6],["l",7],["m",7],["n",6],["p",4],["r",7],["s",7],["t",7],["v",6],["w",2],["y",2],["z",2],["th",4],["sh",3],["ch",2],["ph",1.5],["br",2.5],["cr",2.5],["dr",2.5],["gr",2.5],["tr",2.5],["kr",1.5],["vr",1.5],["thr",1.5],["st",2],["sk",1.5],["sl",1.5],["gl",1.5],["bl",1.5],["fl",1.5],["pl",1.5],["qu",1]];
const P_NUCLEI=[["a",10],["e",9],["i",7],["o",8],["u",5],["ae",2],["ai",2],["au",1.5],["ea",2],["ei",1.5],["ia",1.5],["io",1.5],["oa",1],["ou",1.5],["y",2]];
const P_CODAS=[["",9],["l",4],["n",6],["r",6],["s",4],["m",3],["th",2.5],["nd",2],["rn",1.5],["ll",1.5],["st",1.5],["sk",1],["x",1],["k",2],["d",2],["g",1],["rm",1],["ld",1.5],["nt",1.5]];
const P_CODAS_END=P_CODAS.filter(c=>c[0]!=="");
const VOW="aeiouy";
function wpick(rng,tbl){
  let t=0;for(const e of tbl)t+=e[1];
  let r=rng()*t;
  for(const e of tbl){if((r-=e[1])<=0)return e[0]}
  return tbl[0][0];
}
function forgeWord(rng,nSyl,endCons){
  let out="",prevCo="",prevNu="";
  for(let i=0;i<nSyl;i++){
    const first=i===0,final=i===nSyl-1;
    let on=wpick(rng,P_ONSETS);
    if(!first&&on==="")on="lrn"[(rng()*3)|0];       /* interior syllables need an onset */
    if(prevCo&&on&&(prevCo[prevCo.length-1]===on[0]||prevCo.length+on.length>2)){
      out=out.slice(0,out.length-prevCo.length);     /* seam too heavy — drop the coda */
      prevCo="";
    }
    if(on&&out&&out[out.length-1]===on[0]){      /* no doubled letters at seams */
      const alt="lrnd".replace(out[out.length-1],"");
      on=alt[(rng()*alt.length)|0];
    }
    let nu=wpick(rng,P_NUCLEI);
    if(prevNu.length>1&&nu.length>1)nu=nu[0];        /* no back-to-back diphthongs */
    let co=final?(endCons?wpick(rng,P_CODAS_END):wpick(rng,P_CODAS))
               :(rng()<0.62?"":wpick(rng,P_CODAS)); /* interiors stay mostly open */
    out+=on+nu+co;
    prevCo=co;prevNu=nu;
  }
  return out;
}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function makeName(rng){
  const m=rng();
  let n;
  if(m<0.38){
    n=forgeWord(rng,2+((rng()*2)|0),rng()<0.7);      /* pure forged name */
  }else if(m<0.72){
    n=forgeWord(rng,1+((rng()*2)|0),false);          /* forged stem + word part */
    const back=pick(rng,NAME_BACK);
    if(n[n.length-1]===back[0])n=n.slice(0,-1);
    if(!VOW.includes(n[n.length-1])&&n.length>2&&!VOW.includes(n[n.length-2]))n=n.slice(0,-1);
    n+=back;
  }else{
    const f=pick(rng,NAME_FRONT),b=pick(rng,NAME_BACK);
    const mid=rng()<0.15?pick(rng,NAME_MID):"";      /* classic word-part name */
    n=f+mid+b;
  }
  return cap(n);
}
function makeMoonName(rng){
  return rng()<0.5?pick(rng,MOON_NAMES):cap(forgeWord(rng,1+((rng()*2)|0),rng()<0.5));
}
/* seed strings hash to a 32-bit world seed */
function hashSeedString(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  h=Math.imul(h^(h>>>16),2246822507);
  h=Math.imul(h^(h>>>13),3266489909);
  return (h^(h>>>16))>>>0;
}

function pick(rng,arr){return arr[(rng()*arr.length)|0]}
/* Pools whose entries name terrain carry the climate ids they suit (c:0 = any).
   Filter to what fits, and fall back to the neutral subset when a climate has
   nothing of its own — never to the unfiltered pool, which is the bug. */
/* a climate matches its own id plus every id it names as kin, so an added
   climate inherits the tagged lines of the ones it sits between */
function climKin(cl){return cl.kin?[cl.id].concat(cl.kin):[cl.id]}
function pickTagged(rng,arr,cl){
  const ids=climKin(cl);
  let ok=arr.filter(e=>e.c===0||e.c.some(id=>ids.indexOf(id)>=0));
  if(!ok.length)ok=arr.filter(e=>e.c===0);
  return ok[(rng()*ok.length)|0].t;
}
/* HOOKS was the one content pool that was never climate-gated, so 20 of the 40
   "tallest tree" rolls landed on arid, husk and volcanic worlds, and 46
   lighthouse / bay / tide / harbour hooks landed on worlds with under 12%
   ocean. It carries the same `c` field AGRI and HAZARD do, plus a `sea` flag
   for anything that needs a coastline to make sense. */
const HOOK_SEA_MIN=0.2;
function hookOK(hk,ids,ocean,hasMoon){
  if(hk.c!==0&&!hk.c.some(id=>ids.indexOf(id)>=0))return false;
  if(hk.sea&&ocean<HOOK_SEA_MIN)return false;
  if(!hasMoon&&hk.t.indexOf("{moonName}")>=0)return false;
  return true;
}
function hookPool(cl,ocean,hasMoon){
  const ids=climKin(cl);
  let ok=HOOKS.filter(hk=>hookOK(hk,ids,ocean,hasMoon));
  if(!ok.length)ok=HOOKS.filter(hk=>hk.c===0&&!hk.sea&&(hasMoon||hk.t.indexOf("{moonName}")<0));
  return ok;
}
function pickN(rng,arr,n){
  const c=[...arr],out=[];
  while(out.length<n&&c.length){out.push(c.splice((rng()*c.length)|0,1)[0])}
  return out;
}
function pickWeighted(rng,arr){
  let t=0;for(const a of arr)t+=a.w;
  let r=rng()*t;
  for(const a of arr){if((r-=a.w)<=0)return a}
  return arr[0];
}
function fmtPop(n){
  if(n>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,"")+" billion";
  if(n>=1e6)return Math.round(n/1e6)+" million";
  if(n>=1e3)return Math.round(n/1e3).toLocaleString()+",000";
  return "None recorded";
}

function generateWorld(seedNum,climIdx){
  const rng=mulberry32(seedNum);
  /* name */
  const name=makeName(rng);
  let numeral=rng()<0.16?" "+pick(rng,ROMAN):"";
  /* the code IS the seed: base36 world seed, plus climate override if any */
  const code=seedNum.toString(36).toUpperCase()+(climIdx!=null?"-C"+climIdx:"");
  /* climate & physicals (forced climate consumes the same rng draws) */
  let climate=pick(rng,CLIMATES);
  if(climIdx!=null)climate=CLIMATES[climIdx%CLIMATES.length];
  /* Ocean fraction is STEERED by the climate, not owned by it. With the band
     fixed, every glacial world came out at the same 30-60% water; widened by a
     per-world amount it can be ice caps over open sea or an almost total
     whiteout, and two verdant worlds are no longer obliged to have the same
     amount of it. */
  const owid=0.09+rng()*0.24;
  const oLo=Math.max(0.015,climate.ocean[0]-owid);
  const oHi=Math.min(0.96,climate.ocean[1]+owid);
  const ocean=oLo+rng()*(oHi-oLo);
  const day=10+((rng()*28)|0);
  const year=(90+(rng()*640)|0);
  const gravity=(0.55+rng()*0.9);
  /* moons */
  const moonCount=(rng()*4.2)|0;
  const moonNames=[];
  while(moonNames.length<Math.max(moonCount,1)){
    const mn=makeMoonName(rng);
    if(!moonNames.includes(mn))moonNames.push(mn);
  }
  const MOON_TONES=[
    [[216,210,198],[118,112,102]],
    [[228,233,236],[132,146,156]],
    [[219,182,140],[124,94,66]],
    [[203,140,113],[106,66,52]],
    [[187,198,182],[96,110,96]]
  ];
  const moonsVis=[];
  for(let i=0;i<moonCount;i++){
    moonsVis.push({
      size:13+rng()*16,
      dist:1.14+rng()*0.42,   /* orbit clears the planet's limb — no clipping at the swap */
      incl:0.12+rng()*0.22,
      speed:(0.00009+rng()*0.00022)*(rng()<0.22?-1:1),
      a:rng()*Math.PI*2,
      tone:pick(rng,MOON_TONES),
      tseed:(rng()*1e9)|0
    });
  }
  /* suns: each gets an azimuth around the planet, a screen distance,
     a depth (how frontal its light is), and a luminosity */
  const sr=rng();
  const sunCount=sr<0.78?1:(sr<0.965?2:3);
  const suns=[];
  const baseTheta=-Math.PI*(0.12+0.76*rng());
  for(let i=0;i<sunCount;i++){
    const t=pickWeighted(rng,SUN_TYPES);
    let theta=baseTheta;
    if(i===1)theta=baseTheta+(rng()<0.5?-1:1)*(1.0+rng()*1.3);
    if(i===2)theta=baseTheta+(baseTheta>-Math.PI/2?-1:1)*(1.6+rng()*1.2);
    const size=64+rng()*66;
    suns.push({
      name:(rng()<0.5?cap(forgeWord(rng,1,true)):pick(rng,NAME_FRONT))+pick(rng,SUN_SUFFIX),
      kind:t.kind,core:t.core,tint:t.tint,
      lum:t.lum*(0.85+size/130*0.3),
      theta,zf:0.25+rng()*0.35,
      distF:1.38+rng()*0.5,size
    });
  }
  /* rings */
  const RING_TONES=[[214,196,158],[196,208,216],[201,166,201],[176,166,152]];
  let rings=rng()<0.24?{rgb:pick(rng,RING_TONES),rseed:(rng()*1e9)|0,desc:pick(rng,RING_DESC)}:null;
  /* terrain character. contFreq is off the climate too: a world with two great
     continents and one with forty islands should both be available at any
     latitude band. */
  const contFreq=0.95+rng()*1.95;
  const detAmp=0.22+rng()*0.18;
  const cloudCov=Math.max(0.02,Math.min(0.85,climate.cloud+(rng()-0.5)*0.18));
  const hue=(rng()-0.5)*26;
  /* ---- PER-WORLD PALETTE ------------------------------------------------------
     Climate owned the whole palette and there were only ten of them, so three
     "Glacial & aurora-lit" spheres in eight rolls were indistinguishable
     without reading the names — while the text pools run 30-64 wide and read as
     far more varied than the art beside them. hue alone cannot fix it, because
     a hue rotation does nothing to a desaturated ramp, which is exactly what
     the glacial, husk, salt and basalt palettes are. Each world therefore gets
     its own saturation, value and warm/cool tint, applied separately to land
     and sea, plus its own snow line and its own sea-depth falloff. */
  const pal={
    landHue:(rng()-0.5)*24,          /* +-12 degrees, land ramp only        */
    landSat:0.74+rng()*0.56,
    landVal:0.88+rng()*0.26,
    landTint:[1+(rng()-0.5)*0.13,1+(rng()-0.5)*0.10,1+(rng()-0.5)*0.15],
    seaHue:(rng()-0.5)*30,
    seaSat:0.76+rng()*0.52,
    seaVal:0.82+rng()*0.40,
    seaTint:[1+(rng()-0.5)*0.12,1+(rng()-0.5)*0.10,1+(rng()-0.5)*0.17],
    seaFall:0.42+rng()*0.44,         /* how fast the shelf falls to deep    */
    capJit:(rng()-0.5)*0.52          /* the snow line, +-15 degrees of lat  */
  };
  const initTilt=(rng()-0.5)*0.7;
  /* civilization */
  const popBands={high:[8e7,2.4e9],mid:[4e6,3.2e8],low:[4e4,2.2e7],dead:[0,8e4]};
  const pb=popBands[climate.pop];
  const pop=pb[0]+rng()*(pb[1]-pb[0]);
  const peoples=pickN(rng,PEOPLES,2+((rng()*3)|0));
  const gov=pick(rng,GOVERNMENTS);
  const magic=pick(rng,MAGIC);
  const tech=pick(rng,TECH);
  const faith=pick(rng,FAITHS);
  /* one draw, as pick() would take, so an existing seed still yields the same
     world — but the index is kept so agriShort can be looked up alongside it */
  const agriI=(rng()*climate.agri.length)|0;
  const agri=climate.agri[agriI];
  const agriShort=climate.agriShort[agriI];
  const hazard=pick(rng,climate.hazard);
  /* port of call: what a ship's crew needs to know */
  const dead=climate.pop==="dead";
  const port={
    berth:dead?"No berth survives; anchor and row in":pickTagged(rng,PORT_KIND,climate),
    auth:dead?"Nobody collects fees here anymore":pick(rng,PORT_AUTH),
    exports:dead?"Salvage, and whatever the dust gives up":pickTagged(rng,EXPORTS,climate),
    wants:dead?"Nothing. Nobody is left to want":pick(rng,WANTS),
    wildspace:pick(rng,WILDSPACE),
    envelope:pick(rng,ENVELOPE),
    grav:rng()<0.4?pick(rng,GRAV_QUIRK):null,
    ship:{
      name:"The "+cap(forgeWord(rng,2,rng()<0.5)),
      type:pick(rng,SHIP_TYPES),
      crew:pick(rng,SHIP_CREW),
      intent:pick(rng,SHIP_INTENT),
      tag:rng()<0.2?pick(rng,SHIP_TAG):null
    }
  };
  /* not every world is a ball — Spelljammer has flat worlds and hoops */
  const shr=rng();
  const shape=shr<0.9?"sphere":(shr<0.945?"disc":(shr<0.972?"hoop":"cube"));
  if(shape!=="sphere")rings=null;   /* a flat world wears no ring */
  /* The hook is drawn from the pool this world can actually carry: right
     terrain, and a coastline if it needs one. The index is rotated by the
     climate's own position, so cycling the Climate control genuinely moves
     through the hooks instead of landing on the same offset into six
     similarly-sized filtered pools. Still a pure function of (seed, climate),
     so a seed code round-trips to exactly the same world. */
  const hp=hookPool(climate,ocean,!!moonCount);
  const hookTpl=hp[(((rng()*hp.length)|0)+CLIMATES.indexOf(climate)*11)%hp.length].t;
  const w={
    seedNum,climIdx:climIdx!=null?climIdx:null,
    name,numeral,code,climate,ocean,day,year,gravity,shape,port,pal,
    moonCount,moonNames:moonCount?moonNames.slice(0,moonCount):[],moonsVis,
    suns,rings,
    contFreq,detAmp,cloudCov,hue,
    /* A hoop's projected height is 2*sin(phi) against a sphere's 2, and phi is
       0.62+0.8*tilt — so at the generic tilt range a hoop presented barely a
       third of the stage a sphere fills. Its opening tilt is biased upward
       (phi 0.94-1.22, i.e. 81-94% of the full height) so the ring shows its
       face. Drag still reaches every angle. */
    initTilt:shape==="hoop"?0.40+(initTilt+0.35)*0.5:initTilt,
    pop,peoples,gov,magic,tech,faith,agri,agriShort,hazard,hookTpl,
    terrainSeed:(rng()*1e9)|0,
    entryNo:1+((rng()*899)|0)
  };
  w.hook=fillHook(hookTpl,w);
  return w;
}

/* The template is kept on the world so it can be re-filled later: rerollWorld's
   locks carry a name (or a moon roster) over a world that has already had its
   own name baked into the prose, and the hook has to follow. */
function fillHook(tpl,w){
  return tpl
    .replaceAll("{name}",w.name+w.numeral)
    /* templates read "The {gov}", so drop any article the phrase carries */
    .replaceAll("{gov}",w.gov.toLowerCase().replace(/^(a|an|the)\s+/,""))
    .replaceAll("{govHas}",GOV_PLURAL.has(w.gov)?"have":"has")
    .replaceAll("{govIs}",GOV_PLURAL.has(w.gov)?"are":"is")
    .replaceAll("{agriShort}",w.agriShort)
    .replaceAll("{hazardLower}",w.hazard.charAt(0).toLowerCase()+w.hazard.slice(1))
    .replaceAll("{moonName}",w.moonNames[0]||"")
    .replaceAll("{faith}",w.faith)
    .replaceAll("{peopleFirst}",w.peoples[0]);
}

/* Re-roll a world while keeping whatever the user pinned. Climate is kept by
   forcing its index; the rest are copied over the fresh roll. */
/* ---- per-field recently-used buffers ----------------------------------------
   Even with the pools tripled, a session's first dozen rolls kept repeating a
   handful of fields. The obvious fix — rejecting values inside pick() — would
   destroy determinism: generateWorld(n) has to yield exactly the same world for
   the same n forever, or seed URLs and the saved list stop round-tripping.
   So the rejection happens one level up. generateWorld stays pure; rerollWorld
   simply DRAWS ANOTHER RANDOM SEED when the world it got repeats something from
   the last RECENT_N rolls, and keeps the least-repetitive candidate if it runs
   out of tries. Nothing on the deterministic path is touched. */
const RECENT_N=7, RECENT_TRIES=26;
const recent={tech:[],faith:[],gov:[],magic:[],hookTpl:[],ringDesc:[],sunKind:[],
  berth:[],auth:[],exports:[],wants:[],wildspace:[],envelope:[],climate:[]};
function worldTraits(w){
  return {tech:w.tech,faith:w.faith,gov:w.gov,magic:w.magic,hookTpl:w.hookTpl,
    ringDesc:w.rings?w.rings.desc:null,sunKind:w.suns[0].kind,climate:w.climate.id,
    berth:w.port.berth,auth:w.port.auth,exports:w.port.exports,
    wants:w.port.wants,wildspace:w.port.wildspace,envelope:w.port.envelope};
}
/* sunKind has 9 members and climate 10, so a repeat inside a 7-deep window is
   arithmetically unavoidable — counting them the same as a 54-entry government
   pool would make every candidate "fail" and hand the choice back to the
   fallback, which is where the real repeats then leak in. They are scored at a
   third of a point: still a tie-breaker, never a veto. */
const SOFT_FIELD={sunKind:0.34,climate:0.34};
function repeatScore(t){
  let n=0;
  for(const k in t){
    const v=t[k];
    if(v!=null&&recent[k]&&recent[k].indexOf(v)>=0)n+=SOFT_FIELD[k]||1;
  }
  return n;
}
function remember(w){
  const t=worldTraits(w);
  for(const k in t){
    const v=t[k];if(v==null||!recent[k])continue;
    recent[k].push(v);
    if(recent[k].length>RECENT_N)recent[k].shift();
  }
}

const locks={name:false,climate:false,sky:false};
function rerollWorld(prev){
  const ci=locks.climate&&prev?CLIMATES.indexOf(prev.climate):null;
  const mk=s=>applyLocks(generateWorld(s,ci>=0?ci:null),prev,s);
  let w=null,best=null,bestN=1e9;
  for(let i=0;i<RECENT_TRIES;i++){
    const cand=mk((Math.random()*2**31)|0);
    const n=repeatScore(worldTraits(cand));
    if(n<0.9){w=cand;break}          /* no big-pool repeat; soft ones are fine */
    if(n<bestN){bestN=n;best=cand}
  }
  return w||best;
}
function applyLocks(w,prev,seed){
  if(!prev)return w;
  if(locks.name){w.name=prev.name;w.numeral=prev.numeral}
  if(locks.sky){
    w.suns=prev.suns;w.rings=prev.rings;
    w.moonCount=prev.moonCount;w.moonNames=prev.moonNames;w.moonsVis=prev.moonsVis;
  }
  /* generateWorld bakes the world's OWN name and moon into the hook, so a lock
     that swaps either of them afterwards leaves the prose describing a planet
     that is not on screen ("...the route to Skiodrin V" under the title
     "Ditus"). Re-fill from the template against the world as it now stands. */
  if(locks.name||locks.sky){
    if(!w.moonCount&&w.hookTpl.includes("{moonName}")){
      const pool=hookPool(w.climate,w.ocean,false); /* the kept sky has no moon */
      w.hookTpl=pool[Math.abs(seed)%pool.length].t;
    }
    w.hook=fillHook(w.hookTpl,w);
  }
  return w;
}

/* ---- crystal sphere: a star and the worlds that orbit it ---- */
const SPHERE_TAIL=["Sphere","Reach","Vault","Wheel","Compass","Round"];
function generateSphere(seedNum){
  const rng=mulberry32(seedNum);
  const name="The "+cap(forgeWord(rng,2,rng()<0.6))+" "+pick(rng,SPHERE_TAIL);
  const n=4+((rng()*5)|0);
  const worlds=[];
  for(let i=0;i<n;i++){
    /* >>>0, not |0: the 32-bit hash goes negative under |0 and the world's code
       then renders as "SEED -1..." and no longer round-trips through seedFromCode */
    const ws=hashSeedString(seedNum.toString(36)+":"+i)>>>0;
    const w=generateWorld(ws);
    w.orbitR=0.2+(i+1)/(n+0.6)*0.78;
    w.orbitA=rng()*Math.PI*2;
    w.orbitV=(0.00004+rng()*0.00007)/(0.5+w.orbitR);
    worlds.push(w);
  }
  return {seedNum,code:seedNum.toString(36).toUpperCase(),name,worlds,star:worlds[0].suns[0]};
}

/* =========================================================
   TEXTURE GENERATION
========================================================= */
const TW=768,TH=384;
/* ---- HOOP GEOMETRY, and why the band is a band ------------------------------
   A hoop used to map the FULL texture height across the annulus: 384 rows —
   pole to pole — squeezed into 0.56 of the radius, while 768 columns were spread
   around a circumference of 4.3 radii. That is an 8:1 anisotropy, so every
   feature was smeared into a concentric stripe and the world had no findable
   coastline. Instead the hoop samples one EQUATORIAL BAND of the texture, sized
   so a texel is square on the surface:
       rows_across / band_width  ==  TW / circumference
       HOOP_VH / (1-RIN)         ==  768 / (2*PI*mean_radius)
   With RIN 0.36 that is HOOP_VH = 115 rows, centred on the equator where the
   equirect projection is least distorted. u still spans exactly one turn, so
   the band closes on itself seamlessly. RIN itself came down from 0.44 to 0.36:
   a thicker ring carries more terrain and reads as more of an object. */
const HOOP_RIN=0.36;
const HOOP_VH=115, HOOP_V0=((TH-HOOP_VH)/2)|0;
const HOOP_SLAB=0.10;    /* a ring world is thick; the disc's 0.045 is a wafer */
const HOOP_CROWN=0.6;    /* the deck is gently crowned, so N.L varies across it */
const HOOP_WALL_ROWS=13; /* how far past the band edge the rim wall keeps reading */
/* ---- THE SLAB WALL NEEDS ROWS OF ITS OWN ------------------------------------
   A disc's deck used to span the whole map, so its outer lip was row TH-1 and
   every wall row clamped to the SAME texel: each rim column came out one flat
   colour stretched down the wall — a plastic bumper on a coin, and on a world
   whose rim tone happened to match its deck the silhouette disappeared
   altogether. The deck now stops DISC_WALL_ROWS short of the last row, and
   those rows carry a real cut cross-section instead (see wallColour). */
const DISC_WALL_ROWS=26;
const DISC_VH=TH-1-DISC_WALL_ROWS;
const tex32=new Uint32Array(TW*TH);
const cloudA=new Uint8Array(TW*TH);
const cloudS=new Uint8Array(TW*TH);
const waterMask=new Uint8Array(TW*TH);
let continentCount=0;

function ramp(stops,t){
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i][0]&&t<=stops[i+1][0]){a=stops[i];b=stops[i+1];break}
  }
  const span=b[0]-a[0]||1;
  const k=Math.min(1,Math.max(0,(t-a[0])/span));
  return [
    a[1][0]+(b[1][0]-a[1][0])*k,
    a[1][1]+(b[1][1]-a[1][1])*k,
    a[1][2]+(b[1][2]-a[1][2])*k
  ];
}

/* ---- COASTLINE BAND WIDTH ---------------------------------------------------
   The beach is the first segment of the land ramp — a FIXED slice of the
   elevation range. fBm has a fairly uniform gradient magnitude, so a fixed
   elevation slice becomes a fixed-WIDTH contour everywhere: every landmass wore
   a bright, near-constant band tracing its coast, with a matching saturated one
   just outside it in the water. At magnification the band was hard-stepped, and
   at any size the continents read as stickers laid on the globe.
   The slice is modulated per texel by two things. (a) LOCAL SLOPE, measured
   against this world's own mean slope: narrow where the coast plunges, broad on
   a shelf — which is what a real strandline does. (b) A high-frequency noise
   field, so even a coast of uniform slope never closes into a clean
   iso-contour. The shallow/mid water stop gets the same treatment, because it
   was the second ring. */
const BEACH_K=0.28;       /* 0 = width purely from slope, 1 = fixed slice   */
const BEACH_BROAD=3.1;    /* shelf-coast vs cliff-coast, in body radii      */
const BEACH_FINE=17.5;    /* ruffle on the band edge itself                 */
const BEACH_SPREAD=2.8;   /* log-width swing the broad field is worth       */
const BEACH_MIN=0.12,BEACH_MAX=3.2;

/* ---- the slab wall, as a cut cross-section ----------------------------------
   Horizontal strata banded in DEPTH and undulating slowly around the rim, so
   the layers are neither perfect circles nor one smeared texel row, drawn in
   the rock tones of this world's own uplands. */
function wallColour(dep,az,s,stops){
  const ca=Math.cos(az),sa=Math.sin(az);
  const und=fbm(ca*1.9,sa*1.9,4.3,s+617,3);            /* slow layer roll  */
  const fine=fbm(ca*7.7,sa*7.7,dep*3.1+1.7,s+919,3);   /* grain in the cut */
  const t=dep*6.4+und*2.4;
  const li=Math.floor(t), fr=t-li;
  const k0=hash3(li,0,0,s+433), k1=hash3(li+1,0,0,s+433);
  const a=ramp(stops,0.30+0.60*k0), b=ramp(stops,0.30+0.60*k1);
  const bl=fr<0.88?0:(fr-0.88)/0.12;                   /* hard beds, thin seams */
  const seam=Math.exp(-fr*fr*70)+Math.exp(-(1-fr)*(1-fr)*70);
  const k=(0.60+0.34*k0)*(0.86+0.26*fine)*(1-0.30*seam)*(1-0.24*dep);
  return [(a[0]+(b[0]-a[0])*bl)*k,(a[1]+(b[1]-a[1])*bl)*k,(a[2]+(b[2]-a[2])*bl)*k];
}

function buildTexture(world){
  const s=world.terrainSeed;
  const cl=world.climate;
  const h=world.hue;
  /* this world's own reading of its climate's palette — see generateWorld.pal */
  const P=world.pal||{};
  const lh=h+(P.landHue||0), wh=h+(P.seaHue||0);
  const lt=c=>tone(hueShift(c,lh),P.landSat,P.landVal,P.landTint);
  const wt=c=>tone(hueShift(c,wh),P.seaSat,P.seaVal,P.seaTint);
  const landStops=cl.land.map(st=>[st[0],lt(st[1])]);
  landStops.push([1,landStops[landStops.length-1][1]]);
  const waterStops=[[0,wt(cl.water.shallow)],[0.28,wt(cl.water.mid)],[1,wt(cl.water.deep)]];
  /* frost keeps most of its neutrality — it is snow, not local rock — but takes
     half the world's value shift so a bright world's caps are not grey */
  const ice=tone(hueShift(cl.ice,h*0.4),
    P.landSat!=null?1:null,P.landVal!=null?(P.landVal+1)/2:1,P.landTint);
  const capLat=cl.cap+(P.capJit||0);
  const seaFall=P.seaFall||0.6;
  const cf=world.contFreq, da=world.detAmp;
  const contAmp=0.8-da;
  const flat=world.shape!=="sphere";
  /* ---- A DISC OR A HOOP IS NOT A REPROJECTED GLOBE ---------------------------
     Both read this texture POLAR: row is radius, column is azimuth. Evaluating
     the terrain over a sphere's lat/lon and then reading it back that way turns
     every constant-latitude band into a concentric circle and drops the map's
     pole in the exact centre — a concentric agate slice, radially smeared at the
     hub and brushed into circumferential streaks at the rim. A flat world gets
     its own PLANAR field instead: the sample point is the point on the plate
     itself, so the noise has no preferred direction and a hoop's country
     automatically varies several times faster around the ring than across it,
     because the ring really is that much longer than it is wide. A cube is NOT
     polar — it reads this map through the cubed-sphere mapping and keeps the
     spherical field it was built for. */
  const polar=world.shape==="disc"||world.shape==="hoop";
  const isHoopT=world.shape==="hoop";
  const PRIN=isHoopT?HOOP_RIN:0;
  const PV0=isHoopT?HOOP_V0:0;
  const PVH=isHoopT?HOOP_VH:DISC_VH;
  const PWALL=isHoopT?HOOP_WALL_ROWS:DISC_WALL_ROWS;
  const PZ=0.41;                        /* the plane's slice through the field */
  const elev=new Float32Array(TW*TH);
  /* a fine ripple field: the only thing that gives a flat sea a direction */
  const wave=flat?new Float32Array(TW*TH):null;
  for(let j=0;j<TH;j++){
    const lat=Math.PI*(j/TH-0.5);
    const cs=Math.cos(lat),sn=Math.sin(lat);
    const rr=PRIN+((j-PV0)/PVH)*(1-PRIN);
    for(let i=0;i<TW;i++){
      const lon=2*Math.PI*i/TW;
      let px,py,pz;
      if(polar){px=rr*Math.cos(lon);py=rr*Math.sin(lon);pz=PZ}
      else{px=cs*Math.cos(lon);py=sn;pz=cs*Math.sin(lon)}
      const cont=fbm(px*cf,py*cf,pz*cf,s,4);
      const det=fbm(px*4.6,py*4.6,pz*4.6,s+7331,5);
      const rg=1-Math.abs(2*fbm(px*3.1,py*3.1,pz*3.1,s+414,3)-1);
      elev[j*TW+i]=cont*contAmp+det*da+rg*0.1;
      if(flat)wave[j*TW+i]=fbm(px*23,py*23,pz*23,s+5150,2);
    }
  }
  const sample=[];
  for(let k=0;k<elev.length;k+=5)sample.push(elev[k]);
  sample.sort((a,b)=>a-b);
  const sea=sample[Math.min(sample.length-1,(sample.length*world.ocean)|0)];
  /* ---- this world's own mean |grad elev|, so the coastline band width below
     is scale-free: what matters is the LOCAL slope relative to this average,
     not an absolute number that would drift with contFreq and detAmp. The
     metric differs by projection — a texel column is cos(lat) of a radian on a
     sphere and 2*PI*r/TW of a body radius on a plate — so both passes go
     through the same AX/AY. */
  const AY=polar?(1-PRIN)/PVH:Math.PI/TH;
  const axOf=j=>polar
    ? 2*Math.PI*Math.max(0.06,PRIN+((j-PV0)/PVH)*(1-PRIN))/TW
    : Math.max(0.14,Math.cos(Math.PI*(j/TH-0.5)))*2*Math.PI/TW;
  let gsum=0,gn=0;
  for(let j=2;j<TH-2;j+=3){
    const iax=0.5/axOf(j), iay=0.5/AY;
    for(let i=0;i<TW;i+=3){
      const gi=(elev[j*TW+(i+1)%TW]-elev[j*TW+(i+TW-1)%TW])*iax;
      const gj=(elev[(j+1)*TW+i]-elev[(j-1)*TW+i])*iay;
      gsum+=Math.sqrt(gi*gi+gj*gj);gn++;
    }
  }
  const igref=gn&&gsum>1e-9?gn/gsum:1;
  /* ---------- flat worlds: bake the sun into the map ----------
     A disc's normal is identical everywhere, so computeLighting has nothing to
     work with and the face comes out as one flat wash. All of its form has to
     be painted into the texture instead.
     The catch: on a flat world this texture is POLAR — row is radius, column
     is azimuth. A light direction held constant in TEXTURE space therefore
     appears to radiate out of the disc's own centre, which is exactly what
     makes a flat world read as a sticker. So the sun is resolved into the
     disc's PLANE once, then rotated into each column's local radial/tangential
     frame: the whole face ends up lit from one side. */
  const RELIEF=0.13;    /* rock slope gain — the main knob. 0.20 = harsher   */
  const CAVITY=70;      /* darkens folds and valleys, brightens ridge crowns */
  const RIPPLE=0.0055;  /* directional sheen on open water                   */
  let FL1=0,FL2=0,RSCL=0,ASCL=0,FRIN=0,VOFF=0,VDEN=TH-1;
  if(flat){
    /* a hoop reads only HOOP_VH rows of this texture, and a disc only DISC_VH
       (the rest is its rim wall), so a texture row is worth a different amount
       of disc radius on each — the hillshade gradient has to be scaled by the
       mapping the renderer will actually use, or the relief comes out ~2x too
       strong and the band goes back to looking striped */
    FRIN=polar?PRIN:0;
    VOFF=polar?PV0:0;
    VDEN=polar?PVH:(TH-1);
    const phi=Math.max(0.14,Math.min(1.45,0.62+tilt*0.8));
    const psp=Math.sin(phi),pcp=Math.cos(phi);
    let lx=0,ly=0,lz=0;
    for(const s2 of world.suns){
      const pm=Math.sqrt(1-s2.zf*s2.zf);
      lx+=Math.cos(s2.theta)*pm*s2.lum;
      ly+=Math.sin(s2.theta)*pm*s2.lum;
      lz+=s2.zf*s2.lum;
    }
    FL1=lx; FL2=ly*psp+lz*pcp;                 /* e1=(1,0,0), e2=(0,sp,cp) */
    const ll=Math.hypot(FL1,FL2)||1; FL1/=ll; FL2/=ll;
    RSCL=0.5*VDEN/(1-FRIN);                    /* texture row -> disc radius  */
    ASCL=0.5*TW/(2*Math.PI);                   /* texture col -> disc radians */
  }
  const B0=landStops[1][0];      /* top of the beach band, in elevation      */
  const W0=waterStops[1][0];     /* top of the shallow band, in depth        */
  const PWTOP=PV0+PVH;           /* the deck's outer lip, in texture rows    */
  for(let j=0;j<TH;j++){
    const lat=Math.PI*(j/TH-0.5);
    const abslat=Math.abs(lat);
    const csl=Math.cos(lat);
    const prr=PRIN+((j-PV0)/PVH)*(1-PRIN);
    const iax=0.5/axOf(j), iay=0.5/AY;
    const jU=j>0?j-1:0,jD=j<TH-1?j+1:TH-1;
    /* is this row part of the slab wall rather than the deck? */
    let wallDep=-1;
    if(polar){
      if(j>PWTOP)wallDep=Math.min(1,(j-PWTOP)/PWALL);
      else if(isHoopT&&j<PV0)wallDep=Math.min(1,(PV0-j)/PWALL);
    }
    for(let i=0;i<TW;i++){
      const idx=j*TW+i;
      const e=elev[idx];
      const lon2=2*Math.PI*i/TW;
      /* the sample point, in whichever space this world's field lives in */
      const cx=polar?prr*Math.cos(lon2):csl*Math.cos(lon2);
      const cy=polar?prr*Math.sin(lon2):Math.sin(lat);
      const cz=polar?PZ:csl*Math.sin(lon2);
      if(wallDep>=0){
        /* the cut edge of the slab — its own strata, not the deck smeared down */
        const wc=wallColour(wallDep,lon2,s,landStops);
        waterMask[idx]=0;
        const wj=(hash3(i,j,3,s)-0.5)*7;
        tex32[idx]=((Math.max(0,Math.min(255,wc[2]+wj))|0)<<16)|
                   ((Math.max(0,Math.min(255,wc[1]+wj))|0)<<8)|
                    (Math.max(0,Math.min(255,wc[0]+wj))|0);
        cloudA[idx]=0;cloudS[idx]=210;    /* no weather on a cliff face */
        continue;
      }
      let r,g,bch;
      let isWater=0;
      /* --- local slope, and the coastline band width it drives --- */
      const iL=(i+TW-1)%TW,iR=(i+1)%TW;
      const gi=(elev[j*TW+iR]-elev[j*TW+iL])*iax;
      const gj=(elev[jD*TW+i]-elev[jU*TW+i])*iay;
      const gm=Math.sqrt(gi*gi+gj*gj)*igref;         /* 1 == this world's mean */
      const slopeW=1/(BEACH_K+(1-BEACH_K)*gm);
      if(e<sea){
        isWater=1;
        let d=Math.min(1,(sea-e)/Math.max(sea,0.001)/seaFall);
        /* the shelf ring gets the same treatment as the beach — it was the
           second, outer band, and a uniform one is just as damning */
        const wB=fbm(cx*2.9+5.1,cy*2.9,cz*2.9-3.7,s+2207,2);
        const wF=vnoise(cx*15.5,cy*15.5,cz*15.5,s+3313);
        let ww=slopeW*Math.exp(2.1*(wB-0.5)+0.9*(wF-0.5));
        if(ww<BEACH_MIN)ww=BEACH_MIN; else if(ww>BEACH_MAX)ww=BEACH_MAX;
        const wp=W0*ww;
        const shoal=Math.max(0,Math.min(1,(wB-0.30)*2.6));
        const ds=W0*(1-shoal);
        d=d<wp?ds+(W0-ds)*(d/wp):W0+(d-wp)*(1-W0)/(1-wp);
        const c=ramp(waterStops,d);
        r=c[0];g=c[1];bch=c[2];
      }else{
        let hh=(e-sea)/(1-sea);
        /* A broad field decides what KIND of coast this stretch is — a shelf
           with a wide bright strandline, or a cliff where the uplands run
           straight into the water and there is no beach at all — and a fine one
           ruffles the edge so it never closes into a clean iso-contour. */
        const cB=fbm(cx*BEACH_BROAD,cy*BEACH_BROAD,cz*BEACH_BROAD,s+1301,2);
        const cF=vnoise(cx*BEACH_FINE,cy*BEACH_FINE,cz*BEACH_FINE,s+1877);
        let bw=slopeW*Math.exp(BEACH_SPREAD*(cB-0.5)+0.9*(cF-0.5));
        if(bw<BEACH_MIN)bw=BEACH_MIN; else if(bw>BEACH_MAX)bw=BEACH_MAX;
        const bp=B0*bw;
        const sandy=Math.max(0,Math.min(1,(cB-0.34)*2.9));
        const hs=B0*(1-sandy);
        /* a monotone warp: the beach segment is stretched or squeezed to bp and
           everything above it is re-fitted, so the ramp stays continuous. hs is
           where the shore STARTS on the ramp — at hs=B0 there is no strandline
           and the coast is rock meeting sea. */
        hh=hh<bp?hs+(B0-hs)*(hh/bp):B0+(hh-bp)*(1-B0)/(1-bp);
        const c=ramp(landStops,hh);
        r=c[0];g=c[1];bch=c[2];
        if(cl.lava){
          /* flows cluster around caldera hotspots and thin out elsewhere */
          const hot=fbm(cx*1.7,cy*1.7,cz*1.7,s+271,3);
          const lv=1-Math.abs(2*vnoise(cx*7.2,cy*7.2,cz*7.2,s+99)-1); /* 3-D: no polar fan */
          const th2=0.97-0.24*Math.max(0,hot-0.32);
          if(lv>th2){
            const t=Math.min(1,(lv-th2)/0.1)*Math.min(1,0.35+hot);
            r=r+(255-r)*t; g=g+(120-g)*t*0.9; bch=bch+(40-bch)*t;
          }
        }
        if(cl.craters){
          const d1=worley(cx*6.5,cy*6.5,cz*6.5,s+808);
          let f=1;
          if(d1<0.42)f=0.86+0.14*(d1/0.42);
          else if(d1<0.55)f=1.14-(d1-0.42)*0.6;
          r*=f;g*=f;bch*=f;
        }
      }
      /* cap edge jitter in the field's own space, so frost stays organic.
         A flat world has no poles: mapping abslat onto it would lay an ice
         bullseye on the hub and an ice ring on the rim, which is two more
         concentric circles. It gets a broad planar COLDNESS field instead, so
         frost arrives as regions. */
      const jit=(fbm(cx*2.6,cy*2.6,cz*2.6,s+55,2)-0.5)*0.24;
      const cold=polar
        ? 0.80+3.0*(fbm(cx*1.15,cy*1.15,cz+9.4,s+808,3)-0.5)
        : abslat;
      const edge=(cold-(capLat+jit))/0.1;
      if(edge>0){
        const t=Math.min(1,edge);
        r=r+(ice[0]-r)*t; g=g+(ice[1]-g)*t; bch=bch+(ice[2]-bch)*t;
        if(t>0.5)isWater=0;
      }
      waterMask[idx]=isWater;
      if(flat){
        /* A flat world is lit almost uniformly, so relief is hillshaded into
           the map itself — which is how a chart would draw it anyway. The
           gradient is taken in the DISC'S frame, not the texture's, so the
           whole face is raked from one side instead of from its own centre.
           iL/iR/jU/jD are the same neighbours the coastline slope used. */
        const rr=FRIN+((j-VOFF)/VDEN)*(1-FRIN);  /* this texel's disc radius */
        const ra=rr>0.004?rr:0.004;              /* the map's own pole       */
        const az=2*Math.PI*i/TW;
        const ca2=Math.cos(az),sa2=Math.sin(az);
        const Lr= FL1*ca2+FL2*sa2;               /* sun, radially            */
        const La=-FL1*sa2+FL2*ca2;               /* sun, tangentially        */
        const gr=(elev[jD*TW+i]-elev[jU*TW+i])*RSCL;
        const ga=(elev[j*TW+iR]-elev[j*TW+iL])*ASCL/ra;
        const slope=gr*Lr+ga*La;                 /* grad(elev) . sun         */
        if(!isWater){
          /* rock: a hard raking light, plus cavity shadow in the folds */
          const lap=(elev[j*TW+iL]+elev[j*TW+iR]+elev[jU*TW+i]+elev[jD*TW+i])*0.25-e;
          let cav=lap*CAVITY; if(cav<-0.16)cav=-0.16; else if(cav>0.30)cav=0.30;
          let sh=(1-slope*RELIEF)*(1-cav);
          if(sh<0.42)sh=0.42; else if(sh>1.75)sh=1.75;
          /* lit rock warms, shadowed rock cools: contrast the eye reads as depth */
          const w2=(sh-1)*0.14;
          r*=sh+w2; g*=sh; bch*=sh-w2;
        }else{
          /* water is a mirror, not a landscape, so it gets no rock relief.
             It gets a ripple sheen along the same sun, bright shoals where
             the shelf comes up, and deeps that swallow the light. */
          const gwr=(wave[jD*TW+i]-wave[jU*TW+i])*RSCL;
          const gwa=(wave[j*TW+iR]-wave[j*TW+iL])*ASCL/ra;
          const shelf=Math.min(1,(sea-e)/(sea*0.22+0.02));   /* 0 at the shore */
          let sh=1-(gwr*Lr+gwa*La)*RIPPLE;
          sh*=0.86+0.34*(1-shelf)*(1-shelf);                 /* shallows glow  */
          sh-=slope*RELIEF*0.30*(1-shelf);                   /* shoals show    */
          if(sh<0.58)sh=0.58; else if(sh>1.45)sh=1.45;
          r*=sh*0.97; g*=sh; bch*=sh*1.04;
        }
      }
      const vjit=(hash3(i,j,0,s)-0.5)*9;
      r=Math.max(0,Math.min(255,r+vjit));
      g=Math.max(0,Math.min(255,g+vjit));
      bch=Math.max(0,Math.min(255,bch+vjit));
      tex32[idx]=(bch<<16)|(g<<8)|r;
      const cv=fbm(cx*3.4,cy*3.4,cz*3.4,s+2024,4);
      const th=1-world.cloudCov;
      let a=0,csh=210;
      if(cv>th){
        a=Math.min(1,(cv-th)/0.16)*205;
        csh=150+Math.min(105,(cv-th)/0.3*105);  /* bright hearts, grey skirts */
      }
      cloudA[idx]=a;
      cloudS[idx]=csh;
    }
  }
  /* continent counting */
  const MW=128,MH=64;
  const SX=(TW/MW)|0,SY=(TH/MH)|0;
  const mask=new Uint8Array(MW*MH);
  for(let j=0;j<MH;j++)for(let i=0;i<MW;i++){
    mask[j*MW+i]=elev[(j*SY)*TW+(i*SX)]>=sea?1:0;
  }
  const seen=new Uint8Array(MW*MH);
  const sizes=[];
  const stack=new Int32Array(MW*MH);
  for(let j=0;j<MH;j++)for(let i=0;i<MW;i++){
    const st=j*MW+i;
    if(!mask[st]||seen[st])continue;
    let sp=0,size=0;
    stack[sp++]=st;seen[st]=1;
    while(sp){
      const cur=stack[--sp];size++;
      const cy2=(cur/MW)|0,cx2=cur%MW;
      const nb=[((cx2+1)%MW)+cy2*MW,((cx2+MW-1)%MW)+cy2*MW];
      if(cy2>0)nb.push(cur-MW);
      if(cy2<MH-1)nb.push(cur+MW);
      for(const n of nb){if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n}}
    }
    sizes.push(size);
  }
  let count=sizes.filter(sz=>sz>=26).length;
  if(!count)count=Math.max(1,sizes.filter(sz=>sz>=6).length);
  continentCount=Math.min(count,19);
}

const canvas=document.getElementById("orb");
const ctx=canvas.getContext("2d");
let S=480,img,buf32;
const INV2PI=1/(2*Math.PI);

let P_pix,N_x,N_y,N_z,P_row,P_rf,P_u,P_a,P_count=0;
let SH_R,SH_G,SH_B,SPEC;
/* the sphere renders into a buffer sized to what's actually on screen */
function initOrb(size){
  S=size;
  canvas.width=S;canvas.height=S;
  img=ctx.createImageData(S,S);
  buf32=new Uint32Array(img.data.buffer);
  const c=S/2,R=S/2-3;
  const pix=[],nx=[],ny=[],nz=[],cov=[];
  /* The buffer had ZERO partially transparent pixels, so the limb was a binary
     staircase against cream on every world. The radius test already computes
     everything needed: coverage is clamp((1-r)*R + 0.5) — one pixel of feather,
     and interior pixels are still exactly 255, so the disc itself is untouched.
     One extra ring of pixels is admitted for the outside half of the feather;
     nz is 0 there, which is what the limb term already assumes at r=1. */
  const RLIM=1+1/R;
  for(let y=0;y<S;y++){
    for(let x=0;x<S;x++){
      const dx0=(x+0.5-c)/R, dy0=(y+0.5-c)/R;
      const d2=dx0*dx0+dy0*dy0;
      if(d2>RLIM*RLIM)continue;
      const zz=d2<1?Math.sqrt(1-d2):0;
      const a=(1-Math.sqrt(d2))*R+0.5;
      if(a<=0)continue;
      pix.push(y*S+x);
      nx.push(dx0);ny.push(dy0);nz.push(zz);
      cov.push(a>=1?255:(a*255)|0);
    }
  }
  P_count=pix.length;
  P_pix=Int32Array.from(pix);
  N_x=Float32Array.from(nx);N_y=Float32Array.from(ny);N_z=Float32Array.from(nz);
  P_row=new Int32Array(P_count);
  P_rf=new Float32Array(P_count);
  P_u=new Float32Array(P_count);
  SH_R=new Float32Array(P_count);
  SH_G=new Float32Array(P_count);
  SH_B=new Float32Array(P_count);
  SPEC=new Float32Array(P_count);

}
initOrb(480);
const ROLL=-0.18,ROLL_C=Math.cos(ROLL),ROLL_S=Math.sin(ROLL);

/* Bake lighting from this world's actual suns.
   Each sun contributes Lambert-shaded light in its own color from its
   real screen direction, plus a Blinn specular lobe for ocean glints
   and a scattered rim on its sunlit limb. Night side falls to ambient. */
/* The two themes are not the same picture at different brightnesses. On black,
   a 0.19 grey ambient reads as night; on parchment the same value crushes the
   whole shadowed hemisphere to a flat charcoal cut-out sitting on cream. In
   light the ambient floor is lifted and tinted toward the paper, the direct
   term is pulled back so the lit side does not clip, and the terminator wrap is
   widened so the sun's bearing still reads across a softer gradient.
   Called again by the theme toggle, which also forces a remap. */
function themeLight(){
  const lt=document.documentElement.dataset.theme!=="dark";
  return lt
    ? {lt:1,amb:0.30,tr:1.12,tg:1.02,tb:0.84,wrap:0.21,dir:0.92}
    : {lt:0,amb:0.19,tr:1,   tg:1,   tb:1,   wrap:0.13,dir:1.15};
}
/* On parchment a pale world's limb is nearly the paper's own value, so the edge
   dissolves. Cooling the last of the limb — pulling red down and blue up as nz
   falls to zero — separates it by HUE where there is no value left to spend,
   without darkening the body into a cut-out. Dark theme is untouched. */
const LIMB_COOL_R=0.11, LIMB_COOL_B=0.11;
/* ...and a hard edge term over the outermost sliver only. Measured: on an
   arid, glacial, salt or chalk world the brightest pixel within 4px of the limb
   reached Y 230-250 against parchment's 228, so the sunlit edge really did
   vanish into the page. pow(1-nz,7) is ~0.08 by nz=0.3, so this touches nothing
   but the last few percent of the disc. */
const LIMB_EDGE=0.30;
/* skipSpec: flat worlds compute their own reflectance in mapFlat and overwrite
   SPEC wholesale, so the Blinn lobe here is pure waste on that path — and it
   was the single most expensive term in the flat tilt remap. */
function computeLighting(world,skipSpec){
  const TL=themeLight();
  const AMB=TL.amb, IW=1/(1+TL.wrap);
  let sum=0;for(const s2 of world.suns)sum+=s2.lum;
  const scale=Math.min(1,TL.dir/sum);
  const LS=world.suns.map(s2=>{
    const pm=Math.sqrt(1-s2.zf*s2.zf);
    const Lx=Math.cos(s2.theta)*pm, Ly=Math.sin(s2.theta)*pm, Lz=s2.zf;
    let Hx=Lx,Hy=Ly,Hz=Lz+1;
    const hl=Math.hypot(Hx,Hy,Hz);Hx/=hl;Hy/=hl;Hz/=hl;
    return {Lx,Ly,Lz,Hx,Hy,Hz,
      lum:s2.lum*scale,
      tr:s2.tint[0],tg:s2.tint[1],tb:s2.tint[2]};
  });
  for(let k=0;k<P_count;k++){
    const nx=N_x[k],ny=N_y[k],nz=N_z[k];
    let r=AMB*TL.tr,g=AMB*TL.tg,b=AMB*TL.tb,sp=0;
    const e=1-nz;
    const rim=e*e*Math.sqrt(e>0?e:0);   /* (1-nz)^2.5 without a pow() */
    for(let i=0;i<LS.length;i++){
      const s2=LS[i];
      let d=nx*s2.Lx+ny*s2.Ly+nz*s2.Lz;
      d=(d+TL.wrap)*IW;              /* atmospheric wrap softens the terminator */
      if(d<=0)continue;
      const w=d*s2.lum*(1+rim*0.55); /* scattered halo on the sunlit limb */
      r+=w*s2.tr;g+=w*s2.tg;b+=w*s2.tb;
      if(skipSpec)continue;
      const hd=nx*s2.Hx+ny*s2.Hy+nz*s2.Hz;
      if(hd>0){
        /* hd^90 by repeated squaring: 64+16+8+2 */
        const h2=hd*hd,h4=h2*h2,h8=h4*h4,h16=h8*h8,h32=h16*h16,h64=h32*h32;
        sp+=h64*h16*h8*h2*s2.lum;
      }
    }
    let limb=0.55+0.45*Math.sqrt(nz>0?nz:0);    /* mapFlat's rim bevel tips nz negative */
    const cool=TL.lt?(1-limb)/0.45:0;           /* 0 at centre, 1 at the limb */
    if(TL.lt){
      const e2=1-(nz>0?nz:0), e4=e2*e2, e6=e4*e2;
      limb*=1-LIMB_EDGE*e6*e2;                  /* (1-nz)^7, the last sliver */
    }
    SH_R[k]=Math.min(1.4,r)*limb*(1-LIMB_COOL_R*cool);
    SH_G[k]=Math.min(1.4,g)*limb;
    SH_B[k]=Math.min(1.4,b)*limb*(1+LIMB_COOL_B*cool);
    if(!skipSpec)SPEC[k]=Math.min(1,sp)*145;
  }
}

let tilt=0, tiltTarget=0, computedTilt=99;

const CLOUD_H  =0.055;  /* cloud deck height, in disc radii                 */
const SHADOW_K =0.0022; /* cloud shadow depth, x cloudA (0..255)            */
const FLANK_K  =0.27;   /* lit flank / dark lee on the cloud itself         */
/* ---- A FLAT PLATE IS NOT A BALL. -------------------------------------------
   A disc has one normal, so N.L is a CONSTANT across its whole deck: a real
   plate lit by a distant sun has no falloff from its own centre. Every radial
   term that used to live here — an inverse-square "sun pool", an occlusion ramp
   from r=0.80 outward, haze piling up toward the rim on all sides — added up to
   textbook limb darkening, and a face-on disc came out looking exactly like a
   sphere while the FORM row insisted it was "a world with an edge".
   So: the deck carries only a gentle LINEAR bias along the sun's bearing (which
   a finite sun distance genuinely produces), and 100% of the darkening lives on
   the rim chamfer, uniform in azimuth, where a coin's bevelled edge would take
   it. That chamfer plus the slab wall is the edge cue, and it is present at
   every tilt including dead face-on.
   A HOOP IS THE EXCEPTION, and only a hoop. Everything above holds for a disc,
   where the radial direction and the view direction are confounded. A ring has
   a second, independent axis — across its band — and with one normal for the
   whole annulus it had no N.L anywhere, which is what made it read as a decal
   rather than a solid. So a hoop's deck is gently crowned (HOOP_CROWN) and its
   far arc darkened; neither term is radial-from-centre in the way the disc's
   removed limb darkening was. ------------------------------------------------ */

const RIM0     =0.93;   /* where the chamfer begins, matching the bevel band  */
const RIM_AO   =0.40;   /* how far the chamfer darkens at the outer lip       */
/* A real bevelled plate has a hard crease where the top face stops and the

   foreshortened to nothing — without it the rim is a smooth ramp, which is
   exactly what limb darkening looks like. */
const RIM_STEP =0.11;
const FRESNEL_K=1.0;    /* sky reflected off the sea, toward the far rim    */
const SHEEN_K  =0.34;   /* the sun's own glare patch on the water           */
const EYE_D    =2.6;    /* virtual eye distance. Without it an ortho camera

const HAZE_BASE=0.05,HAZE_FAR=0.20,HAZE_MAX=0.44;

const WALL_FLOOR_LIGHT=[0.30,0.305,0.33];

let SD_row=null,SD_u=null,AIR=null;      /* per-pixel, rebuilt on tilt      */
let HZ_R=168,HZ_G=184,HZ_B=212;          /* the colour of the air           */
let SKY_R=240,SKY_G=246,SKY_B=252;       /* what the sea reflects           */

/* Flat worlds (discs and hoops) are mapped from a tilted plane rather than a
   sphere: the visible pixel set changes with the view angle, so the whole
   projection — and its lighting — is rebuilt whenever the tilt moves. */
/* atan2 expressed directly in TURNS, which is the only form this renderer
   wants. Same polynomial the cube path inlines; max error ~1e-5 rad, which is
   far below a texel. Math.atan2 was a measurable slice of the flat remap. */
function atan2Turns(y,x){
  const ax=x<0?-x:x, ay=y<0?-y:y;
  const swap=ax<ay;
  const q=swap?ax/(ay+1e-30):ay/(ax+1e-30);
  const q2=q*q;
  let a=q*(0.9998660+q2*(-0.3302995+q2*(0.1801410+q2*(-0.0851330+q2*0.0208351))));
  if(swap)a=1.5707963267948966-a;
  if(x<0)a=Math.PI-a;
  if(y<0)a=-a;
  return a*INV2PI;

/* Scratch buffers for the flat projection, kept across frames and reallocated
   only when the canvas resolution changes. Capacity is the whole canvas, which
   is a comfortable bound: a disc covers at most pi/4 of it plus a thin wall. */
let FB=null;
function ensureFlatBuffers(){
  const cap=S*S;
  if(FB&&FB.cap===cap)return FB;
  FB={cap,
    pix:new Int32Array(cap),
    nx:new Float32Array(cap), ny:new Float32Array(cap), nz:new Float32Array(cap),
    row:new Int32Array(cap),  rf:new Float32Array(cap), u:new Float32Array(cap),
    sdr:new Int32Array(cap),  sdu:new Float32Array(cap),
    ao:new Float32Array(cap), gl:new Float32Array(cap), air:new Float32Array(cap),
    cov:new Uint8Array(cap),  wall:new Uint8Array(cap),

function mapFlat(t){

  const sp=Math.sin(phi),cp=Math.cos(phi);
  const isHoop=SHAPE==="hoop";
  const rin=isHoop?HOOP_RIN:0;
  const inv=1/(1-rin);

     HOOP_VH. V1 is the outer lip's row, which the rim wall reads onward from. */
  const V0=isHoop?HOOP_V0:0, VH=isHoop?HOOP_VH:DISC_VH, V1=V0+VH;

      lx+=Math.cos(s2.theta)*pm*w2; ly+=Math.sin(s2.theta)*pm*w2; lz+=s2.zf*w2;

    }

  HZ_R=Math.min(255,90+80*tr); HZ_G=Math.min(255,100+86*tg); HZ_B=Math.min(255,120+94*tb);
  SKY_R=Math.min(255,HZ_R*0.55+150*tr);
  SKY_G=Math.min(255,HZ_G*0.55+152*tg);
  SKY_B=Math.min(255,HZ_B*0.55+150*tb);

     allocations on EVERY tilt step, which cost 66ms and made dragging a disc
     or a hoop crawl. Same maths, no allocation. */
  const F=ensureFlatBuffers();
  const pix=F.pix,nx=F.nx,ny=F.ny,nz=F.nz,rows=F.row,rfs=F.rf,us=F.u,
        sdr=F.sdr,sdu=F.sdu,aoA=F.ao,glA=F.gl,airA=F.air,covA=F.cov,wallA=F.wall;
  let kk=0;
  const slabH=slabT*cp;                         /* the slab's height on screen */
  const covWall=slabH*R;                        /* the wall's height in pixels */
  /* Only scan the rows and columns the shape can actually reach. A plate seen
     at a shallow angle occupies well under half the canvas vertically, and
     testing the rest of it was pure cost on every tilt step. */
  const yLo=Math.max(0,(c-R*sp-2)|0), yHi=Math.min(S-1,Math.ceil(c+R*(sp+slabH)+2));
  const xLo=Math.max(0,(c-R-2)|0),    xHi=Math.min(S-1,Math.ceil(c+R+2));
  for(let y=yLo;y<=yHi;y++){

    for(let x=xLo;x<=xHi;x++){
      const sx=(x+0.5-c)/R;
      const dx=sx, dy=sy/sp;
      const r2=dx*dx+dy*dy;
      const r=Math.sqrt(r2);
