         by real sub-pixel coverage instead of being a binary in/out test. The
         plane is squashed by sp in y, so the y term carries a 1/sp. */
      const gpx=r>1e-6?Math.sqrt(dx*dx+dy*dy/(sp*sp))/(r*R):1e-6;
      const inFace=r<=1+0.5*gpx&&(!rin||r>=rin-0.5*gpx);
      if(inFace){
        /* ==================== the top face ==================== */
        let n0=0,n1=-cp,n2=sp;
        const outer=(r-0.93)/0.07, inner=rin?(rin+0.07-r)/0.07:-1;
        const bev=Math.max(outer,inner);
        if(bev>0&&r>0){
          const kb=Math.min(1,bev)*0.85*(inner>outer?-1:1);
          const ex=dx/r, ey=dy/r;
          n0+=ex*kb; n1+=ey*sp*kb; n2+=ey*cp*kb;
        }
        /* A hoop's deck is gently crowned across its width — highest along the
           band's middle, sloping to both lips. Without it the annulus has ONE
           normal and therefore no N.L at all: the ring was a flat cutout with
           no near/far arc and nothing to say it was a solid. The crown costs a
           few percent of albedo variation and buys the whole read. */
        if(isHoop&&r>0){
          const kb=HOOP_CROWN*(2*(r-rin)*inv-1);
          const ex=dx/r, ey=dy/r;
          n0+=ex*kb; n1+=ey*sp*kb; n2+=ey*cp*kb;
        }
        const nl=1/Math.sqrt(n0*n0+n1*n1+n2*n2);
        pix[kk]=y*S+x;
        nx[kk]=n0*nl;ny[kk]=n1*nl;nz[kk]=n2*nl;
        const v=V0+(r-rin)*inv*VH;
        let r0=Math.floor(v);
        if(r0>TH-2)r0=TH-2; else if(r0<0)r0=0;
        rows[kk]=r0*TW;rfs[kk]=v-r0;
        const uu=atan2Turns(dy,dx);
        us[kk]=uu;
        let cov=(1-r)/gpx+0.5;
        if(rin){const ci=(r-rin)/gpx+0.5; if(ci<cov)cov=ci}
        covA[kk]=cov>=1?255:cov<=0?0:(cov*255)|0;

        /* --- where the cloud that shadows THIS point lives. The offset is
               small, so the azimuth shift is taken to first order rather
               than paying a second atan2 on every pixel of every tilt step. */
        const qx=dx+SHX, qy=dy+SHY;
        /* clamped to the DECK's rows: a shadow sampled off the end of the band
           was reading the rim wall's strata and painting it onto the ground */
        let qv=V0+(Math.sqrt(qx*qx+qy*qy)-rin)*inv*VH;
        if(qv<V0)qv=V0; else if(qv>V1)qv=V1;
        sdr[kk]=(qv|0)*TW;
        sdu[kk]=uu+(dx*SHY-dy*SHX)/(r2>0.02?r2:0.02)*INV2PI;

        /* --- macro form. The deck's only legitimate variation: a plane sloping
               gently toward the sun's bearing, because the sun really is at a
               finite distance. Linear in (dx,dy) and therefore ZERO radial
               component — that is the whole point. --- */
        let ao=1+POOL_K*(dx*L1+dy*L2);
        /* --- the chamfer, and only the chamfer. Uniform in azimuth so it reads
               as the ground plate's bevelled edge rather than a sphere's limb,
               and confined to the outer 7% (plus a hoop's inner lip) so the deck
               itself stays flat right up to it. --- */
        const cha=(r-RIM0)/(1-RIM0);
        if(cha>0)ao*=(1-RIM_STEP)*(1-RIM_AO*cha*cha);
        if(rin){const ir2=(rin+0.07-r)/0.07; if(ir2>0)ao*=(1-RIM_STEP)*(1-RIM_AO*ir2*ir2)}
        /* A ring is a closed loop, so its far arc is genuinely further from the
           eye and partly self-shaded by the near arc's inner wall. Darkening it
           is what stops the hoop from reading as a flat decal: it is the only
           depth cue a shape with no silhouette overlap can have. */
        if(isHoop)ao*=0.66+0.34*(0.5+0.5*dy);
        if(ao<0.05)ao=0.05;
        aoA[kk]=ao;

        /* --- what the sea reflects. With the eye at a finite distance the
               incidence angle varies across the face, so Fresnel climbs
               toward the far rim: the far ocean turns to silver while the
               near ocean stays blue. Strongest cue a flat sea has. The
               sun's own glare patch sits on the near side, where the mirror
               direction actually points back at the viewer. --- */
        const ex3=-dx, ey3=-dy*sp, ez3=EYE_D-dy*cp;
        const ei=1/Math.sqrt(ex3*ex3+ey3*ey3+ez3*ez3);
        const vex=ex3*ei,vey=ey3*ei,vez=ez3*ei;
        let ndv=-cp*vey+sp*vez; if(ndv<0.02)ndv=0.02;
        const fr=1-ndv, f2=fr*fr, f5=f2*f2*fr;
        let hx=lx+vex,hy=ly+vey,hz=lz+vez;
        const hl=1/(Math.sqrt(hx*hx+hy*hy+hz*hz)||1); hy*=hl;hz*=hl;
        const ndh=-cp*hy+sp*hz;
        let gl=(0.02+0.98*f5)*FRESNEL_K;
        if(ndh>0){const a2=ndh*ndh,a4=a2*a2,a8=a4*a4;gl+=a8*a8*a8*SHEEN_K}  /* ndh^24 */
        if(gl>0.55)gl=0.55;
        glA[kk]=gl;

        /* --- air. The far edge is furthest away and the most veiled. Purely a
               function of dy: veiling the whole perimeter equally would be one
               more radial vignette, which is the exact cue being removed. --- */
        let aq=HAZE_BASE+HAZE_FAR*(0.5-0.5*dy);
        if(aq>HAZE_MAX)aq=HAZE_MAX;
        /* on a hoop the haze is halved: it lifts the far arc toward the bright
           sky colour, which is the opposite of the darkening above */
        if(isHoop)aq*=0.5;
        airA[kk]=aq;
        wallA[kk]=0;
        kk++;
      }else{
        /* ============== the edge: a disc is a slab ==============
           Its near outer wall — and, on a hoop, the far wall of the hole —
           is real geometry the face projection throws away. A few pixels of
           it is what turns a painted circle into an object with thickness.
           Screen height of the slab is SLAB_T*cp, which vanishes exactly as
           the disc goes face-on, so it never overruns the canvas. */
        let ex2,ey2,u2,rowF2,depth;
        if(r>1){
          if(sy<=0)continue;
          const q=1-sx*sx; if(q<=0)continue;
          const dyE=Math.sqrt(q);
          depth=(sy-dyE*sp)/slabH;
          if(depth<0||depth>1)continue;
          ex2=sx; ey2=dyE; u2=atan2Turns(dyE,sx);
          /* The wall used to sample ONE row for its whole height — and on a
             disc, where V1 was the map's last row, every wall row clamped to
             the SAME texel and each rim column became one colour stretched down
             the wall. Read ONWARD from the band's outer lip instead, into rows
             buildTexture fills with a real strata cross-section that lines up
             with the deck above it. */
          rowF2=V1+depth*WROWS;
        }else{
          if(!rin||sy>=0)continue;
          const q=rin*rin-sx*sx; if(q<=0)continue;
          const dyI=Math.sqrt(q);
          depth=(sy+dyI*sp)/slabH;
          if(depth<0||depth>1)continue;
          ex2=-sx/rin; ey2=dyI/rin; u2=atan2Turns(-dyI,sx);
          rowF2=V0-depth*WROWS;
        }
        if(rowF2>TH-2)rowF2=TH-2; else if(rowF2<0)rowF2=0;
        const rw=Math.floor(rowF2);
        pix[kk]=y*S+x;
        nx[kk]=ex2;ny[kk]=ey2*sp;nz[kk]=ey2*cp;         /* already unit length */
        rows[kk]=rw*TW;rfs[kk]=rowF2-rw;us[kk]=u2;
        sdr[kk]=rw*TW;sdu[kk]=u2;                       /* no cloud shadow on a wall */
        /* ...and a contact occlusion where the wall meets the deck. The old
           ramp was BRIGHTEST at depth 0, which is exactly the crease a real
           overhanging lip keeps dark, so the two surfaces ran together.
           Softened from its first form: the wall's own cylindrical N.L is what
           should be carrying the round of the rim, and a heavy constant vignette
           on top of it crushed the whole band toward black. */
        aoA[kk]=(0.52+0.36*(1-depth))*(0.62+0.38*Math.min(1,depth/0.20));
        glA[kk]=0;
        airA[kk]=HAZE_BASE*0.6;
        wallA[kk]=1;
        /* feather the wall's lower silhouette, the one long edge it has */
        const wc=(1-depth)*covWall+0.5;
        covA[kk]=wc>=1?255:wc<=0?0:(wc*255)|0;
        kk++;
      }
    }
  }
  /* The globals just point at the scratch buffers — nothing is copied. They are
     sized to the whole canvas, so everything downstream must bound itself by
     P_count rather than by array length (which it already does). */
  P_count=kk;
  P_pix=pix;
  N_x=nx;N_y=ny;N_z=nz;
  P_row=rows;
  P_rf=rfs;
  P_u=us;
  SD_row=sdr;
  SD_u=sdu;
  AIR=airA;
  SH_R=F.shR;SH_G=F.shG;SH_B=F.shB;SPEC=F.sp;
  P_a=covA;                          /* sub-pixel silhouette coverage */
  if(world){
    computeLighting(world,true);
    /* computeLighting only ever sees a normal, and a plane has one normal.
       Everything that depends on WHERE the pixel sits is folded in here.
       On a flat world SPEC stops meaning "additive glint 0..145" and starts
       meaning "reflectance fraction 0..0.55" — renderFlat is the only
       consumer, so the sphere path is untouched. */
    /* A cut rock face the suns never reach still has to sit in the picture
       rather than fall out of it as a black bar glued to the silhouette. Sky
       light and bounce off the deck put a floor under it — the same trick, and
       the same theme split, the cube's unlit facets get. Only the wall takes
       it; the deck is lit properly and never comes near the floor. */
    const WF=document.documentElement.dataset.theme!=="dark"
      ?WALL_FLOOR_LIGHT:WALL_FLOOR_DARK;
    for(let k=0;k<P_count;k++){
      const a2=aoA[k];
      let r=SH_R[k]*a2,g=SH_G[k]*a2,b=SH_B[k]*a2;
      if(wallA[k]){
        if(r<WF[0])r=WF[0];
        if(g<WF[1])g=WF[1];
        if(b<WF[2])b=WF[2];
      }
      SH_R[k]=r;SH_G[k]=g;SH_B[k]=b;
      SPEC[k]=glA[k];
    }
  }
}

/* =========================================================
   CUBE WORLDS
   A sphere's silhouette never changes, so its spin is just an offset into the
   texture at sample time. A cube's silhouette changes with every degree it
   turns, so the whole projection is rebuilt each frame: an orthographic
   ray-box intersection whose ray direction is a frame constant, with the
   inverse rotation hoisted out of the pixel loop into three column vectors.

   Every pixel is assigned exactly one face by an argmax over three slab
   distances, so faces cannot fight over a pixel and no crack can open where
   two of them meet. Shading is per face, not per pixel: a cube shows at most
   three faces and every pixel on one shares its normal exactly, so the
   lighting model runs three times per frame instead of ninety thousand. That
   hard step at every edge is what makes the shape read as a cube, and it means
   the terminator can only ever fall along an edge — which is correct for flat
   facets, and the single strongest cue that this is not a lumpy sphere.
========================================================= */

/* half-side = R/sqrt3. Exact, not tuned: the furthest any vertex can project
   is h*sqrt3 (a body diagonal perpendicular to the view axis), so h*sqrt3 = 1
   makes the cube reach the buffer edge in its worst orientation and clip in
   none. A face-on cube therefore reads ~58% the width of a sphere; that is
   forced by geometry, and the alternative (rescaling per orientation) makes a
   cube pulse as it turns, which a real cube does not do. */
const CUBE_FIT=0.5773502691896258;
/* contact crease: the last (1-CUBE_SEAM) of each face before an edge darkens,
   so two faces separate even when the suns happen to light them equally.
   K was 0.26, which put a hard dark line along every one of the twelve edges;
   combined with the per-face value step it read as the terrain STOPPING at each
   edge rather than continuing across it (it does continue — the cubed-sphere
   mapping is exact). 0.15 still separates two equally lit faces. */
const CUBE_SEAM=0.90, CUBE_SEAM_K=0.15;
/* a face flatter than this to the camera is "grazing": it compresses ~1/nz
   texels into every screen pixel and there is no mip chain, so it is dimmed
   and creased hard until it reads as an edge line rather than a shimmer */
const CUBE_GRAZE=0.17;
/* a flat sea glints broadly, not in a pinpoint: pow(hd,90) against a constant
   per-face normal is a delta function and a face would flash for two frames.
   W was 115. With one normal per face that is a FLAT 115 added to every water
   pixel on the face — and waterMask is sampled nearest-neighbour while the
   colour is bilinear, so a half-texel band of already-blended LAND colour was
   getting the full warm add. That band is the hard orange fringe the critics
   saw outlining every coastline. renderFrame now weights the add by a bilinear
   water COVERAGE on the cube path, which removes the step; 46 keeps a sea sheen
   without the whole ocean turning to foil. */
const CUBE_SPEC_P=24, CUBE_SPEC_W=46;
/* An unlit facet fell to AMB*f = 0.30*0.46 = 0.14 of albedo, i.e. near-black
   against cream, and a cube reads as a hole punched in the page. Real diffuse
   inter-reflection and sky light put a floor under it. Theme-aware: cool slate
   on parchment (the sky it would be reflecting), a dimmer neutral on black. */
const CUBE_AMB_FLOOR_LIGHT=[0.30,0.32,0.37];
const CUBE_AMB_FLOOR_DARK =[0.155,0.165,0.19];
/* the sphere's scattered-limb term is 0.55 of a per-pixel rim; with one normal
   for a whole face, full strength floods the entire facet */
const CUBE_RIM_K=0.18;
/* the mapping is per-frame work, so keep the buffer modest. A cube covers only
   ~58% of S^2 against a sphere's 78%, so it still reads sharp here. */
const CUBE_MAXRES=448;
/* feather the silhouette. Requires the P_a line in renderFrame. */
const CUBE_AA=true;

const CB={S:0,cap:0,rot:1e9,tilt:1e9,wref:null,rfrac:1,
  pix:null,nx:null,ny:null,nz:null,row:null,rf:null,u:null,
  shR:null,shG:null,shB:null,sp:null,a:null,
  rowK:null,rowS:null,rowE:null,
  fR:new Float64Array(3).fill(1),fG:new Float64Array(3).fill(1),
  fB:new Float64Array(3).fill(1),fS:new Float64Array(3),
  fnx:new Float64Array(3),fny:new Float64Array(3),fnz:new Float64Array(3),
  fSM0:new Float64Array(3).fill(1e9),fSMK:new Float64Array(3),
  vx:new Float64Array(8),vy:new Float64Array(8),
  enx:new Float64Array(8),eny:new Float64Array(8),enc:new Float64Array(8),
  ord:new Int32Array(8),stk:new Int32Array(18),hull:new Int32Array(16)};

/* One allocation per resolution — the cube rebuilds every frame and must not
   churn the heap. A cube's projected area is 4h^2(|dx|+|dy|+|dz|), at most
   4h^2*sqrt3 = 0.578*S^2, so 0.62*S^2 is a proven-safe capacity, not a guess. */
function allocCube(size){
  const cap=((size*size*0.62)|0)+size+8;
  CB.S=size;CB.cap=cap;
  CB.pix=new Int32Array(cap);
  CB.nx=new Float32Array(cap);CB.ny=new Float32Array(cap);CB.nz=new Float32Array(cap);
  CB.row=new Int32Array(cap);CB.rf=new Float32Array(cap);CB.u=new Float32Array(cap);
  CB.shR=new Float32Array(cap);CB.shG=new Float32Array(cap);CB.shB=new Float32Array(cap);
  CB.sp=new Float32Array(cap);CB.a=new Uint8Array(cap);
  CB.rowK=new Int32Array(size);CB.rowS=new Int32Array(size);CB.rowE=new Int32Array(size);
}

/* computeLighting()'s model, evaluated once per visible face instead of once
   per pixel. Three deliberate departures from the sphere, all forced by "one
   normal for a whole face":
     - the scattered rim is damped to CUBE_RIM_K: on a sphere it is a thin halo
       at the limb, here it would wash out an entire facet;
     - the specular exponent drops from 90 to CUBE_SPEC_P, because a fixed
       normal sweeps the mirror angle in a couple of frames at pow 90;
     - the foreshortening term is steeper than the sphere's 0.55+0.45*sqrt(nz),
       which dims a grazing face toward an edge line and takes most of the
       contrast out of the point-sampling shimmer it would otherwise show. */
function cubeFaceShading(w){
  const TL=themeLight();                 /* same treatment the sphere gets */
  const AMB=TL.amb, IW=1/(1+TL.wrap);
  let sum=0;for(const s2 of w.suns)sum+=s2.lum;
  const scale=Math.min(1,TL.dir/sum);
  const LS=[];
  for(const s2 of w.suns){
    const pm=Math.sqrt(1-s2.zf*s2.zf);
    const Lx=Math.cos(s2.theta)*pm,Ly=Math.sin(s2.theta)*pm,Lz=s2.zf;
    let Hx=Lx,Hy=Ly,Hz=Lz+1;const hl=Math.hypot(Hx,Hy,Hz);
    LS.push({Lx,Ly,Lz,Hx:Hx/hl,Hy:Hy/hl,Hz:Hz/hl,
             lum:s2.lum*scale,tr:s2.tint[0],tg:s2.tint[1],tb:s2.tint[2]});
  }
  const h=CUBE_FIT;
  for(let i=0;i<3;i++){
    const nx=CB.fnx[i],ny=CB.fny[i],nz=CB.fnz[i];
    let r=AMB*TL.tr,g=AMB*TL.tg,b=AMB*TL.tb,sp=0;
    const rim=Math.pow(1-nz,2.5)*CUBE_RIM_K;
    for(let j=0;j<LS.length;j++){
      const s2=LS[j];
      const d=(nx*s2.Lx+ny*s2.Ly+nz*s2.Lz+TL.wrap)*IW;  /* the sphere's own wrap */
      if(d<=0)continue;
      const wt=d*s2.lum*(1+rim);
      r+=wt*s2.tr;g+=wt*s2.tg;b+=wt*s2.tb;
      const hd=nx*s2.Hx+ny*s2.Hy+nz*s2.Hz;
      if(hd>0)sp+=Math.pow(hd,CUBE_SPEC_P)*s2.lum;
    }
    const f=0.46+0.54*Math.sqrt(nz>0?nz:0);
    /* ...and then a floor, so a facet the suns never reach still sits in the
       picture instead of falling out of it. Lit faces are 0.9-1.3 and never
       touch this; only the dark ones are lifted. */
    const FL=document.documentElement.dataset.theme!=="dark"
      ?CUBE_AMB_FLOOR_LIGHT:CUBE_AMB_FLOOR_DARK;
    CB.fR[i]=Math.max(FL[0],Math.min(1.4,r)*f);
    CB.fG[i]=Math.max(FL[1],Math.min(1.4,g)*f);
    CB.fB[i]=Math.max(FL[2],Math.min(1.4,b)*f);
    CB.fS[i]=Math.min(1,sp)*CUBE_SPEC_W;
    /* the crease widens and deepens as the face turns edge-on, so a sliver a
       few degrees from the silhouette resolves to a dark contact line */
    let gz=(CUBE_GRAZE-nz)/CUBE_GRAZE;
    if(gz<0)gz=0;else if(gz>1)gz=1;
    const band=CUBE_SEAM-0.58*gz;
    CB.fSM0[i]=h*band;
    CB.fSMK[i]=(CUBE_SEAM_K+0.62*gz)/(h*(1-band));
  }
}

/* The silhouette of a convex solid is the convex hull of its projected
   vertices — a hexagon in general, a square when a face is head-on. Monotone
   chain over the 8 points; scanning its spans means the pixel loop never has
   to test for a miss, which removes ~44% of S^2 and an unpredictable branch. */
function cubeHull(){
  const px=CB.vx,py=CB.vy,ord=CB.ord,stk=CB.stk;
  for(let i=0;i<8;i++)ord[i]=i;
  for(let i=1;i<8;i++){                       /* insertion sort by x then y */
    const v=ord[i],vx=px[v],vy=py[v];let j=i-1;
    while(j>=0&&(px[ord[j]]>vx||(px[ord[j]]===vx&&py[ord[j]]>vy))){ord[j+1]=ord[j];j--}
    ord[j+1]=v;
  }
  let k=0;
  for(let i=0;i<8;i++){
    const p=ord[i];
    while(k>=2){
      const o=stk[k-2],a=stk[k-1];
      if((px[a]-px[o])*(py[p]-py[o])-(py[a]-py[o])*(px[p]-px[o])>0)break;
      k--;
    }
    stk[k++]=p;
  }
  const lower=k+1;
  for(let i=6;i>=0;i--){
    const p=ord[i];
    while(k>=lower){
      const o=stk[k-2],a=stk[k-1];
      if((px[a]-px[o])*(py[p]-py[o])-(py[a]-py[o])*(px[p]-px[o])>0)break;
      k--;
    }
    stk[k++]=p;
  }
  let n=k-1;
  if(n>16)n=16;
  for(let i=0;i<n;i++)CB.hull[i]=stk[i];
  return n;
}

/* Sub-pixel coverage along the silhouette only: each hull edge feathers the
   pixels within one pixel of it. O(perimeter), not O(area). Interior edges
   need no feathering — both sides of them are opaque, so there is nothing to
   blend against; the aliasing there is a low-contrast step between two flat
   tones and it does not crawl. The silhouette, which does crawl, is the only
   part that has to be right. */
function cubeEdgeAA(hn,y0,y1){
  const HX=CB.vx,HY=CB.vy,hull=CB.hull;
  const enx=CB.enx,eny=CB.eny,enc=CB.enc;
  const oA=CB.a,rowK=CB.rowK,rowS=CB.rowS,rowE=CB.rowE;
  let cx=0,cy=0;
  for(let i=0;i<hn;i++){cx+=HX[hull[i]];cy+=HY[hull[i]]}
  cx/=hn;cy/=hn;
  for(let i=0;i<hn;i++){                     /* inward unit normals */
    const a=hull[i],b=hull[i+1===hn?0:i+1];
    let nx=-(HY[b]-HY[a]),ny=HX[b]-HX[a];
    const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
    let c0=-(nx*HX[a]+ny*HY[a]);
    if(nx*cx+ny*cy+c0<0){nx=-nx;ny=-ny;c0=-c0}
    enx[i]=nx;eny[i]=ny;enc[i]=c0;
  }
  for(let y=y0;y<=y1;y++){
    const kS=rowK[y];if(kS<0)continue;
    const xs=rowS[y],xe=rowE[y],yc=y+0.5;
    for(let i=0;i<hn;i++){
      const nx=enx[i],base=eny[i]*yc+enc[i];
      let xa=xs,xb=xe;
      if(nx>1e-12){const lim=(1-base)/nx-0.5;if(lim<xs)continue;if(lim<xe)xb=Math.floor(lim)}
      else if(nx<-1e-12){const lim=(1-base)/nx-0.5;if(lim>xe)continue;if(lim>xs)xa=Math.ceil(lim)}
      else if(base>=0.5)continue;
      for(let x=xa;x<=xb;x++){
        let cov=nx*(x+0.5)+base+0.5;
        if(cov>=1)continue;
        if(cov<0)cov=0;
        const k=kS+(x-xs),v=(cov*255)|0;
        if(v<oA[k])oA[k]=v;
      }
    }
  }
}

/* Rebuild the whole projection for this spin + tilt. */
function mapCube(t){
  if(CB.S!==S)allocCube(S);
  const h=CUBE_FIT;

  /* view -> object rotation W = Ry(spin) . Rx(tilt) . Rz(ROLL). The Rx/Rz pair
     is exactly what recomputeMapping() applies to a sphere normal; Ry is the
     spin the sphere gets for free at sample time, folded into the geometry
     here because a cube's silhouette really does depend on it. Ry is oriented
     so lon(W.V) = lon(Rx.Rz.V) + 2*PI*rot, which is why a cube and a sphere in
     the same world turn at the same rate in the same direction with no
     cube-specific drag or BASE_VEL constants. */
  const ph=2*Math.PI*rot,cph=Math.cos(ph),sph=Math.sin(ph);
  const ct=Math.cos(t),stt=Math.sin(t);
  const a00=ROLL_C,     a01=-ROLL_S,    a02=0;
  const a10=ct*ROLL_S,  a11=ct*ROLL_C,  a12=-stt;
  const a20=stt*ROLL_S, a21=stt*ROLL_C, a22=ct;
  const W00=cph*a00+sph*a20, W01=cph*a01+sph*a21, W02=cph*a02+sph*a22;
  const W10=a10,             W11=a11,             W12=a12;
  const W20=-sph*a00+cph*a20,W21=-sph*a01+cph*a21,W22=-sph*a02+cph*a22;
  /* the three column vectors the frame hangs on: an orthographic ray through
     screen (sx,sy) is  o = sx*A + sy*B,  direction d = -C */
  const A0=W00,A1=W10,A2=W20;
  const B0=W01,B1=W11,B2=W21;
  const C0=W02,C1=W12,C2=W22;

  /* the three faces that can be entered, and their view-space normals. The
     entry face normal is M*n = sign(C_i)*(A_i,B_i,C_i), a unit vector with
     non-negative z — confirming only front faces are ever entered. */
  const g0=C0>=0?1:-1,g1=C1>=0?1:-1,g2=C2>=0?1:-1;
  CB.fnx[0]=g0*A0;CB.fny[0]=g0*B0;CB.fnz[0]=g0*C0;
  CB.fnx[1]=g1*A1;CB.fny[1]=g1*B1;CB.fnz[1]=g1*C1;
  CB.fnx[2]=g2*A2;CB.fny[2]=g2*B2;CB.fnz[2]=g2*C2;
  if(world)cubeFaceShading(world);

  const c=S/2,R=S/2-3,invR=1/R;
  for(let i=0;i<8;i++){
    const vx=(i&1)?h:-h,vy=(i&2)?h:-h,vz=(i&4)?h:-h;
    CB.vx[i]=c+(A0*vx+A1*vy+A2*vz)*R;
    CB.vy[i]=c+(B0*vx+B1*vy+B2*vz)*R;
  }
  const hn=cubeHull(),hull=CB.hull,HX=CB.vx,HY=CB.vy;
  if(hn<3){                       /* degenerate: never happens for a cube, but
                                     a stale P_count would render last frame's
                                     geometry under this frame's shading */
    P_count=0;CB.rot=rot;CB.tilt=t;CB.wref=world;return;
  }
  {                               /* mean hull radius, as a fraction of S/2 —
                                     lets updateMoons() size the transit disc */
    let sr=0;
    for(let i=0;i<hn;i++){const dx=HX[hull[i]]-c,dy=HY[hull[i]]-c;sr+=Math.sqrt(dx*dx+dy*dy)}
    CB.rfrac=(sr/hn)/(S*0.5);
  }

  /* slab constants. Nudging a zero component keeps 0*Infinity out of the loop;
     an edge-on face then wins the argmax only exactly on the silhouette line,
     which is where it belongs. The 1e-9 clamp is load-bearing: without it the
     term is -Infinity and the hit point becomes 0*Infinity = NaN. */
  let d0=-C0,d1=-C1,d2=-C2;
  if(d0<1e-9&&d0>-1e-9)d0=d0<0?-1e-9:1e-9;
  if(d1<1e-9&&d1>-1e-9)d1=d1<0?-1e-9:1e-9;
  if(d2<1e-9&&d2>-1e-9)d2=d2<0?-1e-9:1e-9;
  const i0=1/d0,i1=1/d1,i2=1/d2;
  const k0=-h*(i0<0?-i0:i0),k1=-h*(i1<0?-i1:i1),k2=-h*(i2<0?-i2:i2);
  const e0=d0>0?-h:h,e1=d1>0?-h:h,e2=d2>0?-h:h;
  const qa0=A0*i0,qa1=A1*i1,qa2=A2*i2;
  const qb0=B0*i0,qb1=B1*i1,qb2=B2*i2;
  const s0=-qa0*invR,s1=-qa1*invR,s2=-qa2*invR;   /* per-pixel step along a row */

  const ROWK=TH/Math.PI,ROWB=TH*0.5-0.5,RCLAMP=TH-2;
  /* renderFrame adds rot back. Storing frac(rot) rather than rot keeps P_u — a
     Float32Array — inside (-1.5, 1] forever; rot grows unbounded over a long
     session and storing u_true-rot directly would lose ~0.02 texels after ten
     hours. renderFrame's own u -= Math.floor(u) recovers frac(u_true) exactly,
     and the cloud tap keeps the same 0.22x differential drift the sphere gets. */
  const rotOff=rot-Math.floor(rot);
  const fR=CB.fR,fG=CB.fG,fB=CB.fB,fS=CB.fS,fnx=CB.fnx,fny=CB.fny,fnz=CB.fnz;
  const fSM0=CB.fSM0,fSMK=CB.fSMK;
  const oPix=CB.pix,oNx=CB.nx,oNy=CB.ny,oNz=CB.nz,oRow=CB.row,oRf=CB.rf,oU=CB.u;
  const oR=CB.shR,oG=CB.shG,oB=CB.shB,oS=CB.sp,oA=CB.a;
  const rowK=CB.rowK,rowS=CB.rowS,rowE=CB.rowE,cap=CB.cap;

  let ylo=1e9,yhi=-1e9;
  for(let i=0;i<hn;i++){const yy=HY[hull[i]];if(yy<ylo)ylo=yy;if(yy>yhi)yhi=yy}
  let y0=Math.ceil(ylo-0.5);if(y0<0)y0=0;
  let y1=Math.floor(yhi-0.5);if(y1>S-1)y1=S-1;
  if(y1>=y0)rowK.fill(-1,y0,y1+1);

  let kk=0;
  for(let y=y0;y<=y1;y++){
    const yc=y+0.5;
    let xl=1e9,xr=-1e9;                       /* the hull's span on this row */
    for(let i=0;i<hn;i++){
      const a=hull[i],b=hull[i+1===hn?0:i+1];
      const ya=HY[a],yb=HY[b];
      if((ya<=yc)===(yb<=yc))continue;
      const xx=HX[a]+(HX[b]-HX[a])*(yc-ya)/(yb-ya);
      if(xx<xl)xl=xx;
      if(xx>xr)xr=xx;
    }
    if(xr<xl)continue;
    let xs=Math.ceil(xl-0.5);if(xs<0)xs=0;
    let xe=Math.floor(xr-0.5);if(xe>S-1)xe=S-1;
    if(xe<xs)continue;
    if(kk+(xe-xs+1)>cap)break;                /* unreachable; insurance only */
    rowK[y]=kk;rowS[y]=xs;rowE[y]=xe;
    const sy=(yc-c)*invR,sx0=(xs+0.5-c)*invR;
    let w0=k0-(sx0*qa0+sy*qb0)-s0;
    let w1=k1-(sx0*qa1+sy*qb1)-s1;
    let w2=k2-(sx0*qa2+sy*qb2)-s2;
    let p=y*S+xs;

    for(let x=xs;x<=xe;x++,p++){
      /* --- ray/box: three running slab distances, entry face = the largest.
         u_i is affine in sx, so w_i steps by a constant: three adds replace
         six multiplies and three divides. Inside the hull tEnter <= tExit
         always, so tExit is never computed and there is no miss test. --- */
      w0+=s0;w1+=s1;w2+=s2;
      let tn=w0,fi=0;
      if(w1>tn){tn=w1;fi=1}
      if(w2>tn){tn=w2;fi=2}
      /* p_i = o_i + tn*d_i = e_i + d_i*(tn - w_i); on the argmax axis this
         collapses to exactly e_i, as it must, with no cancellation */
      const hx=e0+d0*(tn-w0),hy=e1+d1*(tn-w1),hz=e2+d2*(tn-w2);

      /* --- surface point -> direction -> equirect row (cubed sphere).
         p/|p| is continuous everywhere on the cube surface, so terrain is
         continuous across all twelve edges and all eight corners: a coastline
         crossing an edge lands on the same texel from both sides.
         atan(q) ~= q*(...) for q in [0,1], max error ~1e-5 rad, folded to full
         range by the quadrant/reciprocal identities. --- */
      const hyp=Math.sqrt(hx*hx+hz*hz);
      const ay=hy<0?-hy:hy;
      const up=ay<hyp;
      const qa=up?ay/hyp:hyp/(ay+1e-30);
      const q2=qa*qa;
      let lat=qa*(0.9998660+q2*(-0.3302995+q2*(0.1801410+q2*(-0.0851330+q2*0.0208351))));
      if(!up)lat=1.5707963267948966-lat;
      if(hy<0)lat=-lat;
      const rowF=lat*ROWK+ROWB;
      let r0=rowF|0,rfr=rowF-r0;
      if(rowF<0){r0=0;rfr=0}
      else if(r0>RCLAMP){r0=RCLAMP;rfr=1}   /* matches the sphere */

      /* --- and longitude, in turns, from the same polynomial. Computed
         exactly rather than from a table, so the +/-180 meridian crossing one
         face down its middle has no branch-cut artifact. --- */
      const ax=hx<0?-hx:hx,az=hz<0?-hz:hz;
      const vp=ax<az;
      const qc=vp?ax/az:az/(ax+1e-30);
      const q3=qc*qc;
      let uu=qc*(0.9998660+q3*(-0.3302995+q3*(0.1801410+q3*(-0.0851330+q3*0.0208351))))*INV2PI;
      if(!vp)uu=0.25-uu;
      if(hz<0)uu=0.5-uu;
      if(hx<0)uu=-uu;

      /* faces meet in a thin crease of contact shadow. The second-largest |p|
         component is exactly the distance to the nearest edge on this face.
         Clamped at zero: a negative shading multiplier writes negative RGB
         into renderFrame's packed integer and produces bright garbage. */
      const sec=fi===0?(ay>az?ay:az):fi===1?(ax>az?ax:az):(ax>ay?ax:ay);
      let ao=1;
      const sm0=fSM0[fi];
      if(sec>sm0){ao=1-(sec-sm0)*fSMK[fi];if(ao<0)ao=0}

      oPix[kk]=p;
      oRow[kk]=r0*TW;
      oRf[kk]=rfr;
      oU[kk]=uu-rotOff;
      oNx[kk]=fnx[fi];oNy[kk]=fny[fi];oNz[kk]=fnz[fi];
      oR[kk]=fR[fi]*ao;oG[kk]=fG[fi]*ao;oB[kk]=fB[fi]*ao;oS[kk]=fS[fi]*ao;
      kk++;
    }
    oA.fill(255,rowK[y],kk);
  }
  if(CUBE_AA&&y1>=y0)cubeEdgeAA(hn,y0,y1);

  P_count=kk;
  P_pix=oPix;N_x=oNx;N_y=oNy;N_z=oNz;
  P_row=oRow;P_rf=oRf;P_u=oU;
  SH_R=oR;SH_G=oG;SH_B=oB;SPEC=oS;P_a=oA;
  CB.rot=rot;CB.tilt=t;CB.wref=world;
}

/* Which shape the geometry arrays currently hold. mapFlat() overwrites the
   shared normals, so returning to a sphere has to rebuild them — otherwise the
   sphere is mapped through leftover plane normals and renders featureless. */
let mappedShape="sphere";

function recomputeMapping(t){
  if(SHAPE==="cube"){
    /* a cube is rebuilt every frame, so skip it outright when nothing moved.
       2e-6 turns is 0.003 px of silhouette motion at S=448, and the test is
       against the last BUILT state, so a slow drift still triggers a rebuild
       once it accumulates past the threshold — no unbounded drift is
       possible. The world check matters: with autoRotate off (or
       prefers-reduced-motion) spinVel is 0 and rot never changes, so without
       it a cube built before the world existed would stay flat-lit forever. */
    if(mappedShape==="cube"&&CB.S===S&&CB.wref===world&&
       Math.abs(rot-CB.rot)<2e-6&&Math.abs(t-CB.tilt)<5e-4)return;
    if(buf32)buf32.fill(0);
    mapCube(t);mappedShape="cube";computedTilt=t;return;
  }
  /* the visible pixel set changes with shape and view angle, so wipe the
     buffer — only pixels the new mapping covers get written each frame */
  if(buf32)buf32.fill(0);
  if(SHAPE!=="sphere"){mapFlat(t);mappedShape=SHAPE;computedTilt=t;return}
  if(mappedShape!=="sphere"){
    initOrb(S);                       /* restores the unit-sphere geometry */
    mappedShape="sphere";
    if(world)computeLighting(world);
  }
  const ct=Math.cos(t),st2=Math.sin(t);
  for(let k=0;k<P_count;k++){
    const rx=N_x[k]*ROLL_C-N_y[k]*ROLL_S;
    const ry0=N_x[k]*ROLL_S+N_y[k]*ROLL_C;
    const ry=ry0*ct-N_z[k]*st2;
    const rz=ry0*st2+N_z[k]*ct;
    const cy=ry<-1?-1:ry>1?1:ry;
    const lat=Math.asin(cy);
    const rowF=(lat/Math.PI+0.5)*TH-0.5;
    let r0=Math.floor(rowF), rf=rowF-r0;
    if(r0<0){r0=0;rf=0}else if(r0>TH-2){r0=TH-2;rf=1}
    P_row[k]=r0*TW;
    P_rf[k]=rf;
    P_u[k]=Math.atan2(rx,rz)*INV2PI;
  }
  computedTilt=t;
}

let rot=0, cloudDrift=0, showClouds=true;
let shadeClouds=false, CSH_U=0.012;   /* flat worlds only: cloud shadow offset */
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let autoRotate=!reducedMotion;
const BASE_VEL=0.0000105;
let spinVel=autoRotate?BASE_VEL:0;
let dragging=false,lastFrame=0;
let CTr=250,CTg=251,CTb=252; /* cloud tint */

function renderFrame(){
  /* discs and hoops get their own loop; a cube stays on this one, because its
     faces are sampled through the sphere's own equirect mapping */
  if(SHAPE!=="sphere"&&SHAPE!=="cube"){renderFlat();return}
  const ru=rot, rc=rot*1.22+cloudDrift, PA=P_a;
  /* On a sphere SPEC is pow(hd,90) — a highlight a few pixels across, so a
     nearest-neighbour water test is invisible. On a cube SPEC is CONSTANT over
     a whole facet, so the same nearest test paints a hard warm outline along
     every coastline (a half-texel of land colour flagged as water). The cube
     therefore weights the specular by a bilinear water coverage instead; the
     sphere keeps its exact 0/1 lookup and its exact former appearance. */
  const softWater=SHAPE==="cube";
  for(let k=0;k<P_count;k++){
    let u=P_u[k]+ru; u-=Math.floor(u);
    /* bilinear terrain sampling — no stair-stepped coastlines */
    const uw=u*TW;
    let u0=uw|0; const uf=uw-u0;
    if(u0>=TW)u0=0;
    const u1=u0+1===TW?0:u0+1;
    const ro=P_row[k], rfr=P_rf[k];
    const c00=tex32[ro+u0],c10=tex32[ro+u1],c01=tex32[ro+TW+u0],c11=tex32[ro+TW+u1];
    const w00=(1-uf)*(1-rfr),w10=uf*(1-rfr),w01=(1-uf)*rfr,w11=uf*rfr;
    let r=(c00&255)*w00+(c10&255)*w10+(c01&255)*w01+(c11&255)*w11;
    let g=((c00>>>8)&255)*w00+((c10>>>8)&255)*w10+((c01>>>8)&255)*w01+((c11>>>8)&255)*w11;
    let b=((c00>>>16)&255)*w00+((c10>>>16)&255)*w10+((c01>>>16)&255)*w01+((c11>>>16)&255)*w11;
    const o=ro+(uf<0.5?u0:u1);
    let uc=P_u[k]+rc; uc-=Math.floor(uc);
    const ci=ro+((uc*TW)|0);
    const a=showClouds?cloudA[ci]:0;
    /* On a flat world nothing self-shadows, so the cloud deck casts onto the
       surface: sample the deck offset along the sun bearing and darken there. */
    if(shadeClouds&&showClouds){
      let us2=uc+CSH_U; us2-=Math.floor(us2);
      const sa=cloudA[ro+((us2*TW)|0)];
      if(sa>a){
        const d=1-(sa-a)*0.0012;
        r*=d;g*=d;b*=d;
      }
    }
    if(a){
      const s8=cloudS[ci];   /* self-shaded: bright cores, grey skirts */
      const tr=(CTr*s8)>>8,tg=(CTg*s8)>>8,tb=(CTb*s8)>>8;
      r+=((tr-r)*a)/256; g+=((tg-g)*a)/256; b+=((tb-b)*a)/256;
    }
    let R2=r*SH_R[k],G2=g*SH_G[k],B2=b*SH_B[k];
    if(SPEC[k]>0.5){
      const wf=softWater
        ? waterMask[ro+u0]*w00+waterMask[ro+u1]*w10+
          waterMask[ro+TW+u0]*w01+waterMask[ro+TW+u1]*w11
        : waterMask[o];
      if(wf>0){
        const sp=SPEC[k]*(1-a*0.0039)*wf; /* clouds mute the glint */
        R2+=sp;G2+=sp*0.97;B2+=sp*0.92;
      }
    }
    if(R2>255)R2=255; if(G2>255)G2=255; if(B2>255)B2=255;
    buf32[P_pix[k]]=(PA[k]<<24)|(B2<<16)|(G2<<8)|R2;
  }
  ctx.putImageData(img,0,0);
}

/* A flat world gets its own loop. Its face has no form of its own, so the
   depth has to be composited here: a cloud shadow offset toward the sun, a
   lit flank and a dark lee on the cloud itself, a sky-reflecting sea, and
   air piling up toward the far rim. It can afford the extra reads — a disc
   tilted at phi covers only about sin(phi) of the pixels a sphere does, so
   this loop is cheaper per frame than the sphere path it replaces. */
function renderFlat(){
  /* AIR is now a reusable capacity-sized buffer rather than an exact-length
     copy, so this only checks that it is big enough — an equality test here
     silently drew nothing and left the previous world on the canvas. */
  if(!AIR||AIR.length<P_count)return;
  const ru=rot, rc=rot*1.22+cloudDrift;
  const hzr=HZ_R,hzg=HZ_G,hzb=HZ_B,skr=SKY_R,skg=SKY_G,skb=SKY_B;
  for(let k=0;k<P_count;k++){
    let u=P_u[k]+ru; u-=Math.floor(u);
    const uw=u*TW;
    let u0=uw|0; const uf=uw-u0;
    if(u0>=TW)u0=0;
    const u1=u0+1===TW?0:u0+1;
    const ro=P_row[k], rfr=P_rf[k];
    const c00=tex32[ro+u0],c10=tex32[ro+u1],c01=tex32[ro+TW+u0],c11=tex32[ro+TW+u1];
    const w00=(1-uf)*(1-rfr),w10=uf*(1-rfr),w01=(1-uf)*rfr,w11=uf*rfr;
    let r=(c00&255)*w00+(c10&255)*w10+(c01&255)*w01+(c11&255)*w11;
    let g=((c00>>>8)&255)*w00+((c10>>>8)&255)*w10+((c01>>>8)&255)*w01+((c11>>>8)&255)*w11;
    let b=((c00>>>16)&255)*w00+((c10>>>16)&255)*w10+((c01>>>16)&255)*w01+((c11>>>16)&255)*w11;
    const o=ro+(uf<0.5?u0:u1);
    let a=0,s8=210;
    if(showClouds){
      let uc=P_u[k]+rc; uc-=Math.floor(uc);
      const ci=ro+((uc*TW)|0);
      let ud=SD_u[k]+rc; ud-=Math.floor(ud);
      const sa=cloudA[SD_row[k]+((ud*TW)|0)];   /* the ONE extra lookup */
      a=cloudA[ci];
      const dif=sa-a;
      if(dif>0){        /* a cloud sits sunward and above: it shadows this point */
        const d=dif*SHADOW_K;
        r-=r*d; g-=g*d; b-=b*d;
      }
      if(a){            /* and the same lookup gives the cloud a lit flank and a lee */
        s8=cloudS[ci]-dif*FLANK_K;
        if(s8<70)s8=70; else if(s8>255)s8=255;
      }
    }
    if(a){
      const tr=(CTr*s8)>>8,tg=(CTg*s8)>>8,tb=(CTb*s8)>>8;
      r+=((tr-r)*a)/256; g+=((tg-g)*a)/256; b+=((tb-b)*a)/256;
    }
    let R2=r*SH_R[k],G2=g*SH_G[k],B2=b*SH_B[k];
    const f=SPEC[k];                            /* reflectance, not additive glint */
    if(f>0.004&&waterMask[o]){
      const ff=f*(1-a*0.0031);                  /* clouds kill the reflection */
      R2+=(skr-R2)*ff; G2+=(skg-G2)*ff; B2+=(skb-B2)*ff;
    }
    const ar=AIR[k];                            /* aerial perspective, last */
    R2+=(hzr-R2)*ar; G2+=(hzg-G2)*ar; B2+=(hzb-B2)*ar;
    if(R2<0)R2=0; else if(R2>255)R2=255;
    if(G2<0)G2=0; else if(G2>255)G2=255;
    if(B2<0)B2=0; else if(B2>255)B2=255;
    buf32[P_pix[k]]=(P_a[k]<<24)|(B2<<16)|(G2<<8)|R2;
  }
  ctx.putImageData(img,0,0);
}

/* =========================================================
   MOONS + SUNS + RINGS
========================================================= */
const orbWrap=document.getElementById("orbWrap");
const moonsHost=document.getElementById("moons");
const sunsHost=document.getElementById("suns");
let wrapW=orbWrap.clientWidth;
/* Match the sphere buffer to on-screen pixels (capped for frame budget).
   The zoom control is a CSS transform on .orb-wrap, so at zoom 1.5 the planet
   covers 1.5x the pixels it did — and a control labelled ZOOM that only
   magnifies a 660px backing store delivers a blurred wash instead of more
   world. The effective on-screen width therefore includes the zoom, and the cap
   is raised while zoomed so the buffer can actually follow it. */
/* The zoomed caps are set by the frame budget, measured: the sphere loop runs
   ~7.9ms at 660 and ~17.4ms at 976, so 880 (~14ms) is the most that still
   clears 60fps with the moons and the ring spin on top. The cube remaps every
   frame, so its ceiling is lower again. */
const ORB_MAXRES=660, ORB_MAXRES_ZOOM=880, CUBE_MAXRES_ZOOM=528;
function fitOrbResolution(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const z=zoom>1.02?zoom:1;
  const lim=SHAPE==="cube"
    ?(z>1?CUBE_MAXRES_ZOOM:CUBE_MAXRES)
    :(z>1?ORB_MAXRES_ZOOM:ORB_MAXRES);
  const target=Math.max(320,Math.min(lim,Math.round(orbWrap.clientWidth*z*dpr/16)*16));
  if(Math.abs(target-S)<32)return false;
  initOrb(target);
  mappedShape="sphere";      /* initOrb lays down sphere geometry */
  computedTilt=99;
  return true;
}
let rsT=0;
addEventListener("resize",()=>{
  wrapW=orbWrap.clientWidth;
  if(world){fitTitle();syncGazFade()}   /* the columns resized; re-fit type + fade */
  clearTimeout(rsT);
  rsT=setTimeout(()=>{if(fitOrbResolution()&&world)computeLighting(world)},200);
});
let moonEls=[],sunEls=[],primL=[0.6,-0.5,0.62];
const stageEl=document.getElementById("stage");

function sunLightVec(s2){
  const pm=Math.sqrt(1-s2.zf*s2.zf);
  return [Math.cos(s2.theta)*pm, Math.sin(s2.theta)*pm, s2.zf];
}

/* --- cratered mini-sphere: a real height field (crater bowls with
   raised rims + mottling) perturbs the sphere normal, so craters
   catch the actual sunlight direction. Rendered 3x for crispness. --- */
function drawMoon(cv,m,L){
  /* 2x rather than 3x: enough to antialias the limb, but it keeps the grain at
     roughly the same apparent size as the planet's rather than three times finer */
  const px=Math.max(20,Math.round(m.size*2));
  cv.width=px;cv.height=px;
  cv.style.width=cv.style.height=m.size+"px";
  const c2=cv.getContext("2d");
  const im=c2.createImageData(px,px);
  const b32=new Uint32Array(im.data.buffer);
  const half=px/2;
  const [base,dark]=m.tone;
  const s=m.tseed;
  const STEPS=5;
  for(let y=0;y<px;y++)for(let x=0;x<px;x++){
    const dx=(x+0.5-half)/(half-1), dy=(y+0.5-half)/(half-1);
    const d2=dx*dx+dy*dy;
    if(d2>1)continue;
    const dist=Math.sqrt(d2);
    const nz=Math.sqrt(1-d2);
    /* Mottle quantised into a few flat tones — the same banded read the planet
       gets from its land ramp. The old version bump-mapped a worley crater
       field, which rendered beautifully but looked photographic beside a
       painted world. */
    const f=fbm(dx*2,dy*2,nz*2,s+13,3)*0.75+fbm(dx*4.6,dy*4.6,nz*4.6,s+7,2)*0.25;
    let t=Math.max(0,Math.min(1,(f-0.28)*2.1));
    t=Math.round(t*(STEPS-1))/(STEPS-1);
    let r=dark[0]+(base[0]-dark[0])*t;
    let g=dark[1]+(base[1]-dark[1])*t;
    let b=dark[2]+(base[2]-dark[2])*t;
    const jit=(hash3(x,y,0,s)-0.5)*9;   /* the same grain the planet carries */
    r+=jit;g+=jit;b+=jit;
    /* one lambert term, matching the planet's terminator wrap and limb falloff */
    let lam=dx*L[0]+dy*L[1]+nz*L[2];
    lam=Math.max(0,(lam+0.13)/1.13);
    const sh=(0.17+0.95*lam)*(0.6+0.4*Math.sqrt(nz));
    r=Math.min(255,Math.max(0,r*sh));
    g=Math.min(255,Math.max(0,g*sh));
    b=Math.min(255,Math.max(0,b*sh));
    /* anti-aliased edge */
    const aa=Math.max(0,Math.min(1,(1-dist)*half*0.9));
    const a=(aa*255)|0;
    if(a<2)continue;
    b32[y*px+x]=(a<<24)|(b<<16)|(g<<8)|r;
  }
  c2.putImageData(im,0,0);
}

/* --- star core: a ball of light. Opaque white-hot center melts
   through a soft shoulder into an exponential halo — no hard limb,
   only the faintest granulation so it never reads as a surface. --- */
function drawSunCore(cv,s2){
  const cs=Math.round(s2.size*2.2);
  const px=Math.round(Math.min(cs*1.25,300));
  cv.width=px;cv.height=px;
  cv.style.width=cv.style.height=cs+"px";
  cv.style.marginLeft=cv.style.marginTop=(-cs/2)+"px";
  const c2=cv.getContext("2d");
  const im=c2.createImageData(px,px);
  const b32=new Uint32Array(im.data.buffer);
  const half=px/2;
  const rc=half*(s2.size/cs);
  const maxD=half/rc;
  const [cr,cg,cb]=s2.core;
  const s=(s2.theta*1e6|0)+s2.size|0;
  const spotty=s2.kind!=="white";
  for(let y=0;y<px;y++)for(let x=0;x<px;x++){
    const ddx=x+0.5-half, ddy=y+0.5-half;
    const dist=Math.hypot(ddx,ddy)/rc;
    if(dist>=maxD)continue;
    const nx2=ddx/rc,ny2=ddy/rc;
    let br,a;
    if(dist<1){
      const gran=fbm(nx2*6.5,ny2*6.5,0.7,s,3);
      br=(1-0.15*Math.pow(dist,2.6))*(0.96+0.08*gran);
      if(spotty){
        const spot=fbm(nx2*2.2,ny2*2.2,3.1,s+40,3);
        if(spot<0.28)br*=0.86+spot*0.5;      /* the faintest mottling */
      }
      a=1;
    }else{
      br=1;
      const tt=(dist-1)/(maxD-1);
      a=Math.exp(-(dist-1)*2.9)*Math.pow(Math.max(0,1-tt),1.6); /* halo tail reaches true zero at the rim */
      a*=0.94+0.12*(hash3(x,y,2,s)-0.5);     /* dither kills alpha banding */
    }
    const hot=Math.pow(Math.max(0,1-dist*0.52),1.1);
    let r=(cr+(255-cr)*Math.min(1,hot*1.2))*br;
    let g=(cg+(253-cg)*Math.min(1,hot*1.12))*br;
    let b=(cb+(250-cb)*hot)*br;
    const jit=(hash3(x,y,0,s)-0.5)*4;
    r+=jit;g+=jit;b+=jit;
    const ab=Math.max(0,Math.min(255,a*255))|0;
    if(ab<2)continue;
    r=Math.min(255,Math.max(0,r));g=Math.min(255,Math.max(0,g));b=Math.min(255,Math.max(0,b));
    b32[y*px+x]=(ab<<24)|(b<<16)|(g<<8)|r;
  }
  c2.putImageData(im,0,0);
}

/* --- corona layer: streamers and long rays on an annulus, with a
   smooth (1-t)^2 envelope so nothing ever hits the canvas edge.
   Two layers with different seeds counter-rotate and breathe. --- */
function drawSunCorona(cv,s2,li){
  const cs=Math.round(s2.size*3.7);
  const px=Math.round(Math.min(cs,380));
  cv.width=px;cv.height=px;
  cv.style.width=cv.style.height=cs+"px";
  cv.style.marginLeft=cv.style.marginTop=(-cs/2)+"px";
  const c2=cv.getContext("2d");
  const im=c2.createImageData(px,px);
  const b32=new Uint32Array(im.data.buffer);
  const half=px/2;
  const rc=half*(s2.size/cs);
  const maxD=half/rc;
  const [cr,cg,cb]=s2.core;
  const s=(s2.theta*1e6|0)+(s2.size|0)+li*7919;
  for(let y=0;y<px;y++)for(let x=0;x<px;x++){
    const ddx=x+0.5-half, ddy=y+0.5-half;
    const dist=Math.hypot(ddx,ddy)/rc;
    if(dist<0.5||dist>=maxD)continue;
    const nx2=ddx/rc,ny2=ddy/rc;
    const t=(dist-0.5)/(maxD-0.5);
    const env=Math.pow(1-t,2);               /* fades to zero well before the rim */
    const ang=Math.atan2(ny2,nx2);
    const wisp=fbm(Math.cos(ang)*2.7,Math.sin(ang)*2.7,dist*0.38,s+9,4);
    const stream=Math.pow(Math.max(0,wisp),1.8);
    const ray=Math.pow(Math.max(0,fbm(Math.cos(ang)*(3.6+li*1.3),Math.sin(ang)*(3.6+li*1.3),0.5,s+77,2)-0.36),1.5)*3.6;
    const glow=Math.exp(-(dist-0.5)*1.6);
    let al=env*glow*(0.3+0.85*stream+ray*0.7);
    al*=0.9+0.2*(hash3(x,y,1,s)-0.5);        /* particulate grain */
    const a=Math.max(0,Math.min(255,al*255))|0;
    if(a<2)continue;
    const warm=Math.exp(-t*2.2);                             /* stays saturated, not washed white */
    let r=cr+(255-cr)*warm*0.36;
    let g=cg+(253-cg)*warm*0.28;
    let b=cb+(250-cb)*warm*0.22;
    b32[y*px+x]=(a<<24)|(b<<16)|(g<<8)|r;
  }
  c2.putImageData(im,0,0);
}

/* --- banded, grainy ring texture drawn flat, foreshortened by CSS.
   Macro bands carry fine ringlets and hairline grooves, three
   division gaps of varying sharpness, and a tint that drifts from
   icy-bright to dusty band by band. --- */
/* The ring's radial density and tint, as 1-D profiles. Shared, because the
   planet's umbra has to be modulated by the same densities: composited as a
   flat layer it paints a dark bar hanging in an empty division, which is a
   shadow cast by particles that are not there. */
const RING_RSTEPS=4096;
function ringRadialProfile(world){
  const s=world.rings.rseed;
  const grng=mulberry32(s);
  /* one or two broad divisions plus a handful of hairlines — real systems are
     not three evenly fuzzy gaps. The hairline sharpness is capped: the annulus
     is only ~218px of radial resolution at N=1024, so a steeper gap than ~260
     is thinner than a pixel and shimmers instead of reading as a division. */
  const gaps=[],gapW=[],gapS=[];
  for(let i=0;i<2;i++){gaps.push(0.18+i*0.34+grng()*0.16);gapW.push(0.88+grng()*0.10);gapS.push(20+grng()*16)}
  for(let i=0;i<4;i++){gaps.push(0.07+grng()*0.88);gapW.push(0.72+grng()*0.26);gapS.push(110+grng()*150)}
  const NG=gaps.length;
  /* band GROUPS, in two passes. The smoothstep below is what makes the field
     bimodal — dense sheets with genuinely near-empty stretches between them,
     instead of a floor that fills the whole annulus with the same haze and
     reads as a smudge. A fixed threshold would be at the mercy of where this
     seed's noise happens to sit (one seed measured 53% empty, another 2%), so
     the knees are set at fixed PERCENTILES of this ring's own field: every
     ring then gets sheets and gaps, and only their placement varies. */
  const grp=new Float32Array(RING_RSTEPS);
  for(let i=0;i<RING_RSTEPS;i++)grp[i]=fbm(i/(RING_RSTEPS-1)*2.7,0.9,0.4,s+3,3);
  const srt=Float32Array.from(grp).sort();
  const glo=srt[(RING_RSTEPS*0.30)|0], ghi=srt[(RING_RSTEPS*0.72)|0];
  const gspan=(ghi-glo)>1e-4?(ghi-glo):1e-4;
  const densR=new Float32Array(RING_RSTEPS), tintR=new Float32Array(RING_RSTEPS);
  for(let i=0;i<RING_RSTEPS;i++){
    const t=i/(RING_RSTEPS-1);
    const group=grp[i];
    const g=Math.max(0,Math.min(1,(group-glo)/gspan));
    let dens=0.035+2.30*(g*g*(3-2*g));
    dens*=0.55+0.62*fbm(t*7.1,0.37,0.71,s,4);               /* band structure */
    dens*=0.8+0.28*fbm(t*33,1.4,2.2,s+5,3);                 /* fine ringlets */
    /* two incommensurate, noise-detuned ripples — and their amplitude is gated
       by the local density, so ringlets exist only inside the sheets. A single
       constant-pitch sine at full amplitude everywhere is what made the old
       ring read as an etched vinyl record. */
    const rip=Math.sin(t*(230+110*group)+fbm(t*6,0.2,0.4,s+8,2)*34)
             +0.62*Math.sin(t*389+fbm(t*3.3,0.7,0.1,s+9,2)*26);
    dens*=1+0.34*rip*Math.min(1,dens*1.5);
    for(let gi=0;gi<NG;gi++){
      const dq=(t-gaps[gi])*gapS[gi];
      dens*=1-gapW[gi]*Math.exp(-dq*dq);
    }
    dens*=Math.min(1,t/0.06)*Math.min(1,(1-t)/0.1);         /* edge fades */
    densR[i]=dens>0?dens:0;
    /* a coarse field, so ice and dust vary by band GROUP rather than per
       ringlet — a ring whose every band is the same hue reads as printed */
    tintR[i]=fbm(t*3.4,0.8,0.3,s+21,3)-0.5;
  }
  return {densR,tintR};
}

function ringTextureURL(world){
  const N=1024;
  const cv=document.createElement("canvas");
  cv.width=cv.height=N;
  const c2=cv.getContext("2d");
  const im=c2.createImageData(N,N);
  const b32=new Uint32Array(im.data.buffer);
  const half=N/2;
  const rin=half*0.56, rout=half*0.985;
  const [cr,cg,cb]=world.rings.rgb;
  const s=world.rings.rseed;
  /* azimuthal clumping — drifting arcs make the ring's rotation visible */
  const ASTEPS=2048;
  const azR=new Float32Array(ASTEPS);
  for(let i=0;i<ASTEPS;i++){
    const a2=i/ASTEPS*2*Math.PI;
    azR[i]=fbm(Math.cos(a2)*1.9,Math.sin(a2)*1.9,0.6,s+33,3);
  }
  const {densR,tintR}=ringRadialProfile(world);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const ddx=x+0.5-half, ddy=y+0.5-half;
    const rr=Math.hypot(ddx,ddy);
    if(rr<rin||rr>rout)continue;
    const t=(rr-rin)/(rout-rin);
    const ri=(t*(RING_RSTEPS-1))|0;
    const dv=densR[ri];
    if(dv<0.004)continue;
    const ang=Math.atan2(ddy,ddx);
    /* particulate grain sampled in (radius, angle) space, so clumps stretch
       ALONG the ring the way orbiting streams do. Per-texel white noise gets
       averaged to flat grey by the 3.6:1 vertical squash of rotateX(74deg);
       a little of it is kept on top for the sparkle it does give. */
    const gr=0.42+0.78*fbm(t*210,ang*7.5,0.3,s+61,2)*(0.55+0.9*hash3(x,y,0,s));
    const ai=(((ang*(0.5/Math.PI)+0.5)*ASTEPS+t*260)|0)%ASTEPS;
    const az=azR[ai];                                       /* sheared clumps read as motion */
    /* arcs where the ring is thin, near-uniform inside a dense sheet */
    const azAmp=0.12+0.55*(1-(dv<1?dv:1));
    let al=Math.pow(dv<1?dv:1,0.80)*gr*(1-azAmp+2*azAmp*az)*0.98;
    if(al>1)al=1;else if(al<0)al=0;
    const a=(al*255)|0;
    if(a<3)continue;
    /* ice is bright and neutral, dust is dark and saturated — a real split,
       not the ±8% blue wobble the old tint gave every band */
    const icy=Math.max(0,Math.min(1,0.5+1.7*tintR[ri]));
    const k=0.78+0.36*icy;
    let r=cr*k+42*icy, g=cg*k+40*icy, b=cb*(0.70+0.48*icy)+34*icy;
    r=Math.min(255,r)|0;g=Math.min(255,g)|0;b=Math.min(255,b)|0;
    b32[y*N+x]=(a<<24)|(b<<16)|(g<<8)|r;
  }
  c2.putImageData(im,0,0);
  return cv.toDataURL();
}

/* --- planet umbra on the ring plane: a soft-edged strip one planet-
   diameter wide, extending anti-sunward from the limb — the shape a
   distant sun actually casts, not a wedge from the center --- */
function ringShadowURL(world){
  const N=512;
  const cv=document.createElement("canvas");
  cv.width=cv.height=N;
  const c2=cv.getContext("2d");
  const im=c2.createImageData(N,N);
  const b32=new Uint32Array(im.data.buffer);
  const half=N/2;
  const rin=half*0.56, rout=half*0.985;
  const pr=half/1.86;                     /* planet radius in ring-plane px */
  const th=world.suns[0].theta;
  const ax=-Math.cos(th), ay=-Math.sin(th);   /* anti-sun axis */
  /* the umbra is its own layer, so it must not darken empty space: a shadow
     needs particles to fall on. Modulated by the ring's own radial density,
     the strip breaks across the divisions instead of hanging over them. */
  const {densR}=ringRadialProfile(world);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const px2=x+0.5-half, py2=y+0.5-half;
    const rr=Math.hypot(px2,py2);
    if(rr<rin||rr>rout)continue;
    const d=px2*ax+py2*ay;                /* how far behind the planet */
    if(d<=0)continue;
    const dv=densR[(((rr-rin)/(rout-rin))*(RING_RSTEPS-1))|0];
    if(dv<0.02)continue;
    const perp=Math.abs(px2*ay-py2*ax);   /* distance off the shadow axis */
    const pen=pr*(0.12+0.12*d/half);      /* penumbra widens with distance */
    let sh=1-Math.max(0,Math.min(1,(perp-pr*0.98+pen)/(2*pen)));
    sh*=Math.max(0,Math.min(1,d/(pr*0.5)));            /* ease in at the limb */
    sh*=Math.min(1,(rr-rin)/6)*Math.min(1,(rout-rr)/6); /* annulus edges */
    sh*=dv<1?dv:1;                        /* only shadow particles that exist */
    const a=(sh*130)|0;
    if(a<3)continue;
    b32[y*N+x]=(a<<24)|(6<<16)|(7<<8)|10;
  }
  c2.putImageData(im,0,0);
  return cv.toDataURL();
}

function buildSatellites(world){
  const L=sunLightVec(world.suns[0]);
  primL=L;
  /* moons */
  moonsHost.innerHTML="";
  moonEls=[];
  world.moonsVis.forEach(m=>{
    const cv=document.createElement("canvas");
    cv.className="moon";
    drawMoon(cv,m,L);
    moonsHost.appendChild(cv);
    moonEls.push({el:cv,m});
  });
  /* suns */
  sunsHost.innerHTML="";
  sunEls=[];
  world.suns.forEach((s2,i)=>{
    const wrap=document.createElement("div");
    wrap.className="sunwrap";
    wrap.style.animationDelay=(i*-6)+"s";
    const c1=document.createElement("canvas");c1.className="sun-cor a";
    const c2=document.createElement("canvas");c2.className="sun-cor b";
    const core=document.createElement("canvas");core.className="sun-core";
    drawSunCorona(c1,s2,0);
    drawSunCorona(c2,s2,1);
    drawSunCore(core,s2);
    c1.style.animationDelay=(-i*7)+"s";
    c2.style.animationDelay=(-i*11)+"s";
    core.style.animationDelay=(-i*4)+"s";
    wrap.append(c1,c2,core);
    sunsHost.appendChild(wrap);
    sunEls.push(wrap);
  });
  layoutSuns();
  /* rings */
  orbWrap.classList.toggle("rings-on",!!world.rings);
  if(world.rings){
    const url=ringTextureURL(world);
    const shUrl=ringShadowURL(world);
    ringTexEls.forEach(el=>el.style.backgroundImage=`url(${url})`);
    ringShadeEls.forEach(el=>el.style.backgroundImage=`url(${shUrl})`);
  }
}

/* place each sun along the exact bearing its light comes from */
function layoutSuns(){
  if(!world||!sunEls.length)return;
  const cx=orbWrap.offsetLeft+orbWrap.clientWidth/2;
  const cy=orbWrap.offsetTop+orbWrap.clientHeight/2;
  const orbR=orbWrap.clientWidth/2;
  const sw=stageEl.clientWidth, shh=stageEl.clientHeight;
  world.suns.forEach((s2,i)=>{
    const el=sunEls[i];if(!el)return;
    const d=orbR*s2.distF;
    let x=cx+Math.cos(s2.theta)*d;
    let y=cy+Math.sin(s2.theta)*d;
    const mg=s2.size*0.95;
    x=Math.max(mg,Math.min(sw-mg,x));
    y=Math.max(mg*0.85,Math.min(shh-mg*0.85-40,y));
    el.style.left=x+"px";
    el.style.top=y+"px";
  });
}
addEventListener("resize",layoutSuns);

function updateMoons(dt){
  const discR=wrapW*0.5*(SHAPE==="cube"?CB.rfrac:1);
  for(const {el,m} of moonEls){
    if(!reducedMotion)m.a+=m.speed*dt;
    const rx=wrapW*0.5*m.dist;
    const depth=Math.sin(m.a);
    const x=Math.cos(m.a)*rx;
    const y=depth*rx*m.incl;
    const sc=1+depth*0.16;
    el.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${sc})`;
    el.style.zIndex=depth>0?4:1;
    /* transiting the disc: cast a soft shadow onto the planet, away from the sun */
    const transit=depth>0&&(x*x+y*y)<discR*discR;
    const f=transit?`drop-shadow(${(-primL[0]*7).toFixed(1)}px ${(-primL[1]*7).toFixed(1)}px 5px rgba(0,0,0,.5))`:"";
    if(el._f!==f){el.style.filter=f;el._f=f}
  }
}

const ringTexEls=document.querySelectorAll(".ring i.tex");
const ringShadeEls=document.querySelectorAll(".ring i.shade");
let ringDeg=74,ringSpin=0;
function updateRingTilt(){
  ringDeg=Math.max(56,Math.min(88,74+tilt*26));
  applyRingTransform();
}
function applyRingTransform(){
  const tf=`translate(-50%,-50%) rotateX(${ringDeg}deg)`;
  ringTexEls.forEach(el=>{el.style.transform=tf+` rotateZ(${ringSpin}deg)`});
  ringShadeEls.forEach(el=>{el.style.transform=tf});
}

/* =========================================================
   MAIN LOOP
========================================================= */
function tick(t){
  const dt=Math.min(50,t-lastFrame);lastFrame=t;
  const base=autoRotate?BASE_VEL:0;
  if(!dragging){
    spinVel=base+(spinVel-base)*Math.exp(-dt/1100);
    rot+=spinVel*dt;
    if(Math.abs(tiltTarget-tilt)>0.0006){
      tilt+=(tiltTarget-tilt)*Math.min(1,dt*0.008);
      updateRingTilt();
    }
  }
  /* ease the wheel's target zoom — framerate-independent, so a 144Hz screen
     and a 60Hz one settle over the same ~150ms */
  if(Math.abs(zoomTarget-zoom)>0.0004){
    zoom+=(zoomTarget-zoom)*(1-Math.exp(-dt/55));
    applyZoom(false);
  }else if(zoom!==zoomTarget){
    zoom=zoomTarget;applyZoom(false);
  }
  cloudDrift+=dt*0.0000032;
  if(!reducedMotion&&orbWrap.classList.contains("rings-on")){
    ringSpin=(ringSpin+dt*0.005)%360;    /* the ring turns; its clumped arcs drift */
    applyRingTransform();
  }
  /* A sphere's remap is cheap and its texture mapping is sensitive to tilt, so
     it re-solves on a fine threshold. A flat world's remap rebuilds the whole
     projection — an order of magnitude more work — while its shading changes
     far more slowly with view angle, so it re-solves on a coarse one. 0.025rad
     is under 1.5 degrees: invisible mid-drag, and it cuts remaps ~4x. */
  const tMoving=dragging||Math.abs(tiltTarget-tilt)>0.0006;
  const tThr=SHAPE==="sphere"?0.006:(tMoving?0.025:0.0005);
  if(SHAPE==="cube"||Math.abs(tilt-computedTilt)>tThr||SHAPE!=="sphere"&&computedTilt===99)recomputeMapping(tilt);
  renderFrame();
  updateMoons(dt);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* =========================================================
   INPUT: drag, flick, tilt, pinch, wheel
========================================================= */
let zoom=1, zoomTarget=1;
const ZOOM_MIN=0.75, ZOOM_MAX=1.5;   /* the same ceiling the button cycles to */
let zoomResT=0;
/* Jump straight to a value — for the button, reset and pinch, which are all
   already continuous or deliberately instant. The wheel eases instead. */
function setZoom(v,smooth){
  zoom=zoomTarget=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,v));
  applyZoom(smooth);
}
function applyZoom(smooth){
  orbWrap.classList.toggle("smooth",smooth);
  orbWrap.classList.toggle("zoomed",zoom>1.02);
  orbWrap.style.transform=`scale(${zoom})`;
  /* ...and actually RE-RENDER at the new size. Debounced, because a wheel or a
     pinch arrives as a stream of small steps and reallocating the buffers on
     every one of them would stutter; the transform gives instant feedback in
     the meantime and the sharp frame lands ~180ms later. */
  clearTimeout(zoomResT);
  zoomResT=setTimeout(()=>{
    if(fitOrbResolution()&&world){
      computeLighting(world);
      computedTilt=99;               /* forces a remap on the next frame */
    }
  },smooth?200:150);
}
const pointers=new Map();
let dragX=0,dragY=0,dragRot=0,dragTilt=0,velTrack=0,lastMX=0,lastMT=0;
let pinchStart=null,pinchZoom=1;

canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    dragging=true;
    dragX=e.clientX;dragY=e.clientY;
    dragRot=rot;dragTilt=tilt;
    velTrack=0;lastMX=e.clientX;lastMT=performance.now();
    canvas.classList.add("grabbing");
  }else{
    dragging=false;
    pinchStart=null;
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const [p1,p2]=[...pointers.values()];
    const dist=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(!pinchStart){pinchStart=dist;pinchZoom=zoom;return}
    setZoom(pinchZoom*dist/pinchStart,false);
    return;
  }
  if(!dragging)return;
  const w=canvas.clientWidth||1;
  rot=dragRot-(e.clientX-dragX)/w*0.75;
  tilt=Math.max(-1.5,Math.min(1.5,dragTilt+(e.clientY-dragY)/w*2.4));
  tiltTarget=tilt;
  updateRingTilt();
  const now=performance.now();
  const mdt=now-lastMT;
  if(mdt>0){
    const inst=-(e.clientX-lastMX)/w*0.75/mdt;
    velTrack=velTrack*0.75+inst*0.25;
    lastMX=e.clientX;lastMT=now;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchStart=null;
  if(dragging&&pointers.size===0){
    dragging=false;
    canvas.classList.remove("grabbing");
    spinVel=Math.max(-0.0045,Math.min(0.0045,velTrack));
  }
  if(pointers.size===0)dragging=false;
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);

/* Wheel and pinch used to run to 2.4 while the button stopped at 1.5, so the
   two controls disagreed about how far in the world goes — and past 1.5 the
   stage clip ate most of it. All three share ZOOM_MIN/ZOOM_MAX now. */
/* The wheel sets a TARGET and the frame loop eases toward it. A wheel arrives
   as a burst of discrete notches; applying each one directly made the zoom
   jump in visible steps. Delta is normalised across deltaMode first, because
   line- and page-mode wheels report tiny numbers that would otherwise barely
   move at all. */
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const px=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*380:e.deltaY;
  zoomTarget=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoomTarget*Math.exp(-px*0.0016)));
},{passive:false});

canvas.addEventListener("dblclick",()=>{
  setZoom(zoom<1.25?ZOOM_MAX:1,true);
});

/* ---------- boot screen ----------
   Held until the first world is actually on the canvas AND the display face has
   loaded, so nothing shows through half-built or re-flows under a font swap.
   A floor stops it flashing on a warm cache; a ceiling stops a stalled webfont
   from holding the page hostage. */
const BOOT_T0=performance.now();
const BOOT_MIN=620, BOOT_MAX=3500;
let bootPending=true;
function bootDone(){
  if(!bootPending)return;
  bootPending=false;
  let fired=false;
  const dismiss=()=>{
    if(fired)return; fired=true;
    const b=el("boot"); if(!b)return;
    setTimeout(()=>{
      b.classList.add("gone");
      setTimeout(()=>{b.hidden=true},600);
    },Math.max(0,BOOT_MIN-(performance.now()-BOOT_T0)));
  };
  try{
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(dismiss,dismiss);
    else dismiss();
  }catch(e){dismiss()}
  setTimeout(dismiss,BOOT_MAX);
}
/* last resort: if the first build never reports in, do not strand the visitor
   behind a loading screen — an unstyled world beats no world */
setTimeout(bootDone,6000);

const SHAPE_LABEL={sphere:"Spherical",disc:"Flat disc — a world with an edge",
  hoop:"A hoop world, open at the centre",

/* "a azure giant star" showed up on one roll in eight — the article has to come
   from the kind's own initial, not be hard-coded */
function art(s){return /^[aeiou]/i.test(s)?"an ":"a "}
function sunsDescOf(w){
  if(w.suns.length===1)return w.suns[0].name+", "+art(w.suns[0].kind)+w.suns[0].kind+" star";
  if(w.suns.length===2)return "Twin suns, "+w.suns[0].name+" and "+w.suns[1].name;
  return "A chaotic trinary: "+w.suns.map(s2=>s2.name).join(", ");
}

function portEntries(){

       "an eelship" and "a wasp" are both right. Any hedge lives in .tag, at the

    ["In orbit now",p.ship.name+", "+art(p.ship.type)+p.ship.type+

/* Keep the title row to exactly one line: the name column shrinks first, and
   the type steps down until it fits. Without it a long name wrapped the stat
   strip onto a second row and moved the whole header 52px. */
function fitTitle(){
  const h=el("planetName");
  h.style.fontSize="";

  if(!avail)return;
  let size=parseFloat(getComputedStyle(h).fontSize)||48;
  const floor=Math.max(20,size*0.55);
  while(h.scrollWidth>avail&&size>floor){
    size=Math.max(floor,size-1);

  }
}

function setWorld(w,keepSphere){

/* ---------- undo / redo for terrain shuffles and climate cycles ----------
   Shuffle mutates the current world in place; the climate button swaps in a
   fresh object. A snapshot therefore keeps the object reference AND the four
   scalars shuffle overwrites, which is enough to restore either kind of edit. */
let histPast=[],histFuture=[];
const HIST_MAX=40;
function histSnap(){
  return {w:world,terrainSeed:world.terrainSeed,ocean:world.ocean,
          contFreq:world.contFreq,detAmp:world.detAmp};
}
function histApply(s){
  world=s.w;
  world.terrainSeed=s.terrainSeed;world.ocean=s.ocean;
  world.contFreq=s.contFreq;world.detAmp=s.detAmp;
  SHAPE=world.shape||"sphere";
  shadeClouds=SHAPE!=="sphere";
  computedTilt=99;
  syncURL();
  rebuild(true);
  syncHist();
}
function histPush(){
  histPast.push(histSnap());
  if(histPast.length>HIST_MAX)histPast.shift();
  histFuture.length=0;
  syncHist();
}
function histReset(){histPast.length=0;histFuture.length=0;syncHist()}
function syncHist(){
  const u=el("btnUndo"),r=el("btnRedo");
  if(!u||!r)return;
  u.disabled=!histPast.length;
  r.disabled=!histFuture.length;
}
function undo(){
  if(!histPast.length)return;
  histFuture.push(histSnap());
  histApply(histPast.pop());
}
function redo(){
  if(!histFuture.length)return;
  histPast.push(histSnap());
  histApply(histFuture.pop());
}

function shuffleTerrain(){
  histPush();
  const rng=mulberry32((Math.random()*2**31)|0);
  world.terrainSeed=(rng()*1e9)|0;
  const cl=world.climate;
  world.ocean=cl.ocean[0]+rng()*(cl.ocean[1]-cl.ocean[0]);
  world.contFreq=1.3+rng()*1.1;
  world.detAmp=0.22+rng()*0.18;
  rebuild(false);
}
function rebuild(fresh){
  orbWrap.style.opacity=".35";
  el("btnShuffle").disabled=true;
  el("btnDiscover").disabled=true;
  setTimeout(()=>{
    /* Both of these change the geometry the rest of the rebuild measures, so
       they are set BEFORE fitOrbResolution reads orbWrap.clientWidth:
         .ringed  shrinks the planet so the ring's full span fits the clipped stage
         .hoop    drops the glow that would otherwise fill the hole             */
    orbWrap.classList.toggle("ringed",!!world.rings);
    orbWrap.classList.toggle("hoop",world.shape==="hoop");
    orbWrap.classList.toggle("round",world.shape==="sphere");   /* contact shadow */
    const resChanged=fitOrbResolution();
    buildTexture(world);
    if((fresh||resChanged)&&SHAPE!=="cube"){
      computeLighting(world);
      /* on a flat world computeLighting alone is only half the lighting;
         force mapFlat to re-fold in the positional half */
      if(world.shape!=="sphere")computedTilt=99;
    }
    renderPanel();
    if(fresh)buildSatellites(world);
    wrapW=orbWrap.clientWidth;
    orbWrap.style.opacity="1";
    el("btnShuffle").disabled=false;
    el("btnDiscover").disabled=false;
    /* one frame later the world is genuinely painted, not merely computed */
    if(bootPending)requestAnimationFrame(()=>requestAnimationFrame(bootDone));
  },30);
}

function seedFromCode(raw){

     reaches "1Z141Z3" in base 36 */

  return{sn:hashSeedString(raw),ci:null};

/* ---------- crystal sphere ---------- */
let sphere=null,sysOpen=false,sysRAF=0;
const NS="http://www.w3.org/2000/svg";
function detachSphere(){
  sphere=null;
  el("btnBackSphere").hidden=true;
}
const isLight=()=>document.documentElement.dataset.theme!=="dark";
/* sRGB relative luminance, for the star's contrast clamp */
function relLum(rgb){
  const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};
  return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
}
const ORR_PAPER=[239,228,203];
/* Darken a colour until it clears `ratio` against the parchment. A pale cream
   star at full brightness has no edge at all on cream paper — it reads as a
   smudge, not as a body — so its fill is pulled down until it is a real mark. */
function contrastFill(rgb,ratio){
  const need=(relLum(ORR_PAPER)+0.05)/ratio-0.05;
  if(relLum(rgb)<=need)return rgb;
  let lo=0,hi=1;
  for(let i=0;i<20;i++){
    const m=(lo+hi)/2;
    if(relLum([rgb[0]*m,rgb[1]*m,rgb[2]*m])>need)hi=m;else lo=m;
  }
  return [rgb[0]*lo,rgb[1]*lo,rgb[2]*lo];
}
function climateColor(w){
  const m=/rgba?\(([^)]+)\)/.exec(w.climate.glow);
  if(!m)return "#888";
  let [r,g,b]=m[1].split(",").map(Number);
  if(isLight()){
    /* mix paper in and drop the chroma, so the dots stop being the loudest
       marks on the page; the 1px ink ring is what makes them read */
    const l=0.2126*r+0.7152*g+0.0722*b, k=0.28;
    r=(l+(r-l)*0.80)*(1-k)+ORR_PAPER[0]*k;
    g=(l+(g-l)*0.80)*(1-k)+ORR_PAPER[1]*k;
    b=(l+(b-l)*0.80)*(1-k)+ORR_PAPER[2]*k;
  }
  return `rgb(${r|0},${g|0},${b|0})`;
}
let orrLabW=[],orrSpot=[];
function buildOrrery(){
  const svg=el("orrery");
  svg.innerHTML="";
  const cx=50,cy=50;
  const light=isLight();
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n};
  /* ---- the star, as an object rather than a blur ---- */
  const st=sphere.star;
  const glow=`rgb(${st.core[0]},${st.core[1]},${st.core[2]})`;
  const cf=light?contrastFill(st.core,2.6):st.core;
  const sc=`rgb(${cf[0]|0},${cf[1]|0},${cf[2]|0})`;
  const defs=mk("defs",{});
  defs.innerHTML=`<radialGradient id="starG">`+
    `<stop offset="0" stop-color="${glow}" stop-opacity="${light?.5:1}"/>`+
    `<stop offset=".45" stop-color="${glow}" stop-opacity="${light?.26:.55}"/>`+
    `<stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient>`;
  svg.appendChild(defs);
  svg.appendChild(mk("circle",{cx,cy,r:8,fill:"url(#starG)",class:"orr-star"}));
  const rays=mk("g",{class:"orr-rays"});
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6, r0=3.4, r1=i%2?4.5:5.9;
    rays.appendChild(mk("line",{x1:(cx+Math.cos(a)*r0).toFixed(2),y1:(cy+Math.sin(a)*r0).toFixed(2),
                                x2:(cx+Math.cos(a)*r1).toFixed(2),y2:(cy+Math.sin(a)*r1).toFixed(2)}));
  }
  svg.appendChild(rays);
  svg.appendChild(mk("circle",{cx,cy,r:2.6,fill:sc,class:"orr-body"}));
  /* orbits + worlds */
  orrLabW=[];orrSpot=[];
  sphere.worlds.forEach((w,i)=>{
    const R=w.orbitR*44;
    svg.appendChild(mk("circle",{cx,cy,r:R,class:"orb-line"+(i%2?" dash":"")}));
    const g=mk("g",{class:"orr-world","data-i":i});
    g.appendChild(mk("circle",{class:"halo",cx:0,cy:0,r:4.6}));
    g.appendChild(mk("line",{class:"orr-lead",x1:0,y1:0,x2:0,y2:0,visibility:"hidden"}));
    w._r=2.1+Math.min(1.5,w.moonCount*0.35);
    w._x=50+Math.cos(w.orbitA)*R; w._y=50+Math.sin(w.orbitA)*R;
    g.appendChild(mk("circle",{class:"body",cx:0,cy:0,r:w._r,fill:climateColor(w)}));
    if(w.rings)g.appendChild(mk("ellipse",{cx:0,cy:0,rx:4,ry:1.2,fill:"none",stroke:climateColor(w),"stroke-width":.3,opacity:.85}));
    const tx=mk("text",{x:0,y:6,"text-anchor":"middle"});
    tx.textContent=w.name+w.numeral;
    g.appendChild(tx);
    svg.appendChild(g);
    orrLabW.push(0);orrSpot.push(-1);
  });
  /* measure each name once, in user units, for the placement pass */
  svg.querySelectorAll(".orr-world text").forEach((t,i)=>{
    try{orrLabW[i]=t.getComputedTextLength()||t.textContent.length*1.25}
    catch(e){orrLabW[i]=t.textContent.length*1.25}
  });
  el("sphereName").textContent=sphere.name;
  el("sphereSeedText").textContent="Sphere seed "+sphere.code;
  el("sysKicker").textContent=sphere.worlds.length+" charted worlds";
  el("sysRoster").innerHTML=sphere.worlds.map((w,i)=>
    `<button class="ros" data-i="${i}">
       <i style="background:${climateColor(w)}"></i>
       <b>${esc(w.name+w.numeral)}</b>
       <u>${esc(w.climate.label)}</u>
     </button>`).join("");
}
/* ---- label placement --------------------------------------------------------
   Every label used to be pinned 6.4 units below its dot, so the moment two
   worlds came near each other in their orbits the names collided — and an orbit
   ring ran straight through the letterforms of whichever one was inside it.
   Each label now tries below / above / right / left (then two further-out
   fallbacks) and takes the first placement whose box clears the star, every
   dot, and every label already placed. If none is clean it takes the least-bad
   one, and any placement past the first gets a leader tick so the name is still
   obviously attached to its world. */
const LBL_SPOTS=[
  {dx:0,   dy:6.0,  a:"middle"},
  {dx:0,   dy:-4.2, a:"middle"},
  {dx:4.8, dy:0.9,  a:"start"},
  {dx:-4.8,dy:0.9,  a:"end"},
  {dx:3.8, dy:-3.0, a:"start"},
  {dx:-3.8,dy:-3.0, a:"end"},
  {dx:0,   dy:9.0,  a:"middle"},
  {dx:0,   dy:-7.2, a:"middle"}
];
function placeOrreryLabels(gs){
  const boxes=[{x0:44,x1:56,y0:44,y1:56}];        /* the star and its rays */
  for(const w of sphere.worlds){
    boxes.push({x0:w._x-w._r-0.5,x1:w._x+w._r+0.5,y0:w._y-w._r-0.5,y1:w._y+w._r+0.5});
  }
  sphere.worlds.forEach((w,i)=>{
    const g=gs[i];if(!g)return;
    const tw=orrLabW[i]||8;
    let bi=0,bBox=null,bPen=1e9;
    for(let k=0;k<LBL_SPOTS.length;k++){
      const sp=LBL_SPOTS[k];
      const bx=w._x+sp.dx, by=w._y+sp.dy;
      const x0=sp.a==="middle"?bx-tw/2:sp.a==="start"?bx:bx-tw;
      const box={x0:x0-0.5,x1:x0+tw+0.5,y0:by-2.1,y1:by+0.8};
      let pen=0;
      if(box.x0<0.5)pen+=(0.5-box.x0)*9;
      if(box.x1>99.5)pen+=(box.x1-99.5)*9;
      if(box.y0<0.5)pen+=(0.5-box.y0)*9;
      if(box.y1>99.5)pen+=(box.y1-99.5)*9;
      for(const o of boxes){
        const ox=Math.min(box.x1,o.x1)-Math.max(box.x0,o.x0);
        const oy=Math.min(box.y1,o.y1)-Math.max(box.y0,o.y0);
        if(ox>0&&oy>0)pen+=ox*oy;
      }
      if(pen<bPen){bPen=pen;bi=k;bBox=box}
      if(pen<0.01)break;
    }
    boxes.push(bBox);
    if(orrSpot[i]===bi)return;                     /* nothing to rewrite */
    orrSpot[i]=bi;
    const sp=LBL_SPOTS[bi];
    const t=g.querySelector("text");
    t.setAttribute("x",sp.dx);t.setAttribute("y",sp.dy);
    t.setAttribute("text-anchor",sp.a);
    const ld=g.querySelector(".orr-lead");
    if(bi===0){ld.setAttribute("visibility","hidden")}
    else{
      const m=Math.hypot(sp.dx,sp.dy)||1;
      const ux=sp.dx/m, uy=sp.dy/m;
      ld.setAttribute("x1",(ux*(w._r+0.5)).toFixed(2));
      ld.setAttribute("y1",(uy*(w._r+0.5)).toFixed(2));
      ld.setAttribute("x2",(sp.dx-ux*1.4).toFixed(2));
      ld.setAttribute("y2",(sp.dy-uy*1.4-(sp.a==="middle"?(sp.dy>0?1.5:-0.2):0)).toFixed(2));
      ld.setAttribute("visibility","visible");
    }
  });
}
function drawOrreryFrame(dt){
  const svg=el("orrery");
  const gs=svg.querySelectorAll(".orr-world");
  sphere.worlds.forEach((w,i)=>{
    if(!reducedMotion)w.orbitA+=w.orbitV*dt;
    const R=w.orbitR*44;
    w._x=50+Math.cos(w.orbitA)*R; w._y=50+Math.sin(w.orbitA)*R;
    if(gs[i])gs[i].setAttribute("transform",`translate(${w._x.toFixed(2)},${w._y.toFixed(2)})`);
  });
  placeOrreryLabels(gs);
}
let sysLast=0;
function sysTick(t){
  if(!sysOpen)return;
  const dt=Math.min(60,t-sysLast);sysLast=t;
  drawOrreryFrame(dt);
  sysRAF=requestAnimationFrame(sysTick);
}
function openSystem(){
  if(!sphere)sphere=generateSphere((Math.random()*2**31)|0);
  buildOrrery();
  sysOpen=true;
  el("systemView").hidden=false;
  document.querySelector(".hero").hidden=true;
  el("btnSystem").classList.add("on");
  sysLast=performance.now();
  sysRAF=requestAnimationFrame(sysTick);
}
function closeSystem(){
  sysOpen=false;cancelAnimationFrame(sysRAF);
  el("systemView").hidden=true;
  document.querySelector(".hero").hidden=false;
  el("btnSystem").classList.remove("on");
}
function visitWorld(i){
  const w=sphere.worlds[i];
  closeSystem();
  setWorld(w,true);
  el("btnBackSphere").hidden=false;
  el("btnBackSphere").textContent="◂ "+sphere.name;
}
el("btnSystem").addEventListener("click",()=>{sysOpen?closeSystem():openSystem()});
el("btnCloseSystem").addEventListener("click",closeSystem);
el("btnBackSphere").addEventListener("click",openSystem);
el("btnNewSphere").addEventListener("click",()=>{
  sphere=generateSphere((Math.random()*2**31)|0);
  buildOrrery();
});
el("orrery").addEventListener("click",e=>{
  const g=e.target.closest(".orr-world");
  if(g)visitWorld(+g.dataset.i);
});
el("sysRoster").addEventListener("click",e=>{
  const b=e.target.closest(".ros");
  if(b)visitWorld(+b.dataset.i);
});
el("sphereSeed").addEventListener("click",()=>{
  const raw=prompt("Sphere seed",sphere?sphere.code:"");
  if(raw==null)return;
  const t=raw.trim();if(!t)return;
  const m=t.toUpperCase().match(/^[0-9A-Z]{1,6}$/);
  sphere=generateSphere(m?parseInt(t,36):hashSeedString(t));
  buildOrrery();
});

/* seed entry: click the seed line, type a code (or any phrase), Enter */
const seedBtn=el("planetSeed");
const SEED_ICON='<svg viewBox="0 0 24 24"><path d="M4 20l4-1L20 7l-3-3L5 16l-1 4ZM14 6l3 3"/></svg>';
seedBtn.addEventListener("click",()=>{
  if(seedBtn.querySelector("input"))return;
  seedBtn.innerHTML="";
  const inp=document.createElement("input");
  inp.className="seed-input";
  inp.value=world?world.code:"";
  inp.spellcheck=false;
  inp.placeholder="Enter a seed";
  seedBtn.appendChild(inp);
  inp.focus();inp.select();
  let closed=false;
  const done=apply=>{
    if(closed)return;closed=true;
    const raw=inp.value.trim();
    seedBtn.innerHTML='<span id="seedText"></span>'+SEED_ICON;
    if(apply&&raw){
      const {sn,ci}=seedFromCode(raw);
      setWorld(generateWorld(sn,ci));
      return;
    }
    if(world)el("seedText").textContent="Seed "+world.code;
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter")done(true);
    else if(e.key==="Escape")done(false);
  });
  inp.addEventListener("blur",()=>done(false));
});

/* theme */
const root=document.documentElement;
if(window.matchMedia("(prefers-color-scheme: dark)").matches)root.dataset.theme="dark";
el("btnTheme").addEventListener("click",()=>{
  root.dataset.theme=root.dataset.theme==="dark"?"":"dark";
  /* the orrery's star fill and dot tints are computed per theme in JS, not CSS,
     so a toggle while the chart is open has to redraw it */
  if(sysOpen&&sphere)buildOrrery();
  /* the ambient floor is baked per theme, so the planet has to be re-lit and
     re-mapped — a cube re-shades in mapCube, a flat world in mapFlat, and a
     sphere here directly. computedTilt=99 makes tick() rebuild on the next frame. */
  if(!world)return;
  if(SHAPE==="sphere")computeLighting(world);  /* flat re-lights in mapFlat, cube in mapCube */
  CB.wref=null;
  computedTilt=99;
});

/* star specks */
(function stars(){
  const host=el("stars");
  const r=mulberry32(77);
  for(let i=0;i<34;i++){
    const s2=document.createElement("i");
    s2.style.left=(r()*100)+"%";
    s2.style.top=(r()*100)+"%";
    const sz=(1.5+r()*2.2).toFixed(1);
    s2.style.width=s2.style.height=sz+"px";
    s2.style.setProperty("--o",(0.06+r()*0.14).toFixed(2));
    host.appendChild(s2);
  }
})();

/* hint fades after first interaction */
let hinted=false;
canvas.addEventListener("pointerdown",()=>{
  if(hinted)return;hinted=true;
  const h=el("hint");
  setTimeout(()=>{h.style.transition="opacity 1s ease";h.style.opacity="0"},2500);
},{once:false});

/* boot — a ?seed= or ?sphere= link restores exactly what it names */
syncSavedCount();
(function boot(){
  let q;
  try{q=new URLSearchParams(location.search)}catch(e){q=new URLSearchParams("")}
  const sph=q.get("sphere"), sd=q.get("world")||q.get("seed");
  if(sph){
    const m=sph.toUpperCase().match(/^[0-9A-Z]{1,6}$/);
    sphere=generateSphere(m?parseInt(sph,36):hashSeedString(sph));
    const i=sd?sphere.worlds.findIndex(w=>w.code===sd.toUpperCase()):-1;
    if(i>=0){
      setWorld(sphere.worlds[i],true);
      el("btnBackSphere").hidden=false;
      el("btnBackSphere").textContent="◂ "+sphere.name;
      return;
    }
    openSystem();
    setWorld(sphere.worlds[0],true);
    el("btnBackSphere").hidden=false;
    el("btnBackSphere").textContent="◂ "+sphere.name;
    return;
  }
  if(sd){
    const {sn,ci}=seedFromCode(sd);
    setWorld(generateWorld(sn,ci));
    return;
  }
  newWorld();
})();
</script>
